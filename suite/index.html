<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SUITE · 一体化工作台</title>
<style>
:root{
  --bg:#05070c; --accent:#2fe3b4; --violet:#a98bff; --cyan:#31c9ff;
  --glass:rgba(255,255,255,.055); --line:rgba(255,255,255,.10); --txt:#e8eef5; --dim:#8fa2b5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(120% 80% at 12% 0%, #0b1620 0%, #05070c 55%, #04060a 100%);
  color:var(--txt);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.5;pointer-events:none;z-index:0}
.b1{width:46vw;height:46vw;left:-10vw;top:-14vw;background:#2fe3b4;animation:fl 18s ease-in-out infinite}
.b2{width:40vw;height:40vw;right:-12vw;bottom:-16vw;background:#a98bff;animation:fl 22s ease-in-out infinite reverse}
.b3{width:32vw;height:32vw;left:42%;top:-12vw;background:#31c9ff;opacity:.32;animation:fl 26s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(4vw,5vh,0) scale(1.12)}}
.wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column}
header.top{
  display:flex;align-items:center;gap:14px;padding:10px 16px;flex:0 0 auto;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  background:rgba(8,12,18,.55);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.dot{width:26px;height:26px;border-radius:9px;flex:0 0 auto;
  background:conic-gradient(from 210deg,#2fe3b4,#31c9ff,#a98bff,#2fe3b4);
  box-shadow:0 0 18px rgba(47,227,180,.5)}
.brand b{font-size:15px;letter-spacing:.14em;display:block;line-height:1.2}
.brand span{font-size:10.5px;color:var(--dim);letter-spacing:.06em}
.switch{margin-left:auto;display:flex;gap:6px;padding:5px;border-radius:16px;
  background:rgba(255,255,255,.05);border:1px solid var(--line)}
.sw{display:flex;align-items:center;gap:9px;padding:8px 15px;border-radius:12px;border:0;
  background:transparent;color:#9db0c2;cursor:pointer;font:inherit;transition:.28s;text-align:left}
.sw i{font-style:normal;font-size:16px;line-height:1}
.sw b{font-size:13px;font-weight:600;letter-spacing:.05em;display:block;line-height:1.2}
.sw small{display:block;font-size:10px;opacity:.62;letter-spacing:.04em}
.sw:hover{color:#dbe7f2;background:rgba(255,255,255,.05)}
.sw.on{color:#04120f;background:linear-gradient(135deg,#2fe3b4,#31c9ff);
  box-shadow:0 6px 22px rgba(47,227,180,.32)}
.sw.on small{opacity:.78}
.stage{position:relative;flex:1 1 auto;min-height:0}
.frame{position:absolute;inset:0;border:0;width:100%;height:100%;
  opacity:0;pointer-events:none;transform:scale(.985);
  transition:opacity .38s ease, transform .38s ease}
.frame.on{opacity:1;pointer-events:auto;transform:none}
.loader{position:absolute;inset:0;display:grid;place-items:center;z-index:3;
  background:#05070c;transition:opacity .4s}
.loader.hide{opacity:0;pointer-events:none}
.spin{width:34px;height:34px;border-radius:50%;
  border:2px solid rgba(255,255,255,.14);border-top-color:#2fe3b4;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:600px){
  header.top{flex-wrap:wrap;gap:8px;padding:8px 10px}
  .brand span{display:none}
  .brand b{font-size:13px}
  .switch{margin-left:0;width:100%;justify-content:space-between}
  .sw{flex:1;justify-content:center;padding:7px 8px}
  .sw small{display:none}
}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="dot"></div>
      <div><b>SUITE</b><span>一体化工作台 · Unified Workspace</span></div>
    </div>
    <nav class="switch" id="switch"></nav>
  </header>
  <div class="stage" id="stage">
    <div class="loader" id="loader"><div class="spin"></div></div>
  </div>
</div>

var ORDER = ['axiom','nexus'];
var frames = {}, loaded = {}, active = null;
var stageEl = document.getElementById('stage');
var swEl = document.getElementById('switch');
var loaderEl = document.getElementById('loader');

function b64t(b){
  var s = atob(b), n = s.length, u = new Uint8Array(n);
  for (var i = 0; i < n; i++) u[i] = s.charCodeAt(i);
  if (window.TextDecoder) return new TextDecoder('utf-8').decode(u);
  return decodeURIComponent(escape(s));
}
function buildSwitch(){
  var h = '';
  for (var i = 0; i < ORDER.length; i++){
    var k = ORDER[i], a = SRC[k];
    h += '<button class="sw" type="button" data-k="' + k + '" style="--ca:' + a.accent + '">' +
         '<i>' + a.icon + '</i><span><b>' + a.name + '</b><small>' + a.sub + '</small></span></button>';
  }
  swEl.innerHTML = h;
  swEl.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('.sw') : null;
    if (b) select(b.getAttribute('data-k'));
  });
}
function ensure(k){
  if (frames[k]) return frames[k];
  var f = document.createElement('iframe');
  f.className = 'frame';
  f.setAttribute('title', SRC[k].name + ' · ' + SRC[k].sub);
  f.addEventListener('load', function(){
    loaded[k] = true;
    if (k === active) hideLoader();
  });
  f.srcdoc = b64t(SRC[k].b64);
  stageEl.appendChild(f);
  frames[k] = f;
  return f;
}
function showLoader(){ loaderEl.classList.remove('hide'); }
function hideLoader(){ loaderEl.classList.add('hide'); }
function select(k){
  if (ORDER.indexOf(k) < 0) k = ORDER[0];
  active = k;
  ensure(k);
  for (var i = 0; i < ORDER.length; i++){
    var f = frames[ORDER[i]];
    if (f) f.classList.toggle('on', ORDER[i] === k);
  }
  var bs = swEl.querySelectorAll('.sw');
  for (var j = 0; j < bs.length; j++) bs[j].classList.toggle('on', bs[j].getAttribute('data-k') === k);
  if (loaded[k]) hideLoader(); else showLoader();
  try { localStorage.setItem('suite_active', k); } catch(e){}
}
document.addEventListener('keydown', function(e){
  if (!e.altKey) return;
  if (e.key === '1') select('axiom');
  if (e.key === '2') select('nexus');
});
function boot(){
  buildSwitch();
  var start = 'axiom';
  try { start = localStorage.getItem('suite_active') || 'axiom'; } catch(e){}
  if (ORDER.indexOf(start) < 0) start = 'axiom';
  select(start);
}
boot();
</script>
