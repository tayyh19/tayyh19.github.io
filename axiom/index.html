<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AXIOM · 液态玻璃商务控制台</title>
<style>
:root{
  --accent:#7c8cff; --accent2:#b06cff;
  --cyan:#39e0f0; --green:#33d17a; --red:#ff5c7a; --amber:#ffb64d;
  --text:#eef2fb; --dim:#93a0bd; --dim2:#5f6c88;
  --glass:rgba(255,255,255,.055);
  --glass2:rgba(255,255,255,.085);
  --brd:rgba(255,255,255,.14);
  --brd2:rgba(255,255,255,.26);
  --r:22px; --rm:16px; --rs:11px;
  --blur:22px;
  --shadow:0 22px 54px rgba(2,6,20,.5);
  --navw:252px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px;color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background:
    radial-gradient(1100px 720px at 10% -10%, rgba(124,140,255,.32), transparent 62%),
    radial-gradient(900px 660px at 96% 2%, rgba(176,108,255,.26), transparent 60%),
    radial-gradient(1000px 780px at 62% 112%, rgba(57,224,240,.16), transparent 64%),
    #060a12;
  background-attachment:fixed;
}
a{color:inherit;text-decoration:none}
button,input,select{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:20px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 环境光斑 ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(72px);opacity:.5}
.b1{width:520px;height:520px;left:-140px;top:-160px;background:radial-gradient(circle,#6f7cff,transparent 68%);animation:fl1 22s ease-in-out infinite}
.b2{width:460px;height:460px;right:-120px;top:6%;background:radial-gradient(circle,#b06cff,transparent 68%);animation:fl2 26s ease-in-out infinite}
.b3{width:560px;height:560px;left:32%;bottom:-280px;background:radial-gradient(circle,#2ee6c0,transparent 70%);animation:fl3 30s ease-in-out infinite}
@keyframes fl1{50%{transform:translate(70px,60px) scale(1.12)}}
@keyframes fl2{50%{transform:translate(-60px,80px) scale(1.15)}}
@keyframes fl3{50%{transform:translate(50px,-60px) scale(1.1)}}

/* ---------- 玻璃基类 ---------- */
.glass{
  background:linear-gradient(180deg,var(--glass2),var(--glass));
  border:1px solid var(--brd);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(180%);
  backdrop-filter:blur(var(--blur)) saturate(180%);
  border-radius:var(--r);
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.16), inset 0 -1px 0 rgba(255,255,255,.03);
}

/* ---------- 侧边栏 ---------- */
.side{
  position:fixed;left:0;top:0;bottom:0;width:var(--navw);z-index:60;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.028));
  -webkit-backdrop-filter:blur(26px) saturate(180%);
  backdrop-filter:blur(26px) saturate(180%);
  border-right:1px solid var(--brd);
  box-shadow:0 0 60px rgba(2,6,20,.45), inset -1px 0 0 rgba(255,255,255,.06);
  transition:width .28s cubic-bezier(.4,0,.2,1), transform .3s;
}
.brand{display:flex;align-items:center;gap:12px;padding:20px 18px 16px;overflow:hidden}
.logo{width:38px;height:38px;border-radius:12px;flex:0 0 38px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:17px;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 8px 22px rgba(124,140,255,.5), inset 0 1px 0 rgba(255,255,255,.5)}
.brand-txt b{font-size:15.5px;letter-spacing:.08em;display:block}
.brand-txt span{font-size:8.5px;letter-spacing:.3em;color:var(--dim2);margin-top:3px;display:block;white-space:nowrap}
.nav{padding:6px 12px;flex:1;overflow-y:auto;overflow-x:hidden}
.grp{font-size:10px;letter-spacing:.18em;color:var(--dim2);padding:14px 12px 7px;text-transform:uppercase}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--dim);
  cursor:pointer;transition:.18s;margin-bottom:3px;white-space:nowrap;position:relative;overflow:hidden}
.item:hover{background:rgba(255,255,255,.07);color:var(--text);transform:translateX(2px)}
.item.on{color:#fff;background:linear-gradient(90deg,rgba(124,140,255,.30),rgba(124,140,255,.06));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 6px 18px rgba(124,140,255,.18)}
.item.on::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent)}
.item svg{width:18px;height:18px;flex:0 0 18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side-foot{padding:12px 14px;border-top:1px solid var(--brd);display:flex;align-items:center;gap:11px;overflow:hidden}
.avt{width:36px;height:36px;border-radius:50%;flex:0 0 36px;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;background:linear-gradient(135deg,#1e293b,#3b4a68);border:1px solid var(--brd2)}
.side-foot .meta b{font-size:13px;display:block;white-space:nowrap}
.side-foot .meta span{font-size:10.5px;color:var(--dim2);white-space:nowrap}

/* ---------- 主区 ---------- */
.main{margin-left:var(--navw);min-width:0;transition:margin .28s cubic-bezier(.4,0,.2,1)}
.top{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;
  padding:12px clamp(12px,2vw,24px);
  background:linear-gradient(180deg,rgba(12,17,28,.72),rgba(12,17,28,.42));
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--brd);
}
.top.scrolled{box-shadow:0 14px 34px rgba(2,6,20,.42)}
.icon-btn{width:40px;height:40px;flex:0 0 40px;border-radius:12px;
  background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));
  border:1px solid var(--brd);display:flex;align-items:center;justify-content:center;cursor:pointer;
  color:var(--dim);transition:.18s;position:relative}
.icon-btn:hover{color:var(--text);border-color:var(--brd2);transform:translateY(-1px)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn .dot{position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--red);
  box-shadow:0 0 0 2px #0c111c, 0 0 10px var(--red);transition:.2s}
.icon-btn.read .dot{opacity:0;transform:scale(0)}
.crumb{min-width:0;flex:0 1 auto}
.crumb b{font-size:15px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb small{font-size:11px;color:var(--dim2);margin-top:2px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{position:relative;flex:1 1 200px;max-width:400px;min-width:0;margin-left:auto;
  display:flex;align-items:center;gap:9px;
  background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));
  border:1px solid var(--brd);border-radius:12px;padding:9px 13px;color:var(--dim)}
.search:focus-within{border-color:var(--brd2);box-shadow:0 0 0 3px rgba(124,140,255,.18)}
.search svg{width:16px;height:16px;flex:0 0 16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.search input{background:none;border:none;outline:none;color:var(--text);font-size:13px;width:100%;min-width:0}
.search input::placeholder{color:var(--dim2)}
.search kbd{font-size:10px;color:var(--dim2);border:1px solid var(--brd);border-radius:5px;padding:1px 5px;white-space:nowrap}
.cta{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;font-weight:600;
  font-size:13px;padding:10px 17px;border-radius:12px;cursor:pointer;transition:.18s;white-space:nowrap;
  box-shadow:0 8px 22px rgba(124,140,255,.4), inset 0 1px 0 rgba(255,255,255,.35);position:relative;overflow:hidden}
.cta .ct{font-weight:700}
.cta .cta-txt{margin-left:3px}
.cta:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(124,140,255,.5)}
.cta:active{transform:scale(.96)}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rip .6s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.wrap{padding:clamp(14px,2.2vw,26px);max-width:1480px;margin:0 auto;width:100%;min-width:0}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.kpi{padding:18px;position:relative;overflow:hidden;transition:.25s;cursor:pointer}
.kpi::after{content:'';position:absolute;right:14px;top:14px;width:6px;height:6px;border-radius:50%;background:var(--dim2);opacity:.45;transition:.2s}
.kpi:hover::after{background:var(--accent);opacity:1;box-shadow:0 0 10px var(--accent)}
.kpi.pulse{animation:kpiPulse .5s ease}
@keyframes kpiPulse{0%{transform:scale(1)}45%{transform:scale(.965)}100%{transform:scale(1)}}
.kpi:hover{transform:translateY(-3px);border-color:var(--brd2)}
.kpi .lb{font-size:11.5px;color:var(--dim);letter-spacing:.04em;display:flex;align-items:center;gap:7px}
.kpi .lb i{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.kpi .val{font-size:27px;font-weight:700;margin:12px 0 9px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .val u{font-size:14px;font-weight:500;color:var(--dim);text-decoration:none;margin-left:3px}
.kpi .foot{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.trend{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:7px;display:inline-flex;align-items:center;gap:3px}
.trend.up{color:var(--green);background:rgba(51,209,122,.14)}
.trend.dn{color:var(--red);background:rgba(255,92,122,.14)}
.kpi .vs{font-size:11px;color:var(--dim2)}
.kpi .spark{margin-top:6px;height:36px}
.kpi .spark canvas{width:100%;height:100%;display:block}

/* ---------- 栅格 ---------- */
.grid-main{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px}
.card{padding:0;overflow:hidden}
.panel-h{display:flex;align-items:center;gap:10px;padding:17px 19px 5px;flex-wrap:wrap}
.panel-h b{font-size:14px;font-weight:600}
.panel-h span{font-size:11.5px;color:var(--dim2)}
.panel-h .r{margin-left:auto;display:flex;gap:7px}
.seg{display:flex;background:rgba(255,255,255,.05);border:1px solid var(--brd);border-radius:10px;padding:2.5px}
.seg button{background:none;border:none;color:var(--dim);font-size:11.5px;padding:5px 12px;border-radius:7px;cursor:pointer;transition:.15s}
.seg button.on{background:linear-gradient(180deg,rgba(124,140,255,.42),rgba(124,140,255,.22));color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.chart{position:relative;height:250px;padding:8px 10px 12px}
.chart canvas{width:100%;height:100%;display:block}
.donut-wrap{display:flex;align-items:center;gap:10px;padding:6px 14px 16px;flex-wrap:wrap}
.donut-wrap .cvs{flex:0 0 172px;height:172px;position:relative}
.donut-wrap canvas{width:100%;height:100%}
.legend{flex:1;min-width:130px;display:flex;flex-direction:column;gap:11px}
.lg{display:flex;align-items:center;gap:9px;font-size:12.5px;cursor:pointer;transition:.15s;padding:3px 5px;border-radius:8px}
.lg:hover{background:rgba(255,255,255,.05)}
.lg.off{opacity:.38}
.lg i{width:11px;height:11px;border-radius:4px;flex:0 0 11px}
.lg b{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--dim)}
.lg em{font-style:normal;font-weight:600}

/* ---------- 表格 ---------- */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;min-width:640px;border-collapse:collapse;font-size:12.8px}
.tbl th{text-align:left;font-weight:500;color:var(--dim2);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;padding:11px 18px;border-bottom:1px solid var(--brd);white-space:nowrap;cursor:pointer;user-select:none;transition:.15s}
.tbl th:hover{color:var(--text)}
.tbl th .arw{opacity:.4;font-size:9px;margin-left:4px}
.tbl td{padding:13px 18px;border-bottom:1px solid rgba(255,255,255,.05);color:var(--dim);white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{cursor:pointer;transition:.15s}
.tbl tbody tr:hover td{background:rgba(124,140,255,.09)}
.tbl td b{color:var(--text);font-weight:600}
.tbl .num{font-variant-numeric:tabular-nums;color:var(--text);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.b-green{color:var(--green);background:rgba(51,209,122,.14)}
.b-blue{color:#7fb2ff;background:rgba(127,178,255,.14)}
.b-amber{color:var(--amber);background:rgba(255,182,77,.14)}
.b-red{color:var(--red);background:rgba(255,92,122,.14)}
.b-gray{color:var(--dim);background:rgba(255,255,255,.07)}

/* ---------- 客户 ---------- */
.clients{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.client{padding:18px;transition:.25s;cursor:pointer}
.client:hover{transform:translateY(-3px);border-color:var(--brd2)}
.client .hd{display:flex;align-items:center;gap:12px;margin-bottom:15px}
.client .lg2{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:0 0 44px}
.client .hd b{font-size:14px;display:block}
.client .hd span{font-size:11px;color:var(--dim2)}
.client .st{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:9px}
.client .st b{color:var(--text);font-variant-numeric:tabular-nums}
.bar-bg{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.bar-fg{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--cyan));transition:width .9s cubic-bezier(.2,.8,.2,1)}

/* ---------- 动态 ---------- */
.feed{padding:10px 19px 18px}
.fd{display:flex;gap:13px;padding:11px 0;position:relative}
.fd:not(:last-child)::before{content:'';position:absolute;left:5px;top:27px;bottom:-2px;width:1px;background:var(--brd)}
.fd i{width:11px;height:11px;border-radius:50%;flex:0 0 11px;margin-top:3px;z-index:1}
.fd p{font-size:12.6px;color:var(--dim);line-height:1.55}
.fd p b{color:var(--text);font-weight:600}
.fd time{display:block;font-size:10.5px;color:var(--dim2);margin-top:3px}
.empty{padding:46px;text-align:center;color:var(--dim2);font-size:13px}
.toolbar{display:flex;gap:8px;align-items:center;padding:8px 18px 14px;flex-wrap:wrap}
.fchip{font-size:11.5px;padding:7px 13px;border-radius:999px;border:1px solid var(--brd);
  color:var(--dim);cursor:pointer;transition:.15s;white-space:nowrap}
.fchip:hover{color:var(--text);border-color:var(--brd2)}
.fchip.on{background:linear-gradient(180deg,rgba(124,140,255,.42),rgba(124,140,255,.2));color:#fff;border-color:transparent}

/* ---------- 设置行 ---------- */
.srow{display:flex;align-items:center;gap:14px;padding:15px 19px;border-bottom:1px solid rgba(255,255,255,.05);transition:.15s;flex-wrap:wrap}
.srow .st1{flex:1 1 150px;min-width:0}
.srow:hover{background:rgba(255,255,255,.035)}
.srow .st1 b{font-size:13px;display:block}
.srow .st1 span{font-size:11.5px;color:var(--dim2);margin-top:3px;display:block}
.srow .act{margin-left:auto;color:var(--accent);font-size:12px;font-weight:600;cursor:pointer}
.swatches{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.18s}
.sw:hover{transform:scale(1.12)}
.sw.on{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.15)}
.slider{-webkit-appearance:none;appearance:none;width:150px;height:5px;border-radius:5px;
  background:rgba(255,255,255,.14);outline:none;cursor:pointer}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 2px 8px rgba(0,0,0,.4);cursor:pointer}

/* ---------- 浮层：搜索下拉 / 命令面板 / 通知 / 抽屉 / 弹窗 ---------- */
.results{position:absolute;left:auto;right:0;top:calc(100% + 8px);min-width:min(340px,88vw);max-width:min(420px,92vw);
  background:linear-gradient(180deg,rgba(24,30,46,.96),rgba(16,21,34,.96));
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--brd);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.6);
  max-height:340px;overflow-y:auto;display:none;z-index:60}
.results.on{display:block;animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}}
.res{display:flex;align-items:center;gap:11px;padding:11px 15px;cursor:pointer;font-size:13px;color:var(--dim);transition:.12s}
.res:hover,.res.hl{background:rgba(124,140,255,.16);color:var(--text)}
.res-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .ic{width:26px;height:26px;border-radius:8px;flex:0 0 26px;display:flex;align-items:center;justify-content:center;font-size:12px;background:rgba(255,255,255,.07)}
.res small{margin-left:auto;flex:0 0 auto;white-space:nowrap;font-size:10.5px;color:var(--dim2)}
.res .none{color:var(--dim2);font-size:12.5px;padding:4px 0}

.scrim{position:fixed;inset:0;background:rgba(4,7,14,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;transition:.25s;z-index:70}
.scrim.on{opacity:1;pointer-events:auto}

.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.96);z-index:90;width:min(460px,92vw);
  opacity:0;pointer-events:none;transition:.26s cubic-bezier(.4,0,.2,1);padding:22px}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal h3{font-size:16px;margin-bottom:4px}
.modal .sub{font-size:12px;color:var(--dim2);margin-bottom:18px}
.field{margin-bottom:14px}
.field label{font-size:11.5px;color:var(--dim);display:block;margin-bottom:6px;letter-spacing:.03em}
.field select,.field input{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--brd);border-radius:11px;
  padding:10px 12px;color:var(--text);font-size:13px;outline:none;transition:.15s}
.field select:focus,.field input:focus{border-color:var(--brd2);box-shadow:0 0 0 3px rgba(124,140,255,.18)}
.field select option{background:#151b2b}
.modal .row{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;padding:11px;border-radius:12px;border:1px solid var(--brd);background:rgba(255,255,255,.06);
  color:var(--text);font-size:13px;font-weight:600;cursor:pointer;transition:.18s}
.btn:hover{background:rgba(255,255,255,.11)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;
  box-shadow:0 8px 22px rgba(124,140,255,.4)}

.drawer{position:fixed;right:0;top:0;bottom:0;width:min(400px,92vw);z-index:90;transform:translateX(102%);
  transition:.32s cubic-bezier(.4,0,.2,1);padding:0;border-radius:22px 0 0 22px;display:flex;flex-direction:column;overflow:hidden}
.drawer.on{transform:none}
.drawer-h{display:flex;align-items:center;gap:12px;padding:20px 22px;border-bottom:1px solid var(--brd)}
.drawer-h b{font-size:16px}
.drawer-h .x{margin-left:auto;cursor:pointer;color:var(--dim);font-size:20px;line-height:1}
.drawer-h .x:hover{color:var(--text)}
.drawer-b{padding:20px 22px;overflow-y:auto}
.dr-row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px}
.dr-row span{color:var(--dim2)}
.dr-row b{font-weight:600}
.dr-hero{text-align:center;padding:22px 0 26px}

/* ================= 工具 ================= */
function yuan(n){ return '¥' + n.toLocaleString('zh-CN'); }
function toast(msg, type){
  var t = $('#toast');
  t.classList.remove('info', 'warn', 'err');
  if (type) t.classList.add(type);
  $('#toastMsg').textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove('on'); }, 2200);
}
function ease(p){ return 1 - Math.pow(1 - p, 3); }
function anim(dur, fn){
  var t0 = performance.now();
  (function frame(now){
    var p = Math.min(1, (now - t0) / dur);
    fn(ease(p));
    if (p < 1) requestAnimationFrame(frame);
  })(t0);
}
function countUp(el, target, dec){
  var t0 = performance.now(), dur = 1000;
  (function f(now){
    var p = Math.min(1, (now - t0) / dur), e = ease(p), v = target * e;
    el.textContent = dec ? v.toFixed(dec) : Math.round(v).toLocaleString('zh-CN');
    if (p < 1) requestAnimationFrame(f);
  })(t0);
}
function prep(cv){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var r = cv.getBoundingClientRect();
  var w = Math.max(10, r.width), h = Math.max(10, r.height);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  var c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, w, h);
  return { c:c, w:w, h:h };
}
/* 提示气泡 */
function showTip(x, y, html){
  var t = $('#tip'); t.innerHTML = html;
  t.style.left = x + 'px'; t.style.top = y + 'px'; t.classList.add('on');
}
function hideTip(){ $('#tip').classList.remove('on'); }
/* 涟漪 */
function ripple(e){
  var b = e.currentTarget, r = b.getBoundingClientRect();
  var s = document.createElement('span'); s.className = 'ripple';
  var d = Math.max(r.width, r.height);
  s.style.width = s.style.height = d + 'px';
  s.style.left = (e.clientX - r.left - d / 2) + 'px';
  s.style.top = (e.clientY - r.top - d / 2) + 'px';
  b.appendChild(s); setTimeout(function(){ s.remove(); }, 620);
}

/* ================= 图表 ================= */
function drawArea(cv){
  var o = cv._o, g = prep(cv), c = g.c, w = g.w, h = g.h;
  var pl = 42, pr = 16, pt = 18, pb = 28;
  var iw = w - pl - pr, ih = h - pt - pb;
  var all = o.values.concat(o.prev || []);
  var max = Math.max.apply(null, all) * 1.16;
  var step = iw / (o.values.length - 1);
  function px(i){ return pl + i * step; }
  function py(v){ return pt + ih - (v / max) * ih; }

  c.font = '10px -apple-system,sans-serif';
  for (var k = 0; k <= 4; k++){
    var yy = pt + ih * k / 4;
    c.strokeStyle = 'rgba(255,255,255,.06)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(pl, yy); c.lineTo(w - pr, yy); c.stroke();
    c.fillStyle = '#5f6c88'; c.textAlign = 'right'; c.textBaseline = 'middle';
    c.fillText(Math.round(max * (4 - k) / 4) + '万', pl - 8, yy);
  }
  if (o.prev){
    c.strokeStyle = 'rgba(147,160,189,.34)'; c.lineWidth = 1.4; c.setLineDash([4,4]);
    c.beginPath();
    o.prev.forEach(function(v, i){ i ? c.lineTo(px(i), py(v)) : c.moveTo(px(i), py(v)); });
    c.stroke(); c.setLineDash([]);
  }
  var n = Math.max(1, Math.round((o.values.length - 1) * o.p));
  var grad = c.createLinearGradient(0, pt, 0, pt + ih);
  grad.addColorStop(0, 'rgba(124,140,255,.38)');
  grad.addColorStop(1, 'rgba(124,140,255,0)');
  c.beginPath(); c.moveTo(px(0), py(o.values[0]));
  for (var i = 1; i <= n; i++){
    var x0 = px(i-1), y0 = py(o.values[i-1]), x1 = px(i), y1 = py(o.values[i]);
    c.bezierCurveTo((x0+x1)/2, y0, (x0+x1)/2, y1, x1, y1);
  }
  c.save(); c.lineTo(px(n), pt + ih); c.lineTo(px(0), pt + ih); c.closePath();
  c.fillStyle = grad; c.fill(); c.restore();
  c.beginPath(); c.moveTo(px(0), py(o.values[0]));
  for (var j = 1; j <= n; j++){
    var a0 = px(j-1), b0 = py(o.values[j-1]), a1 = px(j), b1 = py(o.values[j]);
    c.bezierCurveTo((a0+a1)/2, b0, (a0+a1)/2, b1, a1, b1);
  }
  c.strokeStyle = '#9aa6ff'; c.lineWidth = 2.4; c.lineJoin = 'round'; c.stroke();

  if (o.hover != null && o.hover <= n){
    var hx = px(o.hover), hy = py(o.values[o.hover]);
    c.strokeStyle = 'rgba(255,255,255,.22)'; c.lineWidth = 1; c.setLineDash([3,4]);
    c.beginPath(); c.moveTo(hx, pt); c.lineTo(hx, pt + ih); c.stroke(); c.setLineDash([]);
    c.beginPath(); c.arc(hx, hy, 5, 0, 6.3); c.fillStyle = '#9aa6ff'; c.fill();
    c.strokeStyle = '#0a0e17'; c.lineWidth = 2; c.stroke();
  }
  c.fillStyle = '#5f6c88'; c.textAlign = 'center'; c.textBaseline = 'top';
  for (var t = 0; t < o.values.length; t++) c.fillText(o.labels ? o.labels[t] : MONTHS[t], px(t), pt + ih + 9);
}

function chartArea(cv, values, prev, labels){
  cv._o = { values:values, prev:prev, p:0, hover:null, labels:labels };
  anim(950, function(p){ cv._o.p = p; drawArea(cv); });
  cv.addEventListener('mousemove', function(e){
    var r = cv.getBoundingClientRect(), w = r.width;
    var pl = 42, pr = 16, iw = w - pl - pr, step = iw / (values.length - 1);
    var i = Math.round((e.clientX - r.left - pl) / step);
    i = Math.max(0, Math.min(values.length - 1, i));
    cv._o.hover = i; cv._o.p = 1; drawArea(cv);
    var html = '<b>' + (labels ? labels[i] : MONTHS[i]) + '</b><span>营收 ' + values[i] + ' 万</span>';
    if (prev) html += '<span>去年 ' + prev[i] + ' 万</span>';
    showTip(e.clientX, e.clientY - 6, html);
  });
  cv.addEventListener('mouseleave', function(){
    cv._o.hover = null; cv._o.p = 1; drawArea(cv); hideTip();
  });
}

function drawDonut(cv){
  var o = cv._o, g = prep(cv), c = g.c, w = g.w, h = g.h;
  var cx = w/2, cy = h/2, R = Math.min(w,h)/2 - 6, r = R * 0.62;
  var active = o.segs.filter(function(s){ return s.on; });
  var total = active.reduce(function(s,x){ return s + x.v; }, 0) || 1;
  c.strokeStyle = 'rgba(255,255,255,.06)'; c.lineWidth = R - r;
  c.beginPath(); c.arc(cx, cy, (R+r)/2, 0, 6.3); c.stroke();
  var a0 = -Math.PI/2;
  active.forEach(function(s){
    var sweep = (s.v / total) * Math.PI * 2 * o.p;
    c.beginPath();
    c.arc(cx, cy, (R+r)/2, a0, a0 + sweep);
    c.strokeStyle = s.color; c.lineWidth = R - r; c.lineCap = 'butt'; c.stroke();
    a0 += sweep;
  });
  c.fillStyle = '#eef2fb'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.font = '700 23px -apple-system,sans-serif';
  c.fillText(Math.round(342.6 * o.p) + '', cx, cy - 7);
  c.font = '10px -apple-system,sans-serif'; c.fillStyle = '#5f6c88';
  c.fillText('本月营收(万)', cx, cy + 15);
}
function chartDonut(cv, segs){
  cv._o = { segs:segs, p:0 };
  anim(950, function(p){ cv._o.p = p; drawDonut(cv); });
  cv.addEventListener('mousemove', function(e){
    var o = cv._o, g = cv.getBoundingClientRect();
    var cx = g.width/2, cy = g.height/2, R = Math.min(g.width,g.height)/2 - 6;
    var dx = e.clientX - g.left - cx, dy = e.clientY - g.top - cy;
    var d = Math.sqrt(dx*dx + dy*dy);
    if (d < R * 0.6 || d > R) { hideTip(); return; }
    var ang = Math.atan2(dy, dx) + Math.PI/2;
    if (ang < 0) ang += Math.PI * 2;
    var active = o.segs.filter(function(s){ return s.on; });
    var total = active.reduce(function(s,x){ return s + x.v; }, 0) || 1;
    var acc = 0, hit = null;
    active.forEach(function(s){
      var sweep = (s.v/total) * Math.PI * 2;
      if (ang >= acc && ang < acc + sweep) hit = s;
      acc += sweep;
    });
    if (hit) showTip(e.clientX, e.clientY - 6, '<b>' + hit.label + '</b><span>占比 ' + hit.v + '%</span>');
    else hideTip();
  });
  cv.addEventListener('mouseleave', hideTip);
}

function drawBars(cv){
  var o = cv._o, g = prep(cv), c = g.c, w = g.w, h = g.h;
  var pl = 12, pr = 12, pt = 14, pb = 32;
  var iw = w - pl - pr, ih = h - pt - pb;
  var max = Math.max.apply(null, o.items.map(function(x){ return x.v; })) * 1.2;
  var gap = iw / o.items.length, bw = gap * 0.5;
  c.font = '10.5px -apple-system,sans-serif';
  o.items.forEach(function(it, i){
    var x = pl + gap * i + (gap - bw) / 2;
    var bh = (it.v / max) * ih * o.p;
    var y = pt + ih - bh;
    var grad = c.createLinearGradient(0, y, 0, pt + ih);
    grad.addColorStop(0, '#b06cff'); grad.addColorStop(1, '#7c8cff');
    c.fillStyle = grad;
    if (o.hover === i){ c.shadowColor = 'rgba(176,108,255,.7)'; c.shadowBlur = 18; }
    var rr = Math.min(6, bw/2);
    c.beginPath();
    c.moveTo(x, pt + ih);
    c.lineTo(x, y + 4);
    c.quadraticCurveTo(x, y, x + rr, y);
    c.lineTo(x + bw - rr, y);
    c.quadraticCurveTo(x + bw, y, x + bw, y + 4);
    c.lineTo(x + bw, pt + ih);
    c.closePath(); c.fill(); c.shadowBlur = 0;
    c.fillStyle = '#eef2fb'; c.textAlign = 'center'; c.textBaseline = 'bottom';
    c.fillText(Math.round(it.v * o.p) + '%', x + bw/2, y - 5);
    c.fillStyle = o.hover === i ? '#eef2fb' : '#5f6c88'; c.textBaseline = 'top';
    c.fillText(it.label, x + bw/2, pt + ih + 9);
  });
}
function chartBars(cv, items, onPick){
  cv._o = { items:items, p:0, hover:null };
  anim(950, function(p){ cv._o.p = p; drawBars(cv); });
  cv.addEventListener('mousemove', function(e){
    var r = cv.getBoundingClientRect(), pl = 12, pr = 12;
    var gap = (r.width - pl - pr) / items.length;
    var i = Math.floor((e.clientX - r.left - pl) / gap);
    if (i < 0 || i >= items.length){ cv._o.hover = null; hideTip(); drawBars(cv); return; }
    cv._o.hover = i; drawBars(cv);
    showTip(e.clientX, e.clientY - 6, '<b>' + items[i].label + '</b><span>占比 ' + items[i].v + '%</span>');
  });
  cv.addEventListener('mouseleave', function(){ cv._o.hover = null; drawBars(cv); hideTip(); });
  cv.addEventListener('click', function(){ var i = cv._o.hover; if (i != null && onPick) onPick(items[i]); });
}

function drawSpark(cv, values, color){
  var g = prep(cv), c = g.c, w = g.w, h = g.h;
  var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
  var rng = (max - min) || 1, n = values.length - 1;
  function px(i){ return (i/n) * (w - 4) + 2; }
  function py(v){ return h - 4 - ((v - min)/rng) * (h - 10); }
  var grad = c.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, color + '55'); grad.addColorStop(1, color + '00');
  c.beginPath(); c.moveTo(px(0), py(values[0]));
  for (var i = 1; i <= n; i++) c.lineTo(px(i), py(values[i]));
  c.lineTo(px(n), h); c.lineTo(px(0), h); c.closePath(); c.fillStyle = grad; c.fill();
  c.beginPath(); c.moveTo(px(0), py(values[0]));
  for (var j = 1; j <= n; j++) c.lineTo(px(j), py(values[j]));
  c.strokeStyle = color; c.lineWidth = 1.9; c.lineJoin = 'round'; c.stroke();
}

/* ================= 排序状态 ================= */
var sort = { key:'date', dir:-1 };
function sortedOrders(list){
  var l = list.slice();
  l.sort(function(a, b){
    var x = a[sort.key], y = b[sort.key];
    if (typeof x === 'number') return (x - y) * sort.dir;
    return String(x).localeCompare(String(y)) * sort.dir;
  });
  return l;
}

/* ================= 搜索 / 命令面板 ================= */
var HIST_KEY = 'axiom_search_hist';
function getHist(){
  try { return JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); } catch(e){ return []; }
}
function addHist(kw){
  kw = (kw || '').trim(); if (!kw) return;
  var h = getHist().filter(function(x){ return x.toLowerCase() !== kw.toLowerCase(); });
  h.unshift(kw);
  try { localStorage.setItem(HIST_KEY, JSON.stringify(h.slice(0, 5))); } catch(e){}
}
function resIcon(t){ return t === 'nav' ? '◱' : t === 'order' ? '☰' : t === 'hist' ? '↺' : '☺'; }
function searchAll(kw){
  kw = (kw || '').trim().toLowerCase();
  var out = [];
  NAV.forEach(function(n){ if (!kw || n.name.toLowerCase().indexOf(kw) >= 0) out.push({ t:'nav', label:n.name, sub:'功能', id:n.id }); });
  ORDERS.forEach(function(o){ if (kw && (o.id + o.client + o.type + o.st).toLowerCase().indexOf(kw) >= 0) out.push({ t:'order', label:o.id + ' · ' + o.client, sub:yuan(o.amt), id:o.id }); });
  CLIENTS.forEach(function(c){ if (kw && (c.n + c.ind).toLowerCase().indexOf(kw) >= 0) out.push({ t:'client', label:c.n, sub:c.ind, id:c.n }); });
  return out.slice(0, 12);
}
function renderResults(box, kw, big){
  var k = (kw || '').trim();
  var list;
  if (!k){
    list = getHist().map(function(x){ return { t:'hist', label:x, sub:'历史记录', id:x }; }).concat(searchAll(''));
  } else {
    list = searchAll(k);
  }
  if (!list.length){ box.innerHTML = '<div class="res"><span class="none">未找到匹配结果</span></div>'; box._first = null; return; }
  box.innerHTML = list.map(function(r, i){
    return '<div class="res' + (i === 0 ? ' hl' : '') + '" data-t="' + r.t + '" data-id="' + encodeURIComponent(r.id) + '">' +
      '<span class="ic">' + resIcon(r.t) + '</span><span class="res-t">' + r.label + '</span><small>' + r.sub + '</small></div>';
  }).join('');
  $$('.res', box).forEach(function(el){
    el.onclick = function(){
      var t = el.getAttribute('data-t'), id = decodeURIComponent(el.getAttribute('data-id'));
      if (t === 'hist'){ var q2 = $('#q'); q2.value = id; renderResults(box, id); q2.focus(); return; }
      if (t === 'nav'){ render(id); }
      else if (t === 'order'){ var o = ORDERS.filter(function(x){ return x.id === id; })[0]; if (o) openDrawer(o); }
      else { toast('客户：' + id, 'info'); }
      addHist(k);
      box.classList.remove('on'); $('#q').value = '';
    };
  });
  if (big) box._first = list[0];
}

        '<div class="mem-i"><b>' + esc(m.n) + '</b><span>' + esc(m.e) + '</span></div>' +
        '<span class="role-b' + (m.admin ? ' admin' : '') + '">' + m.r + '</span>' +
        (i === 0 ? '' : '<span class="mem-x" data-rm="' + i + '" title="移除成员">✕</span>') + '</div>';
    }).join('') +
    '<div class="row" style="display:flex;gap:10px;margin-top:20px">' +

    '<button class="btn" id="s-role" style="flex:1">角色说明</button></div>';
}
function spSecurity(){

    '<div class="field2" style="margin-top:18px"><label>当前密码</label><input type="password" id="pw-old" placeholder="••••••••"></div>' +

    '<div class="field2"><label>确认新密码</label><input type="password" id="pw-re" placeholder="再次输入新密码"></div>' +

        '<b style="font-weight:600">' + esc(d.d) + '</b>' +
        (d.cur ? '<span class="cur-b">当前设备</span>' : '<span class="mem-x" data-dev="' + i + '">登出</span>') +
        '<span class="dev-ip">' + esc(d.ip) + '</span></div>';
    }).join('');
}

function bindSetPanel(key){
  var body = $('#d-body');
  function rerender(){ body.innerHTML = setPanelHTML(key); bindSetPanel(key); }
  function syncSide(){ if (current === 'setting') render('setting'); }

  if (key === '账户信息'){
    var sv = $('#s-save');
    if (sv) sv.onclick = function(){
      SET.name  = ($('#s-name').value.trim()  || SET.name);
      SET.email = ($('#s-email').value.trim() || SET.email);
      SET.phone = ($('#s-phone').value.trim() || SET.phone);
      SET.title = ($('#s-title').value.trim() || SET.title);
      saveSet(); toast('账户信息已保存'); rerender();
    };
    var ca = $('#s-cancel'); if (ca) ca.onclick = closeDrawer;
    return;
  }

  if (key === '企业主体'){
    var ec = $('#s-editco');
    if (ec) ec.onclick = function(){ toast('变更申请已提交 · 等待审核', 'info'); };
    var cp = $('#s-copyco');
    if (cp) cp.onclick = function(){
      var t = '杭州曜石科技有限公司 / 91330106MA2H****XK / 法人 ' + SET.name;
      if (navigator.clipboard) navigator.clipboard.writeText(t).then(
        function(){ toast('企业信息已复制到剪贴板'); },
        function(){ toast('复制失败，请手动选择', 'warn'); });
      else toast('企业信息已复制');
    };
    return;
  }

  if (key === '通知偏好'){
    $$('.tog[data-nt]', body).forEach(function(el){
      el.onclick = function(){
        var k = el.getAttribute('data-nt');
        SET.notify[k] = !SET.notify[k];
        el.classList.toggle('on', SET.notify[k]);
        saveSet();
        var c = $('#ntCount');
        if (c) c.textContent = (SET.notify.mail?1:0)+(SET.notify.app?1:0)+(SET.notify.push?1:0)+(SET.notify.digest?1:0);
        toast((SET.notify[k] ? '已开启 · ' : '已关闭 · ') + el.closest('.srow').querySelector('b').textContent, SET.notify[k] ? 'info' : 'warn');
      };
    });
    return;
  }

  if (key === '数据导出'){
    $$('#expFmt .set-chip', body).forEach(function(el){
      el.onclick = function(){
        EXPORT_FMT = el.getAttribute('data-f');
        $$('#expFmt .set-chip', body).forEach(function(x){ x.classList.toggle('on', x === el); });
      };
    });
    $$('.tog[data-ex]', body).forEach(function(el){
      el.onclick = function(){
        var k = el.getAttribute('data-ex');
        EXPORT_FIELDS[k] = !EXPORT_FIELDS[k];
        el.classList.toggle('on', EXPORT_FIELDS[k]);
      };
    });
    var g = $('#exp-go');
    if (g) g.onclick = function(){
      var sel = Object.keys(EXPORT_FIELDS).filter(function(k){ return EXPORT_FIELDS[k]; });
      if (!sel.length){ toast('请至少选择一类数据', 'warn'); return; }
      var bar = $('#expBar'), st = $('#expStat');
      var p = 0; st.textContent = '正在生成 ' + EXPORT_FMT + ' …';
      var t = setInterval(function(){
        p += 12 + Math.random() * 16;
        if (p >= 100){
          p = 100; clearInterval(t);
          st.textContent = '✅ 已导出 ' + sel.length + ' 类数据 · ' + EXPORT_FMT + ' · ' + new Date().toLocaleTimeString();
          setTimeout(doDownload, 150);
        }
        if (bar) bar.style.width = p + '%';
      }, 120);
    };
    return;
  }

  if (key === '成员与权限'){
    $$('.mem-x[data-rm]', body).forEach(function(el){
      el.onclick = function(){
        var i = +el.getAttribute('data-rm'), m = SET.members[i];
        SET.members.splice(i, 1); saveSet();
        toast('已移除成员 · ' + m.n, 'warn'); rerender(); syncSide();
      };
    });
    var iv = $('#s-invite');
    if (iv) iv.onclick = function(){
      var pool = [['苏晓','su@axiom.io','成员',false,'#33d17a'],
                  ['周衡','zhou@axiom.io','成员',false,'#ffb64d'],
                  ['顾远','gu@axiom.io','管理员',true,'#ff5c7a']];
      var p = pool[SET.members.length % pool.length];
      if (SET.members.some(function(m){ return m.e === p[1]; })){ toast('该成员已在团队中', 'warn'); return; }
      SET.members.push({ n:p[0], e:p[1], r:p[2], admin:p[3], c:p[4] });
      saveSet(); toast('邀请已发送给 ' + p[0]); rerender(); syncSide();
    };
    var rr = $('#s-role');
    if (rr) rr.onclick = function(){ toast('所有者=全部权限 · 管理员=订单+成员 · 成员=只读+新建', 'info'); };
    return;
  }

  if (key === '安全设置'){
    var t2 = $('.tog[data-sec="twofa"]', body);
    if (t2) t2.onclick = function(){
      SET.twofa = !SET.twofa; t2.classList.toggle('on', SET.twofa); saveSet();
      toast(SET.twofa ? '两步验证已开启' : '两步验证已关闭', SET.twofa ? 'info' : 'warn');
    };
    var ps = $('#pw-save');
    if (ps) ps.onclick = function(){
      var o = $('#pw-old').value, n = $('#pw-new').value, r = $('#pw-re').value;
      if (!o){ toast('请输入当前密码', 'warn'); return; }
      if (n.length < 8){ toast('新密码至少 8 位', 'warn'); return; }
      if (n !== r){ toast('两次输入不一致', 'err'); return; }
      $('#pw-old').value = $('#pw-new').value = $('#pw-re').value = '';
      toast('密码已更新 · 请牢记新密码');
    };
    $$('.mem-x[data-dev]', body).forEach(function(el){
      el.onclick = function(){
        var i = +el.getAttribute('data-dev'), d = SET.devices[i];
        SET.devices.splice(i, 1); saveSet();
        toast('已登出设备 · ' + d.d, 'warn'); rerender();
      };
    });
    return;
  }
}

/* ================= 顶栏 / 全局事件 ================= */
function initTop(){
  $('#newBtn').addEventListener('click', function(e){ ripple(e); openModal(); });
  $('#bell').addEventListener('click', function(e){ e.stopPropagation(); toggleNotif(); });
  $('#markRead').onclick = function(){
    FEED.forEach(function(f){ f.unread = false; });
    renderNotif();
    toast('已全部标记为已读', 'info'); $('#notif').classList.remove('on');
  };
  $('#menuBtn').addEventListener('click', function(){
    if (window.innerWidth <= 900){
      var open = document.body.classList.toggle('nav-open');
      $('#scrim').classList.toggle('on', open);
    } else {
      document.body.classList.toggle('mini');
    }
  });
  var q = $('#q'), box = $('#results');
  q.addEventListener('focus', function(){ if (q.value || true) { renderResults(box, q.value); box.classList.add('on'); } });
  q.addEventListener('input', function(){ renderResults(box, q.value); box.classList.add('on'); });
  q.addEventListener('keydown', function(e){
    var items = $$('.res', box);
    if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && box.classList.contains('on') && items.length){
      e.preventDefault();
      var idx = items.findIndex(function(x){ return x.classList.contains('hl'); });
      if (idx < 0) idx = e.key === 'ArrowDown' ? -1 : 0;
      idx = e.key === 'ArrowDown' ? (idx + 1) % items.length : (idx - 1 + items.length) % items.length;
      items.forEach(function(x){ x.classList.remove('hl'); });
      items[idx].classList.add('hl');
      items[idx].scrollIntoView({ block:'nearest' });
      return;
    }
    if (e.key === 'Enter'){
      e.preventDefault();
      var sel = box.querySelector('.res.hl');
      if (sel && box.classList.contains('on')) sel.click();
      return;
    }
  });
  $$('.cta').forEach(function(b){ b.addEventListener('click', ripple); });
  document.addEventListener('click', function(e){
    if (!e.target.closest('#searchBox')) box.classList.remove('on');
    if (!e.target.closest('#notif') && !e.target.closest('#bell')) $('#notif').classList.remove('on');
    if (!e.target.closest('#kbdPanel')) $('#kbdPanel').classList.remove('on');
  });
  window.addEventListener('resize', function(){
    var p = $('#notif');
    if (p.classList.contains('on')) toggleNotif(), toggleNotif();
  });
  document.addEventListener('keydown', function(e){
    var el = document.activeElement;
    var typing = el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); q.focus(); return; }
    if (typing) return;
    if (e.key === '/'){ e.preventDefault(); q.focus(); return; }
    if (e.key === 'n' || e.key === 'N'){
      e.preventDefault();
      var nb = $('#newBtn');
      if (nb){ var r = nb.getBoundingClientRect(); ripple({ currentTarget: nb, clientX: r.left + r.width / 2, clientY: r.top + r.height / 2 }); }
      openModal(); return;
    }
    if (e.key === 't' || e.key === 'T'){ e.preventDefault(); cycleAccent(); return; }
    if (e.key === '?'){ e.preventDefault(); $('#kbdPanel').classList.toggle('on'); return; }
    if (e.key === 'Escape'){ closeModal(); closeDrawer(); closeAllPopovers(); }
  });
}

/* ================= 实时引擎 ================= */
var LIVE_EVENTS = [
  { c:'#33d17a', t:function(){ return '<b>' + pick(['星野科技','恒远集团','千寻咨询','南栀电商','蓝海传媒']) + '</b> 的款项 ' + yuan(pick([32000,56000,88000,128000,210000])) + ' 已到账'; } },
  { c:'#7c8cff', t:function(){ return '<b>' + pick(['A-2412','A-2411','A-2409','A-2403','A-2401']) + '</b> 项目进度更新至 ' + pick([42,55,68,73,86,91]) + '%'; } },
  { c:'#39e0f0', t:function(){ return '新增潜在客户 <b>' + pick(['云栖数据','拾光品牌','极昼智能','未名实验室']) + '</b>，来源：' + pick(['内容营销','转介绍','行业峰会','自然搜索']); } },
  { c:'#ffb64d', t:function(){ return '<b>' + pick(['陆离设计','壹方教育']) + '</b> 合同待签署，已提醒跟进'; } },
  { c:'#ff5c7a', t:function(){ return '<b>' + pick(['A-2407','A-2402']) + '</b> 回款临近到期，建议关注'; } }
];
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
var WD = ['日','一','二','三','四','五','六'];

function initClock(){
  var t = $('#lcTime'), d = $('#lcDate'); if (!t) return;
  function tick(){
    var n = new Date();
    t.textContent = ('0' + n.getHours()).slice(-2) + ':' + ('0' + n.getMinutes()).slice(-2) + ':' + ('0' + n.getSeconds()).slice(-2);
    if (d) d.textContent = (n.getMonth() + 1) + '月' + n.getDate() + '日 周' + WD[n.getDay()];
  }
  tick(); setInterval(tick, 1000);
}

function liveKpi(){
  if (document.hidden) return;
  if (current !== 'home' && current !== 'report') return;
  var i = Math.floor(Math.random() * KPIS.length), k = KPIS[i];
  var step = k.num * (Math.random() * 0.014 - 0.005);
  k.num = Math.max(0, +(k.num + step).toFixed(k.dec));
  var vEl = document.getElementById('kv' + i);
  if (vEl){
    vEl.textContent = k.dec ? k.num.toFixed(k.dec) : Math.round(k.num).toLocaleString('zh-CN');
    vEl.classList.remove('pop'); void vEl.offsetWidth; vEl.classList.add('pop');
    var card = vEl.closest('.kpi');
    if (card){
      card.classList.remove('flash-up', 'flash-dn'); void card.offsetWidth;
      card.classList.add(step >= 0 ? 'flash-up' : 'flash-dn');
    }
  }
  k.spark.push(k.num); k.spark.shift();
  var sp = document.getElementById('sp' + i);
  if (sp) drawSpark(sp, k.spark, k.color);
}

function liveChart(){
  if (document.hidden) return;
  var area = $('#area'); if (!area || !REV.length) return;
  var last = REV[REV.length - 1];
  REV[REV.length - 1] = +Math.max(20, last * (1 + (Math.random() * 0.03 - 0.015))).toFixed(1);
  var k = 12, seg = $('#revSeg');
  if (seg){ var on = seg.querySelector('button.on'); if (on) k = +on.getAttribute('data-k'); }
  chartArea(area, REV.slice(-k), (k === 12 ? REV_PREV : REV_PREV.slice(-k)), MONTHS.slice(-k));
}

function liveFeed(){
  if (document.hidden) return;
  var e = pick(LIVE_EVENTS);
  var item = { c:e.c, t:e.t(), time:'刚刚', unread:true };
  FEED.unshift(item);
  if (FEED.length > 12) FEED.pop();
  updateBell();
  var feed = $('#liveFeed');
  if (feed){
    var div = document.createElement('div');
    div.className = 'fd fd-new';
    div.innerHTML = '<i style="background:' + item.c + '"></i><div><p>' + item.t + '</p><time>' + item.time + '</time></div>';
    feed.insertBefore(div, feed.firstChild);
    while (feed.children.length > 8) feed.removeChild(feed.lastChild);
  }
  if ($('#notif').classList.contains('on')) renderNotif();
  if (Math.random() < 0.4) toast('实时 · ' + item.t.replace(/<[^>]+>/g, ''), 'info');
}

/* ================= 启动 ================= */
buildNav();
initTop();
initModal();
renderNotif();
render('home');
initClock();
setInterval(liveKpi, 3200);
setInterval(liveChart, 6500);
setInterval(liveFeed, 11000);
})();
