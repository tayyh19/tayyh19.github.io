<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NEXUS · 服务中枢</title>
<style>
:root{
  --bg:#060a10;
  --panel:rgba(255,255,255,.055);
  --panel2:rgba(255,255,255,.085);
  --line:rgba(255,255,255,.10);
  --line2:rgba(255,255,255,.16);
  --text:#e9f2f7;
  --dim:#8ea2b2;
  --dim2:#5e7182;
  --accent:#2fe3b4;
  --accent2:#31c9ff;
  --violet:#a98bff;
  --amber:#ffb454;
  --red:#ff5d7a;
  --green:#2fe3b4;
  --navw:246px;
  --blur:20px;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:14px;line-height:1.5;overflow-x:hidden;
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(120% 90% at 50% 0%,rgba(47,227,180,.06),transparent 60%);
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 背景光斑 ---------- */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5}
.b1{width:460px;height:460px;background:#2fe3b4;top:-160px;left:-120px;opacity:.20}
.b2{width:520px;height:520px;background:#31c9ff;top:30%;right:-200px;opacity:.16}
.b3{width:420px;height:420px;background:#a98bff;bottom:-180px;left:32%;opacity:.15}
@media(max-width:780px){.blob{filter:blur(56px)}}

/* ---------- 玻璃基类 ---------- */
.glass{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--r);
  backdrop-filter:blur(var(--blur)) saturate(150%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(150%);
  box-shadow:0 8px 30px rgba(0,0,0,.30), inset 0 1px 0 rgba(255,255,255,.06);
}

/* ---------- 布局 ---------- */
.app{position:relative;z-index:2;display:flex;min-height:100vh}
.side{
  width:var(--navw);flex:0 0 var(--navw);
  position:fixed;left:0;top:0;bottom:0;z-index:80;
  padding:18px 14px;display:flex;flex-direction:column;gap:6px;
  background:linear-gradient(180deg,rgba(12,18,26,.86),rgba(8,13,19,.92));
  border-right:1px solid var(--line);
  backdrop-filter:blur(var(--blur));
  -webkit-backdrop-filter:blur(var(--blur));
  transition:transform .3s cubic-bezier(.5,0,.2,1);
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px}
.brand .mark{
  width:38px;height:38px;border-radius:12px;flex:0 0 38px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;font-weight:800;color:#04110d;font-size:17px;
  box-shadow:0 6px 18px rgba(47,227,180,.35);
}
.brand b{font-size:15.5px;letter-spacing:.4px;display:block}
.brand span{font-size:11px;color:var(--dim2);letter-spacing:1.5px}
.nav{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.nav a{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;
  color:var(--dim);text-decoration:none;font-size:13.5px;cursor:pointer;
  transition:background .18s,color .18s,transform .18s;position:relative;
}
.nav a svg{width:18px;height:18px;flex:0 0 18px;stroke:currentColor;fill:none;stroke-width:1.7}
.nav a:hover{background:rgba(255,255,255,.05);color:var(--text)}
.nav a.on{
  background:linear-gradient(90deg,rgba(47,227,180,.16),rgba(49,201,255,.06));
  color:#eafff9;box-shadow:inset 0 0 0 1px rgba(47,227,180,.22);
}
.nav a.on::before{
  content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);
  width:3px;height:18px;border-radius:3px;background:var(--accent);
}
.nav a .nbadge{
  margin-left:auto;font-size:11px;padding:1px 7px;border-radius:9px;
  background:rgba(255,93,122,.18);color:#ffa7b8;font-weight:600;
}
.side-foot{margin-top:auto;padding:12px 10px;font-size:11px;color:var(--dim2);line-height:1.6}
.side-foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;box-shadow:0 0 8px var(--accent)}

/* ---------- 主区 ---------- */
.main{margin-left:var(--navw);flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}
.top{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;
  padding:13px 22px;border-bottom:1px solid var(--line);
  background:rgba(7,11,17,.72);backdrop-filter:blur(var(--blur));
  -webkit-backdrop-filter:blur(var(--blur));
}
.hamb{display:none;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;font-size:17px}
.crumb{font-size:13px;color:var(--dim)}
.crumb b{color:var(--text);font-weight:600;font-size:15px;display:block;letter-spacing:.2px}
.crumb i{font-style:normal;color:var(--dim2);font-size:11.5px}
.search{
  margin-left:auto;display:flex;align-items:center;gap:8px;width:270px;max-width:34vw;
  padding:8px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);
  transition:border-color .2s,background .2s;
}
.search:focus-within{border-color:rgba(47,227,180,.5);background:rgba(47,227,180,.06)}
.search svg{width:15px;height:15px;stroke:var(--dim);fill:none;stroke-width:2;flex:0 0 15px}
.search input{flex:1;background:none;border:0;outline:none;color:var(--text);font-size:13px;min-width:0}
.search input::placeholder{color:var(--dim2)}
.icobtn{
  width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel);
  color:var(--dim);cursor:pointer;display:grid;place-items:center;position:relative;transition:.2s;
}
.icobtn:hover{color:var(--text);border-color:var(--line2)}
.icobtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.icobtn .bdg{
  position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;
  background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;
  box-shadow:0 0 0 2px var(--bg);
}
.live-clock{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--dim);padding:0 4px}
.live-clock b{color:var(--text);font-variant-numeric:tabular-nums;font-weight:600}
.ld{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:ld 1.6s infinite}
@keyframes ld{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.72)}}
.avatar{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:14px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04110d;cursor:pointer;
  box-shadow:0 4px 14px rgba(47,227,180,.3);
}

.view{padding:22px;display:flex;flex-direction:column;gap:18px;flex:1}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{padding:16px 17px;position:relative;overflow:hidden;border-radius:var(--r)}
.kpi .lb{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}
.kpi .lb .ic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px}
.kpi .val{font-size:27px;font-weight:700;margin-top:9px;letter-spacing:.5px;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:14px;color:var(--dim);margin-left:3px;font-weight:500}
.kpi .sub{font-size:11.5px;color:var(--dim2);margin-top:6px;display:flex;align-items:center;gap:5px}
.kpi .up{color:var(--accent)}
.kpi .dn{color:var(--red)}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(47,227,180,.18),transparent 70%)}
.kpi .val.pop{animation:pop .55s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.13)}100%{transform:scale(1)}}
.flash-up{animation:fup .8s}
.flash-dn{animation:fdn .8s}
@keyframes fup{0%{background:rgba(47,227,180,.22)}100%{background:transparent}}
@keyframes fdn{0%{background:rgba(255,93,122,.22)}100%{background:transparent}}

/* ---------- 面板通用 ---------- */
.panel{padding:16px 17px;border-radius:var(--r)}
.phead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.phead h3{margin:0;font-size:14.5px;font-weight:600;letter-spacing:.2px}
.phead .tag{font-size:11px;color:var(--dim2);padding:2px 8px;border-radius:8px;background:rgba(255,255,255,.06)}
.phead .more{margin-left:auto;font-size:12px;color:var(--accent);cursor:pointer}
.live-tag{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;color:var(--accent);padding:2px 8px;border-radius:8px;background:rgba(47,227,180,.12);letter-spacing:.5px;font-weight:600}
.live-tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);animation:ld 1.4s infinite}

.grid-2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.col{display:flex;flex-direction:column;gap:16px}

/* ---------- 工单流 ---------- */
.feed{display:flex;flex-direction:column;gap:9px;max-height:340px;overflow-y:auto;padding-right:4px}
.fd{display:flex;gap:11px;padding:11px 12px;border-radius:13px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.05);cursor:pointer;transition:.18s}
.fd:hover{background:rgba(255,255,255,.07);transform:translateX(2px)}
.fd .fi{width:34px;height:34px;border-radius:10px;flex:0 0 34px;display:grid;place-items:center;font-size:14px}
.fd .fc{flex:1;min-width:0}
.fd .fc b{font-size:12.5px;font-weight:600;display:block}
.fd .fc p{margin:2px 0 0;font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fd .ft{font-size:10.5px;color:var(--dim2);white-space:nowrap;align-self:center}
.fd.new{animation:fdIn .6s cubic-bezier(.2,1,.3,1)}
@keyframes fdIn{0%{opacity:0;transform:translateY(-10px) scale(.97)}100%{opacity:1;transform:none}}

/* ---------- 表格 ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;color:var(--dim2);font-weight:500;font-size:11.5px;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 11px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
.tbl tr.row{cursor:pointer;transition:background .15s}
.tbl tr.row:hover{background:rgba(255,255,255,.045)}
.tk-id{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--dim)}
.tk-subj{font-weight:500}
.tk-cust{color:var(--dim)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:9px;font-weight:600;white-space:nowrap}
.p-urgent{background:rgba(255,93,122,.16);color:#ff97ac}
.p-high{background:rgba(255,180,84,.16);color:#ffcf8f}
.p-mid{background:rgba(49,201,255,.14);color:#8fdcff}
.p-low{background:rgba(255,255,255,.08);color:var(--dim)}
.s-open{background:rgba(255,180,84,.14);color:#ffcf8f}
.s-doing{background:rgba(47,227,180,.14);color:#8ff0d5}
.s-wait{background:rgba(169,139,255,.15);color:#c3aaff}
.s-done{background:rgba(255,255,255,.07);color:var(--dim)}
.avmini{width:26px;height:26px;border-radius:8px;display:inline-grid;place-items:center;font-size:11px;font-weight:700;background:linear-gradient(135deg,rgba(47,227,180,.5),rgba(49,201,255,.5));color:#eafff9;margin-right:7px;vertical-align:middle}
.sla{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;font-variant-numeric:tabular-nums}
.sla.ok{color:var(--dim)}
.sla.warn{color:var(--amber)}
.sla.bad{color:var(--red);font-weight:700}
.sla.bad .d{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-right:4px;animation:ld 1s infinite}

/* ---------- tabs / chips ---------- */
.tabs{display:flex;gap:7px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:11px;font-size:12.5px;color:var(--dim);background:rgba(255,255,255,.05);border:1px solid transparent;cursor:pointer;transition:.18s}
.tab:hover{color:var(--text)}
.tab.on{color:#eafff9;background:linear-gradient(135deg,rgba(47,227,180,.20),rgba(49,201,255,.10));border-color:rgba(47,227,180,.30)}
.chip{padding:6px 12px;border-radius:10px;font-size:12px;color:var(--dim);background:rgba(255,255,255,.05);cursor:pointer;transition:.18s;border:1px solid transparent}
.chip:hover{color:var(--text);transform:translateY(-1px)}
.chip.on{color:#eafff9;background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;font-weight:600;box-shadow:0 4px 14px rgba(47,227,180,.28)}

/* ---------- 客服卡 ---------- */
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
.agent{padding:15px;border-radius:var(--r);display:flex;flex-direction:column;gap:11px}
.agent .ah{display:flex;align-items:center;gap:11px}
.agent .av{width:44px;height:44px;border-radius:13px;flex:0 0 44px;display:grid;place-items:center;font-weight:700;font-size:16px;color:#04110d}
.agent .ah b{font-size:14px;display:block}
.agent .ah span{font-size:11px;color:var(--dim2)}
.agent .stat{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
.agent .stat b{color:var(--text);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s cubic-bezier(.3,1,.4,1)}
.bar.warn i{background:linear-gradient(90deg,var(--amber),var(--red))}

/* ---------- 知识库 ---------- */
.kbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.kb{padding:15px;border-radius:var(--r);cursor:pointer;transition:.2s;display:flex;flex-direction:column;gap:9px}
.kb:hover{transform:translateY(-3px);border-color:var(--line2)}
.kb .kk{font-size:10.5px;color:var(--accent);letter-spacing:.6px;font-weight:600}
.kb b{font-size:13.5px;line-height:1.4}
.kb p{margin:0;font-size:11.5px;color:var(--dim);line-height:1.55}
.kb .kf{margin-top:auto;font-size:11px;color:var(--dim2);display:flex;justify-content:space-between}

/* ---------- 报表 ---------- */
.chart-wrap{position:relative;width:100%}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:11.5px;color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.legend i.ln{width:14px;height:3px;border-radius:2px}
.big-stat{display:flex;flex-direction:column;gap:4px;padding:13px;border-radius:13px;background:rgba(255,255,255,.035)}
.big-stat b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.big-stat span{font-size:11.5px;color:var(--dim)}

/* ---------- 设置 ---------- */
.srow{display:flex;align-items:center;gap:13px;padding:13px 4px;border-bottom:1px solid rgba(255,255,255,.055)}
.srow:last-child{border-bottom:0}
.srow .si{width:36px;height:36px;border-radius:11px;flex:0 0 36px;display:grid;place-items:center;font-size:15px;background:rgba(255,255,255,.06)}
.srow .sc{flex:1;min-width:0}
.srow .sc b{font-size:13px;font-weight:600;display:block}
.srow .sc span{font-size:11.5px;color:var(--dim2)}
.srow .act{
  font-size:12px;padding:6px 13px;border-radius:10px;color:var(--accent);
  background:rgba(47,227,180,.10);border:1px solid rgba(47,227,180,.20);cursor:pointer;transition:.18s;white-space:nowrap;
}
.srow .act:hover{background:rgba(47,227,180,.18)}
.swatches{display:flex;gap:9px}
.sw{width:26px;height:26px;border-radius:9px;cursor:pointer;border:2px solid transparent;transition:.18s}
.sw:hover{transform:scale(1.12)}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.rng{width:130px;accent-color:var(--accent)}
.rng-out{font-size:12px;color:var(--dim);width:44px;text-align:right;font-variant-numeric:tabular-nums}

/* ---------- 抽屉 ---------- */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(2,5,9,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:520px;max-width:92vw;z-index:90;
  background:linear-gradient(180deg,rgba(14,20,28,.96),rgba(9,14,20,.98));
  border-left:1px solid var(--line2);backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  transform:translateX(103%);transition:transform .34s cubic-bezier(.5,0,.2,1);
  display:flex;flex-direction:column;
}
.drawer.on{transform:none}
.d-head{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.d-head .dt{flex:1;min-width:0}
.d-head h3{margin:0 0 4px;font-size:16px}
.d-head .dm{font-size:11.5px;color:var(--dim2)}
.d-close{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--dim);cursor:pointer;font-size:16px;flex:0 0 32px}
.d-close:hover{color:var(--text)}
.d-body{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:15px}
.d-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px}
.btn{
  padding:10px 16px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);
  color:var(--text);font-size:13px;cursor:pointer;transition:.18s;flex:1;font-weight:500;
}
.btn:hover{background:var(--panel2)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04110d;border-color:transparent;font-weight:700;box-shadow:0 6px 18px rgba(47,227,180,.28)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:#ff9aae;border-color:rgba(255,93,122,.3);background:rgba(255,93,122,.08)}

/* 会话流 */
.chat{display:flex;flex-direction:column;gap:11px}
.msg{max-width:82%;padding:10px 13px;border-radius:14px;font-size:12.5px;line-height:1.55}
.msg.cust{align-self:flex-start;background:rgba(255,255,255,.07);border-bottom-left-radius:5px}
.msg.us{align-self:flex-end;background:linear-gradient(135deg,rgba(47,227,180,.22),rgba(49,201,255,.14));border-bottom-right-radius:5px}
.msg .mh{font-size:10.5px;color:var(--dim2);margin-bottom:4px;display:flex;gap:8px}
.msg.note{align-self:stretch;max-width:100%;background:rgba(255,180,84,.09);border:1px dashed rgba(255,180,84,.28);font-size:12px;color:#ffd9a0}
.msg.new{animation:fdIn .45s}
.sla-track{height:8px;border-radius:6px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:8px}
.sla-track i{display:block;height:100%;border-radius:6px;transition:width .5s,background .3s}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meta-grid .mg{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04)}
.meta-grid .mg span{font-size:10.5px;color:var(--dim2);display:block}
.meta-grid .mg b{font-size:13px;font-weight:600}
.qr{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.qr .q{font-size:11.5px;padding:5px 11px;border-radius:9px;background:rgba(255,255,255,.06);color:var(--dim);cursor:pointer;transition:.15s}
.qr .q:hover{background:rgba(47,227,180,.14);color:#c7fff0}
.ta{
  width:100%;min-height:70px;resize:vertical;border-radius:12px;padding:11px 13px;font-size:12.5px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--text);outline:none;font-family:inherit;
}
.ta:focus{border-color:rgba(47,227,180,.45)}

function sparkline(data, w, h, color, fill){
  w = w||600; h = h||160;
  var max = Math.max.apply(null, data), min = Math.min.apply(null, data);
  var span = (max - min) || 1;
  var step = w / (data.length - 1);
  var pts = data.map(function(v,i){
    var x = i*step, y = h - ((v-min)/span)*(h-24) - 12;

  });
  var d = pts.map(function(p,i){ return (i?'L':'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');

  return '<svg class="chart" viewBox="0 0 '+w+' '+(h+8)+'" preserveAspectRatio="none">' +

  }).join('');
  return '<div style="display:flex;gap:12px;align-items:flex-end">' + cols + '</div>';
}

function donut(segs){
  var total = segs.reduce(function(a,b){ return a+b.v; },0) || 1;
  var r = 54, cx = 64, cy = 64, circ = 2*Math.PI*r;
  var off = 0;
  var arcs = segs.map(function(s){
    var len = (s.v/total)*circ;
    var el = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+s.c+'" stroke-width="17" ' +
      'stroke-dasharray="'+len.toFixed(2)+' '+(circ-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" ' +
      'transform="rotate(-90 '+cx+' '+cy+')" stroke-linecap="butt"></circle>';
    off += len;
    return el;
  }).join('');
  return '<div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">' +
    '<svg width="128" height="128" viewBox="0 0 128 128">' +
    '<circle cx="64" cy="64" r="54" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="17"/>' + arcs +
    '<text x="64" y="60" text-anchor="middle" fill="#e9f2f7" font-size="19" font-weight="700">'+total+'</text>' +
    '<text x="64" y="78" text-anchor="middle" fill="#5e7182" font-size="10">总工单</text></svg>' +
    '<div class="legend" style="flex-direction:column;gap:9px">' + segs.map(function(s){

    }).join('') + '</div></div>';
}

function render(){

function decorate(){
  $$('.srow[data-act]').forEach(function(el){
    el.onclick = function(e){
      if (e.target.closest('#swatches') || e.target.closest('#blurRange')) return;
      openSetPanel(el.getAttribute('data-act'));
    };
  });
  var sw = $('#swatches');
  if (sw) $$('.sw', sw).forEach(function(el){
    el.onclick = function(){
      var i = +el.getAttribute('data-acc');
      SET.accent = i; saveSet(); applyAccent(i);
      $$('.sw', sw).forEach(function(s){ s.classList.remove('on'); });
      el.classList.add('on');
      toast('已应用主题色', 'ok');
    };
  });
  var rng = $('#blurRange');
  if (rng) rng.oninput = function(){
    SET.blur = +rng.value; saveSet();
    document.documentElement.style.setProperty('--blur', rng.value + 'px');
    $('#blurOut').textContent = rng.value + 'px';
  };

  $$('.tab[data-tab]').forEach(function(el){
    el.onclick = function(){ state.tab = el.getAttribute('data-tab'); render(); };
  });
  $$('.chip[data-kcat]').forEach(function(el){
    el.onclick = function(){ state.kcat = el.getAttribute('data-kcat'); render(); };
  });
  var kbq = $('#kbq');
  if (kbq) kbq.oninput = function(){
    state.kbq = kbq.value;
    var list = KB.filter(function(k){
      if (state.kcat !== 'all' && k.cat !== state.kcat) return false;
      return (k.t+k.d+k.k).toLowerCase().indexOf(state.kbq.toLowerCase()) >= 0;
    });
    var box = $('.kbs');
    if (box) box.innerHTML = list.map(function(k){
      return '<div class="kb glass" style="background:rgba(255,255,255,.04)" data-kb="'+esc(k.t)+'">' +
        '<span class="kk">'+esc(k.k)+'</span><b>'+esc(k.t)+'</b><p>'+esc(k.d)+'</p>' +
        '<div class="kf"><span>阅读 '+esc(k.v)+'</span><span>'+esc(k.cat)+'</span></div></div>';
    }).join('') || '<div class="empty">没有匹配的文章</div>';
    bindKB();
  };
  bindKB();

  $$('tr.row[data-tk]').forEach(function(tr){
    tr.onclick = function(){ openTicket(tr.getAttribute('data-tk')); };
  });
  $$('.more[data-go]').forEach(function(el){
    el.onclick = function(){ state.view = el.getAttribute('data-go'); render(); buildNav(); };
  });
  $$('.more[data-act]').forEach(function(el){
    el.onclick = function(){ toast('报表已生成，可在下载中心查看（演示）', 'ok'); };
  });
  $$('.kpi').forEach(function(el){
    el.onclick = function(){
      var v = $('.val', el);
      if (v){ v.classList.remove('pop'); void v.offsetWidth; v.classList.add('pop'); }
    };
  });
  updateSlaWarn();
}

function bindKB(){

}

function updateSlaWarn(){
  var box = $('#slaWarn');
  if (!box) return;
  var warn = TICKETS.filter(function(t){ return t.sla > 0 && t.sla <= 30*60; }).sort(function(a,b){ return a.sla-b.sla; });
  if (!warn.length){ box.innerHTML = '<div class="empty">当前无预警工单 🎉</div>'; return; }
  box.innerHTML = warn.map(function(t){
    return '<div class="fd" data-tk="'+esc(t.id)+'">' +
      '<div class="fi" style="background:'+(t.sla<=10*60?'#ff5d7a':'#ffb454')+'22;color:'+(t.sla<=10*60?'#ff5d7a':'#ffb454')+'">⏳</div>' +
      '<div class="fc"><b>'+esc(t.id)+' · '+esc(t.cust)+'</b><p>'+esc(t.subj)+'</p></div>' +
      '<div class="ft"><span class="sla '+slaCls(t.sla)+'">'+fmtSla(t.sla)+'</span></div>' +

  });

  }).join('');

function ticketOp(op, t){
  if (op === 'note'){
    var ta = $('#reply');
    var txt = ta.value.trim();
    if (!txt){ toast('请先输入备注内容', 'warn'); return; }
    if (!CHAT[t.id]) CHAT[t.id] = (DEFAULT_CHAT).slice();
    CHAT[t.id].push({ note:true, t:txt });
    ta.value = '';
    renderChat(t.id);
    toast('内部备注已添加', 'ok');
    return;
  }
  if (op === 'transfer'){
    var names = AGENTS.map(function(a){ return a.n; });
    var next = names[(names.indexOf(t.ag)+1) % names.length];
    t.ag = next;
    toast('工单已转交给 ' + next, 'ok');
    openTicket(t.id);
    return;
  }
  if (op === 'resolve'){
    var ta2 = $('#reply');
    var txt2 = ta2.value.trim();
    if (txt2){
      if (!CHAT[t.id]) CHAT[t.id] = (DEFAULT_CHAT).slice();
      CHAT[t.id].push({ who:'me', t:txt2, time:'刚刚' });
    }
    t.st = '已解决';
    t.sla = 0;
    closeDrawer();
    toast('工单 ' + t.id + ' 已标记为已解决 ✓', 'ok');
    if (state.view === 'queue' || state.view === 'home') render();
  }
}

function closeDrawer(){
  $('#drawer').classList.remove('on');
  $('#scrim').classList.remove('on');
}

/* ================= 弹窗 / 通知 ================= */
function openModal(title){
  $('#modal').innerHTML =
    '<div class="phead"><h3>'+esc(title)+'</h3><span class="more" data-close="1" style="color:var(--dim)">关闭 ✕</span></div>' +
    '<p style="font-size:12.5px;color:var(--dim);line-height:1.7;margin:0 0 6px">这是知识库文章的完整内容占位。实际接入时，此处会渲染 Markdown 正文、相关工单推荐，以及「一键引用到回复」的操作入口。</p>' +
    '<div class="qr" style="margin-top:12px"><span class="q" data-close="1">引用到回复</span><span class="q" data-close="1">标记有帮助</span></div>';
  $('#modal').classList.add('on');
  $('#scrim').classList.add('on');
  $$('#modal [data-close]').forEach(function(el){
    el.onclick = closeModal;
  });
}
function closeModal(){
  $('#modal').classList.remove('on');
  if (!$('#drawer').classList.contains('on')) $('#scrim').classList.remove('on');
}
function closeAllPopovers(){
  $('#popover').classList.remove('on');
}

function toggleBell(){
  var p = $('#popover');
  if (p.classList.contains('on')){ p.classList.remove('on'); return; }
  var unread = NOTIFY.filter(function(n){ return n.unread; }).length;
  p.innerHTML = '<div class="phead" style="margin-bottom:6px"><h3 style="font-size:13.5px">通知</h3>' +
    '<span class="more" data-readall="1">全部已读</span></div>' +
    NOTIFY.map(function(n,i){
      return '<div class="nt'+(n.unread?' unread':'')+'" data-nt="'+i+'">' +
        '<div class="ni" style="background:'+n.c+'22;color:'+n.c+'">'+n.ico+'</div>' +
        '<div><b>'+esc(n.t)+'</b><p>'+esc(n.s)+'</p></div></div>';
    }).join('');
  var r = $('#bell').getBoundingClientRect();
  p.style.top = (r.bottom + 8) + 'px';
  p.style.right = Math.max(12, window.innerWidth - r.right) + 'px';
  p.classList.add('on');
  $$('#popover .nt[data-nt]').forEach(function(el){
    el.onclick = function(){
      var n = NOTIFY[+el.getAttribute('data-nt')];
      n.unread = false;
      updateBell(); toggleBell();
      toast('已读：' + n.t);
    };
  });
  var ra = $('#popover [data-readall]');
  if (ra) ra.onclick = function(){
    NOTIFY.forEach(function(n){ n.unread = false; });
    updateBell(); toggleBell();
  };
}
function updateBell(){
  var n = NOTIFY.filter(function(x){ return x.unread; }).length;
  var b = $('#bellN');
  b.textContent = n;
  b.style.display = n ? 'grid' : 'none';
}

/* ================= 设置子面板 ================= */
function openSetPanel(key){
  closeAllPopovers();
  var map = {
    level:  { t:'服务等级',   fn:spLevel },
    time:   { t:'工作时间',   fn:spTime },
    assign: { t:'自动分配',   fn:spAssign },
    notify: { t:'通知偏好',   fn:spNotify }
  };
  var m = map[key];
  if (!m) return;
  $('#dTitle').textContent = m.t;
  $('#dMeta').textContent = '服务设置 · ' + m.t;
  $('#dBody').innerHTML = m.fn();
  $('#dFoot').innerHTML = '<button class="btn primary" data-save="1">保存设置</button>';
  $('#dFoot [data-save]').onclick = function(){ toast(m.t + ' 已保存', 'ok'); closeDrawer(); };
  bindSetPanel(key);
  $('#drawer').classList.add('on');
  $('#scrim').classList.add('on');
}

function setBlock(title, inner){
  return '<div class="panel glass" style="background:rgba(255,255,255,.03);padding:14px 16px">' +
    '<div class="phead" style="margin-bottom:10px"><h3 style="font-size:13px">'+title+'</h3></div>' + inner + '</div>';
}
function togRow(t, d, on, key){
  return '<div class="srow"><div class="sc"><b>'+esc(t)+'</b><span>'+esc(d)+'</span></div>' +
    '<div class="tog'+(on?' on':'')+'" data-tog="'+key+'"></div></div>';
}

function spLevel(){
  return setBlock('SLA 目标', 
    '<div style="display:grid;gap:11px">' +
      slaRow('紧急（P1）','30 分钟','#ff5d7a') +
      slaRow('高（P2）','2 小时','#ffb454') +
      slaRow('中（P3）','8 小时','#31c9ff') +
      slaRow('低（P4）','24 小时','var(--dim)') +
    '</div>') +
    setBlock('升级规则', togRow('超时自动升级','SLA 剩余 10 分钟自动通知主管', true, 'esc') + togRow('重开工单提醒','客户 24 小时内再次反馈自动重开', true, 'reopen'));
}
function slaRow(l, v, c){
  return '<div style="display:flex;align-items:center;gap:10px"><span style="width:10px;height:10px;border-radius:3px;background:'+c+'"></span>' +
    '<span style="flex:1;font-size:13px">'+esc(l)+'</span><b style="font-size:13px;color:var(--dim)">'+esc(v)+'</b></div>';
}

function spTime(){
  return setBlock('服务时段',
    ['周一至周五 09:00 – 18:00','周六 10:00 – 16:00','周日 / 法定节假日 休息'].map(function(s,i){
      return '<div class="srow"><div class="sc"><b>'+esc(s)+'</b></div><div class="act" data-time="'+i+'">编辑</div></div>';
    }).join('')) +
    setBlock('非工作时间', togRow('自动回复','非工作时间自动回复受理确认', true, 'autoReply') + togRow('紧急通道','P1 工单全天候接管', true, 'urgent'));
}

function spAssign(){
  return setBlock('分配策略',
    '<div class="tabs" id="assignMode">' +
      '<div class="chip on" data-mode="load">按负载</div>' +
      '<div class="chip" data-mode="skill">按技能</div>' +
      '<div class="chip" data-mode="round">轮询</div>' +
    '</div>') +
    setBlock('规则', togRow('新工单自动分配','启用后新工单无需人工分派', SET.autoAssign, 'autoAssign') + togRow('负载上限保护','单个客服超过 12 单停止分配', true, 'capGuard'));
}

function spNotify(){
  return setBlock('通知渠道',
    togRow('站内通知','工单变动、@提醒', SET.notify, 'notify') +
    togRow('邮件通知','重要工单与每日摘要', true, 'mail') +
    togRow('桌面推送','浏览器实时推送', true, 'push')) +
    setBlock('预警', togRow('SLA 超时预警','剩余 10 分钟时提醒', SET.alert, 'alert') + togRow('满意度低分提醒','收到 ≤3 星评价时提醒', true, 'lowCsat'));
}

function bindSetPanel(key){
  $$('#dBody .tog[data-tog]').forEach(function(el){
    el.onclick = function(){
      el.classList.toggle('on');
      var k = el.getAttribute('data-tog');
      var on = el.classList.contains('on');
      if (k === 'notify') { SET.notify = on; saveSet(); }
      if (k === 'alert')  { SET.alert = on; saveSet(); }
      if (k === 'autoAssign') { SET.autoAssign = on; saveSet(); }
    };
  });
  $$('#dBody [data-mode]').forEach(function(el){
    el.onclick = function(){
      $$('#dBody [data-mode]').forEach(function(x){ x.classList.remove('on'); });
      el.classList.add('on');
      toast('分配策略：' + el.textContent, 'ok');
    };
  });
  $$('#dBody [data-time]').forEach(function(el){
    el.onclick = function(){ toast('时段编辑（演示）'); };
  });
}

/* ================= 主题 ================= */
function applyAccent(i){
  var c = ACCENTS[i] || ACCENTS[0];
  document.documentElement.style.setProperty('--accent', c);
  state.accent = i;
}

/* ================= 实时引擎 ================= */
function initClock(){
  function tick(){
    var d = new Date();
    var h = d.getHours(), m = d.getMinutes(), s = d.getSeconds();
    var el = $('#clock');
    if (el) el.textContent = (h<10?'0':'')+h + ':' + (m<10?'0':'')+m + ':' + (s<10?'0':'')+s;
  }
  tick();
  setInterval(tick, 1000);
}

function initSlaTick(){
  setInterval(function(){
    var changed = false;
    TICKETS.forEach(function(t){
      if (t.sla > 0){ t.sla--; changed = true; }
    });
    if (!changed) return;
    $$('[data-sla]').forEach(function(el){
      var t = getTicket(el.getAttribute('data-sla'));
      if (!t) return;
      el.className = 'sla ' + slaCls(t.sla);
      el.textContent = t.sla > 0 ? fmtSla(t.sla) : '—';
    });
    $$('[data-sla-bar]').forEach(function(el){
      var t = getTicket(el.getAttribute('data-sla-bar'));
      if (!t) return;
      el.style.width = Math.max(3, Math.min(100, (t.sla/120/60)*100)) + '%';
      el.style.background = slaCls(t.sla)==='bad' ? '#ff5d7a' : slaCls(t.sla)==='warn' ? '#ffb454' : 'linear-gradient(90deg,#2fe3b4,#31c9ff)';
    });
    updateSlaWarn();
  }, 1000);
}

var NEW_TK = [
  { subj:'导出文件格式报错', cust:'南屿科技', ch:'在线', pr:'中', tags:['导出'] },
  { subj:'手机号更换后无法接收验证码', cust:'云栖生物', ch:'微信', pr:'高', tags:['验证码'] },
  { subj:'希望开放批量导入功能', cust:'明途咨询', ch:'表单', pr:'低', tags:['需求'] },
  { subj:'数据看板加载缓慢', cust:'北辰医疗', ch:'电话', pr:'中', tags:['性能'] },
  { subj:'合同电子签章无法生成', cust:'澜山地产', ch:'邮件', pr:'紧急', tags:['签章','P1'] }
];
var tkSeq = 8843;

function initLiveFeed(){
  setInterval(function(){
    var tpl = NEW_TK[Math.floor(Math.random()*NEW_TK.length)];
    var ag = AGENTS[Math.floor(Math.random()*AGENTS.length)];
    var pr = tpl.pr;
    var sla = pr==='紧急' ? 15*60 : pr==='高' ? 60*60 : pr==='中' ? 240*60 : 600*60;
    var tk = {
      id:'TK-' + (tkSeq++),
      subj:tpl.subj, cust:tpl.cust, ch:tpl.ch, pr:pr, st:'待处理',
      ag: ag.n, sla: sla, tags: tpl.tags
    };
    TICKETS.unshift(tk);
    if (TICKETS.length > 40) TICKETS.pop();

    var f = { ico:CH_ICO[tpl.ch]||'📥', c:CH_CLR[tpl.ch]||'#2fe3b4', t:'新工单进入队列', s:tpl.cust + ' · ' + tpl.subj, time:'刚刚' };
    FEED.unshift(f);
    if (FEED.length > 12) FEED.pop();
    FEED.forEach(function(x,i){ if (i>0 && x.time==='刚刚') x.time = '1 分钟前'; });

    toast('新工单 ' + tk.id + '：' + tpl.subj, 'ok');
    if (state.view === 'home') render();
    else if (state.view === 'queue') render();
  }, 11000);
}

/* ================= 搜索 ================= */
function initSearch(){
  var q = $('#q');
  q.oninput = function(){
    state.q = q.value.trim();
    if (state.view !== 'queue'){ state.view = 'queue'; buildNav(); }
    render();
  };
}

/* ================= 弹窗关闭 ================= */
function initGlobal(){
  $('#dClose').onclick = closeDrawer;
  $('#scrim').onclick = function(){ closeDrawer(); closeModal(); closeAllPopovers(); };
  $('#bell').onclick = function(e){ e.stopPropagation(); toggleBell(); };
  $('#me').onclick = function(){ openSetPanel('notify'); };
  $('#hamb').onclick = function(){ document.body.classList.toggle('nav-open'); };
  document.addEventListener('click', function(e){
    if (!e.target.closest('#popover') && !e.target.closest('#bell')) closeAllPopovers();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){ closeDrawer(); closeModal(); closeAllPopovers(); }
  });
}

/* ================= 启动 ================= */
function boot(){
  applyAccent(SET.accent);
  document.documentElement.style.setProperty('--blur', SET.blur + 'px');
  buildNav();
  render();
  initClock();
  initSlaTick();
  initLiveFeed();
  initSearch();
  initGlobal();
  updateBell();
  toast('NEXUS 服务中枢已就绪', 'ok');
}
boot();

})();
</script>
