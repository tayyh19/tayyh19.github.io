<!DOCTYPE html>
<html lang='zh-CN'><head>
<meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Tayyh19</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a,#1e3a5f,#0f172a);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;color:#fff}
.card{background:rgba(255,255,255,.08);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:56px 48px;text-align:center;max-width:480px;margin:24px;box-shadow:0 24px 64px rgba(0,0,0,.4)}
.ring{width:88px;height:88px;margin:0 auto 24px;border-radius:50%;border:3px solid rgba(96,165,250,.25);border-top-color:#60a5fa;animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:clamp(24px,5vw,34px);margin:0 0 12px;font-weight:700;letter-spacing:.5px}
p{color:rgba(255,255,255,.66);line-height:1.8;margin:0;font-size:15px}
.tag{display:inline-block;margin-top:26px;padding:8px 18px;border-radius:999px;background:rgba(96,165,250,.15);border:1px solid rgba(96,165,250,.3);color:#93c5fd;font-size:13px}
</style></head>
<body><div class='card'>
<div class='ring'></div>
<h1>网站已上线</h1>
<p>你好，这里是 Tayyh19 的个人站点。<br>页面正在建设中，敬请期待。</p>
<span class='tag'>Operit AI 部署完成</span>
</div></body></html>
