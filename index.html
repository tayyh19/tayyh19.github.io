<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08080f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tayyh19 · 作品集</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#08080f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body{min-height:100vh}
.glow{position:fixed;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none;z-index:0}
.g1{width:300px;height:300px;background:#5b7cfa;top:-120px;left:-90px}
.g2{width:260px;height:260px;background:#d946ef;top:200px;right:-120px;opacity:.35}
.g3{width:280px;height:280px;background:#22d3ee;bottom:-100px;left:-60px;opacity:.25}
.app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(96px + env(safe-area-inset-bottom,0px))}
.page{display:none}
.page.on{display:block;animation:fade .26s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{padding:6px 4px 20px}
.avatar{width:62px;height:62px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:600;background:linear-gradient(135deg,rgba(139,92,246,.9),rgba(217,70,239,.8));border:1px solid rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 28px rgba(139,92,246,.35);margin-bottom:14px}
h1{font-size:27px;margin:0 0 6px;font-weight:650;letter-spacing:.5px}
.tagline{font-size:13.5px;color:rgba(255,255,255,.58);margin:0 0 14px;line-height:1.6}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pills span{font-size:11px;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);color:rgba(255,255,255,.76)}
.feature{position:relative;padding:21px 19px;border-radius:25px;margin-bottom:24px;overflow:hidden;background:linear-gradient(150deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.26);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 16px 44px rgba(0,0,0,.4);transition:transform .16s;text-decoration:none;color:inherit;display:block}
.feature:active{transform:scale(.985)}
.feature::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 0%,rgba(34,211,238,.28),transparent 55%);pointer-events:none}
.fbadge{position:absolute;top:15px;right:15px;font-size:10px;letter-spacing:1px;padding:4px 10px;border-radius:999px;background:linear-gradient(135deg,#22d3ee,#3b82f6);color:#001018;font-weight:700}
.ficon{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:19px;background:rgba(34,211,238,.16);border:1px solid rgba(34,211,238,.4);color:#67e8f9;margin-bottom:13px}
.feature h2{font-size:20px;margin:0 0 7px;font-weight:650;letter-spacing:.4px}
.feature p{font-size:13px;line-height:1.7;color:rgba(255,255,255,.7);margin:0 0 10px}
.fmeta{font-size:10.5px;color:rgba(255,255,255,.46)}
.gTitle{font-size:11.5px;color:rgba(255,255,255,.42);letter-spacing:2px;margin:18px 0 10px 3px;display:flex;align-items:center;gap:8px}
.gTitle::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.12),transparent)}
.item{display:flex;align-items:center;gap:12px;padding:14px 13px;border-radius:17px;margin-bottom:8px;background:linear-gradient(150deg,rgba(255,255,255,.1),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 rgba(255,255,255,.2);transition:transform .14s,background .14s;text-decoration:none;color:inherit}
.item:active{transform:scale(.985);background:rgba(255,255,255,.16)}
.ico{width:40px;height:40px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-size:16px;border:1px solid rgba(255,255,255,.2)}
.item .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.item .nm{font-size:13.5px;font-weight:600;margin-bottom:3px}
.item .ds{font-size:10.5px;color:rgba(255,255,255,.46);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .go{font-size:17px;color:rgba(255,255,255,.3);flex:none;line-height:1}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 14px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;font-size:11.5px;color:rgba(255,255,255,.62);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);cursor:pointer;font-family:inherit;white-space:nowrap}
.chip.on{color:#fff;background:linear-gradient(135deg,rgba(139,92,246,.9),rgba(217,70,239,.85));border-color:rgba(255,255,255,.3)}
.foot{text-align:center;font-size:10.5px;color:rgba(255,255,255,.24);padding:14px 0 4px}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));gap:8px;z-index:50;background:linear-gradient(180deg,rgba(8,8,15,0),rgba(8,8,15,.93) 45%);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.tab{flex:1;padding:10px 4px;border:none;border-radius:15px;background:transparent;color:rgba(255,255,255,.42);font-size:10.5px;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.18s}
.tab .ti{font-size:16px;line-height:1}
.tab.on{color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.13)}
.aboutCard{padding:19px;border-radius:23px;background:linear-gradient(150deg,rgba(255,255,255,.1),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.aboutCard p{font-size:13px;line-height:1.85;color:rgba(255,255,255,.7);margin:0 0 15px}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid rgba(255,255,255,.08);font-size:12.5px}
.row .k{color:rgba(255,255,255,.48)}
.row .v{color:#fff}
a.lnk{color:#67e8f9;text-decoration:none}
@media(min-width:521px){.app{padding-top:32px}}
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
<div class="app">
  <section id="home" class="page on">
    <div class="hero">
      <div class="avatar">T</div>
      <h1>Tayyh19</h1>
      <p class="tagline">全部单文件 · 零依赖 · 手机打开即用</p>
      <div class="pills"><span>AI 视觉</span><span>交互界面</span><span>18 个作品</span></div>
    </div>
    <a class="feature" href="ai-lens/">
      <div class="fbadge">NEW</div>
      <div class="ficon">◉</div>
      <h2>AI LENS</h2>
      <p>实时目标识别 + 多人骨骼 + 变焦 + 拍照录像，浏览器里直接跑</p>
      <div class="fmeta">纯浏览器 · 免安装 · 免登录</div>
    </a>
    <div id="homeList"></div>
    <div class="foot">Operit AI · 2026</div>
  </section>

  <section id="works" class="page">
    <div class="secTitle" style="font-size:13px;color:rgba(255,255,255,.5);letter-spacing:2px;margin:0 0 12px 3px">全部作品</div>
    <div class="chips" id="chips"></div>
    <div id="workList"></div>
    <div class="foot">共 18 个作品</div>
  </section>

  <section id="about" class="page">
    <div class="secTitle" style="font-size:13px;color:rgba(255,255,255,.5);letter-spacing:2px;margin:0 0 12px 3px">关于</div>
    <div class="aboutCard">
      <p>自己做东西的人。做的东西全部是单文件、零依赖、打开即用——从 AI 视觉到系统复刻、商务后台、实验可视化。</p>
      <div class="row"><span class="k">代号</span><span class="v">Tayyh19</span></div>
      <div class="row"><span class="k">作品数</span><span class="v">18</span></div>
      <div class="row"><span class="k">技术</span><span class="v">HTML / JS / Canvas / WebGL</span></div>
      <div class="row"><span class="k">GitHub</span><span class="v"><a class="lnk" href="https://github.com/tayyh19" target="_blank">github.com/tayyh19</a></span></div>
    </div>
    <div class="foot">全部作品可在手机直接使用</div>
  </section>
</div>

<nav class="tabbar">
  <button class="tab on" data-tab="home"><span class="ti">⌂</span><span>首页</span></button>
  <button class="tab" data-tab="works"><span class="ti">▤</span><span>作品</span></button>
  <button class="tab" data-tab="about"><span class="ti">☺</span><span>关于</span></button>
</nav>

<script>
(function(){
  var APPS=[
    {k:'ai-lens', n:'AI LENS', d:'实时目标识别 + 多人骨骼 + 拍照录像', g:'AI', i:'◉', c:'#22d3ee'},
    {k:'ios26', n:'iOS 26 桌面', d:'液态玻璃桌面 · 多页 · App 内页', g:'系统', i:'◐', c:'#8b5cf6'},
    {k:'ios27', n:'iOS 27 超级版', d:'桌面 + Telegram + 商城 三合一', g:'系统', i:'◑', c:'#a78bfa'},
    {k:'kraken-ops', n:'KRAKEN OPS', d:'单机枪战 · 霓虹战场', g:'游戏', i:'▣', c:'#f472b6'},
    {k:'vault', n:'VAULT', d:'本地密码保险库', g:'安全', i:'◆', c:'#34d399'},
    {k:'crypt-lab', n:'CRYPT LAB', d:'密码学实验室 · 加解密演示', g:'安全', i:'◇', c:'#34d399'},
    {k:'suite', n:'SUITE', d:'一体化工作台 · 双引擎', g:'商务', i:'▤', c:'#38bdf8'},
    {k:'axiom', n:'AXIOM', d:'液态玻璃商务控制台', g:'商务', i:'◈', c:'#38bdf8'},
    {k:'nexus', n:'NEXUS', d:'客服工单中台 · SLA 监控', g:'商务', i:'◈', c:'#38bdf8'},
    {k:'aegis', n:'AEGIS', d:'DDoS 防护运维控制台', g:'商务', i:'◈', c:'#38bdf8'},
    {k:'kraken', n:'KRAKEN', d:'红队攻击演练台', g:'商务', i:'◈', c:'#38bdf8'},
    {k:'telegram', n:'Telegram', d:'聊天应用克隆', g:'商务', i:'✉', c:'#60a5fa'},
    {k:'shop', n:'卡密商城', d:'商家版 · 卡密交易', g:'商务', i:'▦', c:'#fbbf24'},
    {k:'gravity', n:'GRAVITY LAB X', d:'重力实验室 · 全功能版', g:'实验', i:'◍', c:'#fb923c'},
    {k:'optics', n:'OPTICS LAB', d:'光学实验室 · 光线追踪', g:'实验', i:'◌', c:'#fbbf24'},
    {k:'element', n:'ELEMENT LAB', d:'元素实验室 · 周期表交互', g:'实验', i:'⏣', c:'#4ade80'},
    {k:'chroma', n:'CHROMA', d:'程序化艺术工坊', g:'实验', i:'❖', c:'#e879f9'},
    {k:'arca', n:'ARCA', d:'知识图谱中枢', g:'实验', i:'△', c:'#67e8f9'},
    {k:'orbit', n:'ORBIT', d:'太阳系交互可视化', g:'实验', i:'○', c:'#a5b4fc'}
  ];

  function itemHTML(a){
    return '<a class="item" href="'+a.k+'/">'+
      '<span class="ico" style="background:'+a.c+'22;color:'+a.c+';border-color:'+a.c+'44">'+a.i+'</span>'+
      '<span class="txt"><span class="nm">'+a.n+'</span><span class="ds">'+a.d+'</span></span>'+
      '<span class="go">›</span></a>';
  }

  var homeList=document.getElementById('homeList');
  var workList=document.getElementById('workList');
  var chips=document.getElementById('chips');
  var GROUPS=['全部','AI','系统','游戏','安全','商务','实验'];
  var cur='全部';

  function renderHome(){
    var html='', last='';
    for(var i=0;i<APPS.length;i++){
      var a=APPS[i];
      if(a.g==='AI') continue;
      if(a.g!==last){ last=a.g; html+='<div class="gTitle">'+a.g+'</div>'; }
      html+=itemHTML(a);
    }
    homeList.innerHTML=html;
  }
  function renderWork(g){
    var html='';
    for(var i=0;i<APPS.length;i++){
      var a=APPS[i];
      if(g!=='全部'&&a.g!==g) continue;
      html+=itemHTML(a);
    }
    if(!html) html='<div class="foot">暂无</div>';
    workList.innerHTML=html;
  }
  function buildChips(){
    var html='';
    for(var i=0;i<GROUPS.length;i++){
      html+='<button class="chip'+(GROUPS[i]===cur?' on':'')+'" data-g="'+GROUPS[i]+'">'+GROUPS[i]+'</button>';
    }
    chips.innerHTML=html;
    var bs=chips.querySelectorAll('.chip');
    for(var j=0;j<bs.length;j++){
      bs[j].addEventListener('click', function(e){
        cur=e.currentTarget.getAttribute('data-g');
        buildChips();
        renderWork(cur);
      });
    }
  }

  var tabs=document.querySelectorAll('.tab');
  var pages={home:document.getElementById('home'), works:document.getElementById('works'), about:document.getElementById('about')};
  function go(k){
    for(var t=0;t<tabs.length;t++){ tabs[t].classList.toggle('on', tabs[t].getAttribute('data-tab')===k); }
    for(var p in pages){ if(pages.hasOwnProperty(p)){ pages[p].classList.toggle('on', p===k); } }
    window.scrollTo(0,0);
  }
  for(var i=0;i<tabs.length;i++){
    tabs[i].addEventListener('click', function(e){
      go(e.currentTarget.getAttribute('data-tab'));
    });
  }

  renderHome();
  buildChips();
  renderWork(cur);
})();
</script>
</body>
</html>
