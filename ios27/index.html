<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>iOS · 锁屏与主屏幕</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
    background:#000;
    display:flex;align-items:center;justify-content:center;
    height:100vh;
    height:100dvh;          /* 关键：动态视口高度，避免移动端地址栏/工具栏把上下裁掉 */
    max-height:100dvh;
    overflow:hidden;
    color:#fff;
    -webkit-font-smoothing:antialiased;
  }

  /* ================= 设备框 ================= */
  .device{
    position:relative;
    width:min(100vw,393px);
    height:min(100vh,852px);
    height:min(100dvh,852px);   /* 关键：以动态可视高度为准，锁死边框内不溢出 */
    max-height:100dvh;
    overflow:hidden;
    background:#000;
    user-select:none;
  }
  @media (min-width:440px) and (min-height:900px){
    .device{
      border-radius:56px;
      box-shadow:0 0 0 12px #101014, 0 0 0 13px #2a2a30, 0 40px 90px rgba(0,0,0,.75);
    }
  }

  /* ================= 壁纸 ================= */
  .wall{
    position:absolute;inset:0;
    background:
      radial-gradient(120% 85% at 12% 6%,  #7b5cff 0%, rgba(123,92,255,0) 55%),
      radial-gradient(115% 80% at 96% 14%, #ff5ea8 0%, rgba(255,94,168,0) 52%),
      radial-gradient(130% 90% at 88% 96%, #12b6ff 0%, rgba(18,182,255,0) 56%),
      radial-gradient(100% 75% at 4% 94%,  #ffc24a 0%, rgba(255,194,74,0) 46%),
      linear-gradient(165deg,#191938 0%,#0d0d20 55%,#05050e 100%);
  }
  .wall::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,0) 26%,rgba(0,0,0,0) 70%,rgba(0,0,0,.30) 100%);
  }

  /* ================= 液态玻璃（Liquid Glass 基类） ================= */
  .glass{
    position:relative;
    background:linear-gradient(135deg,rgba(255,255,255,.32) 0%,rgba(255,255,255,.13) 44%,rgba(255,255,255,.055) 100%);
    -webkit-backdrop-filter:blur(28px) saturate(195%) brightness(1.07);
    backdrop-filter:blur(28px) saturate(195%) brightness(1.07);
    border:1px solid rgba(255,255,255,.40);
    box-shadow:
      0 12px 30px rgba(0,0,0,.24),
      0 1px 0 rgba(255,255,255,.18),
      inset 0 1px 0 rgba(255,255,255,.62),
      inset 0 -1px 0 rgba(255,255,255,.08),
      inset 0 0 22px rgba(255,255,255,.06);
  }
  .glass::after{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(168deg,rgba(255,255,255,.60) 0%,rgba(255,255,255,.16) 14%,rgba(255,255,255,0) 30%);
    opacity:.5;
  }

  /* ================= 灵动岛 ================= */
  .island{
    position:absolute;top:11px;left:50%;transform:translateX(-50%);
    width:110px;height:36px;background:#000;border-radius:20px;
    z-index:60;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.5);overflow:hidden;
  }
  .isl-cam{position:absolute;right:9px;top:50%;margin-top:-5.5px;width:11px;height:11px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#2a2a35,#0a0a10 70%);
    box-shadow:inset 0 0 0 1px rgba(90,110,255,.28);}
  .isl-lock{display:flex;align-items:center;justify-content:center;
    transition:opacity .45s ease,transform .45s ease;}
  .isl-lock svg{width:13px;height:13px;display:block;}
  .device.unlocked .isl-lock{opacity:0;transform:scale(.35);}

  /* ================= 状态栏 ================= */
  .statusbar{
    position:relative;z-index:50;
    height:52px;flex:0 0 52px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 4px;color:#fff;font-size:14.5px;font-weight:600;letter-spacing:.2px;
  }
  .statusbar .sb-right{display:flex;align-items:center;gap:5px;}
  .statusbar svg{display:block;}
  .sb-time{padding-left:6px;font-variant-numeric:tabular-nums;}
  .sb-bat{font-size:12px;font-weight:600;letter-spacing:.2px;margin-left:1px;font-variant-numeric:tabular-nums;}
  /* 状态栏贴边：窄屏时避免右侧信号图标压到居中灵动岛 */
  .lock > .statusbar, .home > .statusbar{ margin-left:-20px; margin-right:-20px; padding-left:16px; padding-right:16px; }

  /* ================= 桌面分页（多页滑动） ================= */
  .pages{position:relative;flex:1;min-height:0;margin-top:26px;overflow:hidden;}
  .pages-track{display:flex;height:100%;width:100%;
    transition:transform .42s cubic-bezier(.32,.72,0,1);will-change:transform;}
  .page{flex:0 0 100%;width:100%;height:100%;padding-top:2px;}
  .page .hs-grid{margin-top:8px;align-content:start;}

  /* ================= App 内页（全部软件互动） ================= */
  .appscreen{
    position:absolute;inset:0;z-index:80;
    display:flex;flex-direction:column;overflow:hidden;
    background:linear-gradient(180deg,rgba(30,30,42,.74) 0%,rgba(14,14,20,.87) 58%,rgba(6,6,10,.95) 100%);
    -webkit-backdrop-filter:blur(34px) saturate(185%) brightness(1.05);
    backdrop-filter:blur(34px) saturate(185%) brightness(1.05);
    transform:translateY(100%) scale(.985);opacity:0;
    transition:transform .42s cubic-bezier(.32,.72,0,1),opacity .3s ease;
    pointer-events:none;will-change:transform,opacity;backface-visibility:hidden;
  }
  .appscreen.show{transform:none;opacity:1;pointer-events:auto;}
  .app-top{display:flex;flex-direction:column;flex:0 0 auto;}
  .app-bar{height:50px;flex:0 0 50px;display:flex;align-items:center;justify-content:center;
    position:relative;padding:0 12px;}
  .app-bar .app-title{font-size:16.5px;font-weight:600;letter-spacing:.2px;}
  .app-back{
    position:absolute;left:12px;top:50%;transform:translateY(-50%);
    width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,.10));
    border:1px solid rgba(255,255,255,.34);
    box-shadow:0 6px 16px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.5);
    cursor:pointer;transition:transform .12s ease;
  }
  .app-back:active{transform:translateY(-50%) scale(.9);}
  .app-back svg{width:11px;height:18px;}
  .app-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 18px 28px;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
  .app-body::-webkit-scrollbar{display:none;}
  .app-hero{display:flex;align-items:center;gap:14px;margin:10px 2px 20px;}
  .app-hero .hi{width:62px;height:62px;border-radius:15px;flex:0 0 62px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 20px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.3);overflow:hidden;}
  .app-hero .hi svg{width:58%;height:58%;}
  .app-hero .hi.full svg{width:100%;height:100%;}
  .app-hero .ht{font-size:23px;font-weight:700;}
  .app-hero .hs{font-size:13px;color:rgba(255,255,255,.55);margin-top:4px;}
  .card{
    background:linear-gradient(135deg,rgba(255,255,255,.20),rgba(255,255,255,.09));
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    backdrop-filter:blur(24px) saturate(180%);
    border:1px solid rgba(255,255,255,.22);border-radius:18px;
    box-shadow:0 10px 26px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.4);
    overflow:hidden;margin-bottom:16px;
  }
  .arow{display:flex;align-items:center;gap:12px;padding:13px 16px;position:relative;cursor:pointer;
    transition:background .14s ease;}
  .arow:active{background:rgba(255,255,255,.08);}
  .arow + .arow::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:rgba(255,255,255,.14);}
  .arow .at{flex:1;font-size:15.5px;}
  .arow .as{font-size:12.5px;color:rgba(255,255,255,.5);margin-top:3px;}
  .arow .av{font-size:13.5px;color:rgba(255,255,255,.5);}
  .adot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;}
  .achip{width:34px;height:34px;border-radius:50%;flex:0 0 34px;display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:600;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3);}
  .gridtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-bottom:16px;}
  .gridtiles i{aspect-ratio:1;display:block;border-radius:4px;}
  .masonry{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .masonry .mtile{aspect-ratio:9/14;border-radius:16px;position:relative;overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.24);}
  .masonry .mtile .cap{position:absolute;left:10px;bottom:10px;right:10px;font-size:12.5px;font-weight:600;
    text-shadow:0 1px 6px rgba(0,0,0,.7);}
  .calc{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .calc .ck{height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.09));
    border:1px solid rgba(255,255,255,.2);font-size:24px;font-weight:400;cursor:pointer;transition:transform .1s,background .12s;}
  .calc .ck:active{transform:scale(.93);background:rgba(255,255,255,.3);}
  .calc .ck.op{background:linear-gradient(135deg,#ffb43a,#ff9500);border-color:transparent;}
  .calc .ck.fn{background:linear-gradient(135deg,rgba(255,255,255,.42),rgba(255,255,255,.24));color:#111;}
  .calc .ck.wide{grid-column:span 2;border-radius:32px;}
  .calc-out{font-size:46px;font-weight:300;text-align:right;padding:14px 8px 20px;letter-spacing:-1px;
    font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .keypad2{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 18px;margin-top:8px;}
  .keypad2 .dk{height:64px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.08));
    border:1px solid rgba(255,255,255,.2);font-size:27px;font-weight:300;cursor:pointer;transition:transform .1s,background .12s;}
  .keypad2 .dk:active{transform:scale(.93);background:rgba(255,255,255,.3);}
  .keypad2 .dk small{font-size:9px;letter-spacing:1.5px;opacity:.7;}
  .ph-num{text-align:center;font-size:26px;font-weight:300;letter-spacing:1px;min-height:34px;margin:14px 0 4px;
    font-variant-numeric:tabular-nums;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ph-num:empty{color:rgba(255,255,255,.4);}
  .sw-btns .go.done{background:rgba(255,255,255,.18);color:#fff;}
  .plyr{width:52px;height:52px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;
    font-size:19px;cursor:pointer;transition:transform .1s;user-select:none;}
  .plyr:active{transform:scale(.92);}
  .plynav{cursor:pointer;opacity:.85;user-select:none;transition:opacity .12s;}
  .plynav:active{opacity:.5;}
  .progress span{transition:width .45s linear;}
  .clockscreen{display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:56vh;text-align:center;}
  .clockscreen .big{font-size:76px;font-weight:200;letter-spacing:-3px;font-variant-numeric:tabular-nums;}
  .clockscreen .sub{font-size:15px;opacity:.6;margin-top:10px;}
  .weatherhero{padding:26px;text-align:center;border-radius:20px;margin-bottom:16px;
    background:linear-gradient(160deg,#3aa0ff,#0a5bff);box-shadow:0 12px 30px rgba(10,90,255,.35);}
  .weatherhero .wt{font-size:64px;font-weight:200;letter-spacing:-2px;}
  .weatherhero .wc2{font-size:16px;opacity:.92;margin-top:2px;}
  .weatherhero .wh{font-size:13px;opacity:.8;margin-top:8px;}
  .wgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
  .wgrid .wd{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);border-radius:14px;
    padding:10px 4px;text-align:center;font-size:11px;color:rgba(255,255,255,.75);}
  .wgrid .wd b{display:block;font-size:15px;font-weight:500;margin-top:6px;color:#fff;}
  .mapcanvas{position:relative;height:280px;border-radius:18px;overflow:hidden;margin-bottom:16px;
    background:
      repeating-linear-gradient(0deg,rgba(255,255,255,.10) 0 1px,transparent 1px 46px),
      repeating-linear-gradient(90deg,rgba(255,255,255,.10) 0 1px,transparent 1px 46px),
      linear-gradient(160deg,#1f6b3a,#0d3d24);}
  .mapcanvas .pin{position:absolute;left:50%;top:46%;transform:translate(-50%,-100%);}
  .mapcanvas .pin svg{width:34px;height:44px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4));}
  .bignum{font-size:44px;font-weight:200;text-align:center;padding:22px 0 6px;font-variant-numeric:tabular-nums;}
  .seg{display:flex;gap:6px;justify-content:center;margin:8px 0 16px;flex-wrap:wrap;}
  .seg i{padding:6px 15px;border-radius:14px;font-size:13px;background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.16);cursor:pointer;transition:background .16s;}
  .seg i.on{background:linear-gradient(135deg,#4ade6a,#28c04a);border-color:transparent;font-weight:600;}
  .empty{text-align:center;color:rgba(255,255,255,.45);font-size:14px;padding:46px 0;}
  .app-note{font-size:12.5px;color:rgba(255,255,255,.45);line-height:1.55;margin:0 4px 14px;}
  .talking{display:flex;justify-content:flex-end;margin:6px 0;}
  .talking .bub{max-width:74%;padding:10px 14px;border-radius:18px;font-size:14.5px;line-height:1.4;
    background:linear-gradient(135deg,#3aa0ff,#0a6bff);box-shadow:0 6px 16px rgba(10,110,255,.3);}
  .talking.left{justify-content:flex-start;}
  .talking.left .bub{background:rgba(255,255,255,.16);box-shadow:none;}

  /* ================= iOS 26 互动增强（需求 #21） ================= */
  /* 开关 */
  .ios-sw{position:relative;width:51px;height:31px;border-radius:16px;flex:0 0 51px;margin-left:auto;
    background:rgba(120,120,128,.34);cursor:pointer;transition:background .26s cubic-bezier(.32,.72,0,1);}
  .ios-sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;
    background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.28);transition:transform .26s cubic-bezier(.32,.72,0,1);}
  .ios-sw.on{background:linear-gradient(135deg,#4ade6a,#28c04a);}
  .ios-sw.on::after{transform:translateX(20px);}
  /* 选中/点按反馈 */
  .arow.sel{background:rgba(255,255,255,.10);}
  .arow .av.green{color:#4ade6a;font-weight:600;}
  .seg i{transition:background .16s,transform .1s;}
  .seg i:active{transform:scale(.95);}
  .ck.op.on{box-shadow:0 0 0 2px rgba(255,255,255,.9) inset,0 0 0 2px rgba(255,255,255,.5);}
  /* 通用浮层（灯箱 / 阅读 / 呼叫） */
  .overlay{position:absolute;inset:0;z-index:120;display:flex;flex-direction:column;
    background:rgba(0,0,0,.74);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);
    opacity:0;pointer-events:none;transition:opacity .3s ease;}
  .overlay.show{opacity:1;pointer-events:auto;}
  .overlay .ov-top{padding:14px 18px;display:flex;justify-content:flex-end;align-items:center;flex:0 0 auto;}
  .overlay .ov-close{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.2);
    display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;}
  .overlay .ov-body{flex:1;overflow-y:auto;padding:0 18px 28px;}
  .ov-photo{width:100%;aspect-ratio:1;border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.5);}
  .ov-call{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;}
  .ov-call .cav{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:44px;font-weight:600;background:linear-gradient(135deg,#6ee07a,#12b34a);box-shadow:0 14px 40px rgba(18,179,74,.4);}
  .ov-call .cnm{font-size:26px;font-weight:600;}
  .ov-call .cst{font-size:14px;color:rgba(255,255,255,.6);}
  .ov-call .cbtn{margin-top:22px;width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#ff6a5a,#e02b2b);
    display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;transition:transform .12s;}
  .ov-call .cbtn:active{transform:scale(.9);}
  /* 提示条 */
  .toast{position:absolute;left:50%;bottom:34px;transform:translate(-50%,18px);z-index:200;
    background:rgba(28,28,32,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
    color:#fff;font-size:13.5px;padding:11px 18px;border-radius:20px;border:1px solid rgba(255,255,255,.16);
    box-shadow:0 10px 30px rgba(0,0,0,.42);opacity:0;pointer-events:none;
    transition:opacity .28s ease,transform .28s cubic-bezier(.32,.72,0,1);
    max-width:78%;text-align:center;line-height:1.4;}
  .toast.show{opacity:1;transform:translate(-50%,0);}
  /* 时钟分页 + 秒表/计时器 */
  .clk-pane{display:none;}
  .clk-pane.on{display:block;}
  .sw-face{text-align:center;padding:26px 0 10px;}
  .sw-face .sw-time{font-size:56px;font-weight:200;font-variant-numeric:tabular-nums;letter-spacing:-1px;}
  .sw-face .sw-lap{font-size:13px;color:rgba(255,255,255,.5);margin-top:6px;height:16px;}
  .sw-btns{display:flex;justify-content:center;gap:20px;margin-top:22px;}
  .sw-btns b{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:600;cursor:pointer;transition:transform .1s,opacity .2s;}
  .sw-btns b:active{transform:scale(.92);}
  .sw-btns .go{background:linear-gradient(135deg,#4ade6a,#28c04a);}
  .sw-btns .stp{background:linear-gradient(135deg,#ff6a5a,#e02b2b);}
  .sw-btns b.dis{opacity:.38;pointer-events:none;}
  .tm-presets{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap;}
  .tm-presets i{font-style:normal;padding:8px 16px;border-radius:16px;background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.16);font-size:13.5px;cursor:pointer;transition:background .16s;}
  .tm-presets i.on{background:linear-gradient(135deg,#4ade6a,#28c04a);border-color:transparent;font-weight:600;}
  /* 音乐 / 播放 */
  .plyr{width:54px;height:54px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;
    justify-content:center;font-size:19px;cursor:pointer;transition:transform .12s;user-select:none;}
  .plyr:active{transform:scale(.9);}
  .progress{height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin:16px 4px 6px;overflow:hidden;}
  .progress span{display:block;height:100%;width:0;background:#fff;border-radius:2px;transition:width .2s linear;}
  /* App Store 按钮 */
  .asbtn{font-size:13px;font-weight:600;color:#4ade6a;cursor:pointer;padding:2px 0;}
  .asbtn.done{color:rgba(255,255,255,.42);}
  /* 天气日卡选中 */
  .wgrid .wd{cursor:pointer;transition:background .16s,transform .1s;}
  .wgrid .wd:active{transform:scale(.95);}
  .wgrid .wd.on{background:linear-gradient(135deg,rgba(90,200,250,.55),rgba(10,110,255,.45));color:#fff;}
  /* 阅读器 */
  .reader{max-width:620px;margin:0 auto;color:#e8e8ea;font-size:16px;line-height:1.9;padding:6px 2px;}
  .reader h3{font-size:21px;font-weight:600;margin:2px 0 16px;}
  .reader p{margin-bottom:14px;color:rgba(255,255,255,.8);}
  /* 布局微调（需求 #21） */
  .app-body{padding-bottom:calc(30px + env(safe-area-inset-bottom));}
  .hs-grid{gap:17px 12px;}
  .dock{padding:11px 10px;}

  /* --- App 内页扩展组件 --- */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-grid i{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:13px;font-style:normal;color:rgba(255,255,255,.82);border-radius:50%;}
  .cal-grid i.on{background:#ff3b30;color:#fff;font-weight:600;}
  .cal-wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px;}
  .cal-wk b{text-align:center;font-size:10.5px;font-weight:600;color:rgba(255,255,255,.45);}
  .photog{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;}

  /* ================= 灵动岛互动 ================= */
  .island{
    transition:width .42s cubic-bezier(.32,.72,0,1),height .42s cubic-bezier(.32,.72,0,1),
      border-radius .42s ease;
    cursor:pointer;padding:0 12px;
  }
  .island .isl-live{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    gap:8px;opacity:0;transform:scale(.88);transition:opacity .3s ease,transform .3s ease;
    padding:0 12px;pointer-events:none;}
  .island .isl-live .lt{font-size:12.5px;font-weight:600;letter-spacing:.2px;white-space:nowrap;color:#fff;}
  .island .isl-live .ls{font-size:11px;color:rgba(255,255,255,.6);white-space:nowrap;}
  .island .isl-live svg{width:16px;height:16px;flex:0 0 16px;}

  .island.expanded .isl-lock{opacity:0;transform:scale(.6);}

  .island.expanded .dotlive{animation:pulse 1.1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.4;transform:scale(.8);}50%{opacity:1;transform:scale(1.15);}}

  /* ================= 锁屏 ================= */
  .lock{
    position:absolute;inset:0;z-index:30;

  .lock-lunar{font-size:12.5px;font-weight:450;letter-spacing:.6px;opacity:.8;margin-top:5px;text-shadow:0 2px 8px rgba(0,0,0,.25);}

  .homebar{height:5px;width:138px;border-radius:3px;background:rgba(255,255,255,.92);
    margin:8px auto 9px;flex:0 0 auto;}

  /* ================= 密码界面 ================= */
  .pass{
    position:absolute;inset:0;z-index:55;
    display:flex;flex-direction:column;align-items:center;padding:0 20px;
    background:rgba(8,8,14,.34);
    -webkit-backdrop-filter:blur(30px) saturate(140%);
    backdrop-filter:blur(30px) saturate(140%);
    opacity:0;pointer-events:none;
    transform:translateY(16px) scale(.986);
    transition:opacity .34s ease,transform .38s cubic-bezier(.32,.72,0,1);
    will-change:opacity,transform;backface-visibility:hidden;
  }
  .pass.show{opacity:1;pointer-events:auto;transform:none;}
  .pass-clock{margin-top:60px;font-size:20px;font-weight:600;letter-spacing:.3px;}
  .pass-title{margin-top:30px;font-size:17px;font-weight:500;}

    transition:background .12s,transform .12s;}
  .pass-dots i.on{background:#fff;transform:scale(1.05);}

    0%,100%{transform:translateX(0);}
    15%{transform:translateX(-11px);}
    30%{transform:translateX(9px);}
    45%{transform:translateX(-7px);}
    60%{transform:translateX(5px);}
    80%{transform:translateX(-3px);}
  }
  .pass-msg{margin-top:14px;font-size:13px;color:#ff8a8a;opacity:0;transition:opacity .2s;height:16px;}
  .pass-msg.show{opacity:1;}
  .keypad{
    margin-top:auto;margin-bottom:22px;
    display:grid;grid-template-columns:repeat(3,74px);gap:20px 34px;justify-content:center;
  }
  .key{
    position:relative;overflow:hidden;
    width:74px;height:74px;border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(135deg,rgba(255,255,255,.34) 0%,rgba(255,255,255,.15) 44%,rgba(255,255,255,.055) 100%);
    -webkit-backdrop-filter:blur(28px) saturate(195%) brightness(1.07);
    backdrop-filter:blur(28px) saturate(195%) brightness(1.07);
    border:1px solid rgba(255,255,255,.42);
    box-shadow:
      0 10px 24px rgba(0,0,0,.22),
      0 1px 0 rgba(255,255,255,.18),
      inset 0 1px 0 rgba(255,255,255,.62),
      inset 0 -1px 0 rgba(255,255,255,.08),
      inset 0 0 20px rgba(255,255,255,.06);
    font-size:33px;font-weight:300;letter-spacing:-.5px;color:#fff;
    cursor:pointer;transition:background .12s,transform .08s,box-shadow .18s;
  }
  .key::after{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(168deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.14) 16%,rgba(255,255,255,0) 34%);
    opacity:.5;
  }
  .key > *{position:relative;z-index:1;}
  .key small{font-size:9.5px;letter-spacing:2px;font-weight:500;opacity:.72;margin-top:-2px;}
  .key:active{background:rgba(255,255,255,.46);transform:scale(.95);
    box-shadow:0 4px 12px rgba(0,0,0,.26), inset 0 1px 0 rgba(255,255,255,.7);}
  .key.blank{background:none;border:none;cursor:default;pointer-events:none;box-shadow:none;}
  .key.blank::after{display:none;}
  .key.del{background:none;border:none;box-shadow:none;}
  .key.del::after{display:none;}
  .key.del svg{width:30px;height:30px;}
  .key.del:active{transform:scale(.92);}

  /* ================= 主屏幕 ================= */

  .icon::after{

    background:linear-gradient(180deg,rgba(255,255,255,.42) 0%,rgba(255,255,255,.16) 30%,rgba(255,255,255,0) 52%,rgba(0,0,0,.10) 100%);

  .setapp{

  var AUDIO = (function(){
    var ctx = null, master = null;
    function init(){

    var N = {C:261.63,D:293.66,E:329.63,F:349.23,G:392,A:440,B:493.88,'C#':277.18,'D#':311.13,'F#':369.99,'G#':415.3,'A#':466.16};

    }

      if(!init()) return null;

  /* --- 计算器引擎 --- */
  var calcS = {cur:'0', acc:null, op:null, fresh:true};
  function calcShow(){ var o = document.getElementById('calcOut'); if(o) o.textContent = calcS.cur; }
  function calcApply(a, b, op){
    if(op === '+') return a + b;
    if(op === '−') return a - b;
    if(op === '×') return a * b;
    if(op === '÷') return b === 0 ? 0 : a / b;
    return b;
  }
  function calcKey(k){
    var s = calcS;
    if(k >= '0' && k <= '9'){
      s.cur = (s.fresh || s.cur === '0') ? k : s.cur + k;
      s.fresh = false;
    }else if(k === '.'){
      if(s.cur.indexOf('.') < 0) s.cur = s.fresh ? '0.' : s.cur + '.';
      s.fresh = false;
    }else if(k === 'AC'){ s.cur = '0'; s.acc = null; s.op = null; s.fresh = true; }
    else if(k === '+/-'){ s.cur = s.cur.charAt(0) === '-' ? s.cur.slice(1) : '-' + s.cur; }
    else if(k === '%'){ s.cur = nm(parseFloat(s.cur) / 100); }
    else if(k === '÷' || k === '×' || k === '−' || k === '+'){
      var v = parseFloat(s.cur);
      if(s.op && !s.fresh) s.acc = calcApply(s.acc, v, s.op); else s.acc = v;
      s.op = k; s.fresh = true; s.cur = nm(s.acc);
    }else if(k === '='){
      var v2 = parseFloat(s.cur);
      if(s.op) s.cur = nm(calcApply(s.acc, v2, s.op));
      s.op = null; s.acc = null; s.fresh = true;
    }
    calcShow();
  }

  function clearAppTimers(){ for(var i=0;i<appTimers.length;i++) clearInterval(appTimers[i]); appTimers = []; }

  function openApp(k){
    if(k === 'settings'){ openSet(); return; }
    var f = APP_CONTENT[k];
    if(!f) return;

  /* ================= 桌面横向拖拽滑动 ================= */
  (function(){
    var box = document.getElementById('pages');
    if(!box) return;
    var sx = 0, sy = 0, dx = 0, active = false, decided = false, dragging = false;
    function down(e){
      var t = e.touches ? e.touches[0] : e;
      if(!t) return;
      sx = t.clientX; sy = t.clientY;
      active = true; decided = false; dragging = false; dx = 0;
    }
    function move(e){
      if(!active) return;
      var t = e.touches ? e.touches[0] : e;
      if(!t) return;
      var mx = t.clientX - sx, my = t.clientY - sy;
      if(!decided){
        if(Math.abs(mx) < 8 && Math.abs(my) < 8) return;
        decided = true;
        dragging = Math.abs(mx) > Math.abs(my) * 1.05;
        if(dragging) track.style.transition = 'none';
      }
      if(!dragging) return;
      dx = mx;
      var over = (pageIdx === 0 && dx > 0) || (pageIdx === PAGES.length - 1 && dx < 0);
      var x = -pageIdx * PAGE_W + dx * (over ? 0.32 : 1);
      track.style.transform = 'translateX(' + x + 'px)';
    }
    function up(){
      if(!active) return;
      active = false;
      if(!dragging){ return; }
      dragging = false;
      lastSwipe = Date.now();
      track.style.transition = '';
      var th = PAGE_W * 0.26;
      if(dx < -th) goPage(pageIdx + 1);
      else if(dx > th) goPage(pageIdx - 1);
      else goPage(pageIdx);
    }
    box.addEventListener('touchstart', down, {passive:true});
    box.addEventListener('touchmove', move, {passive:true});
    box.addEventListener('touchend', up, {passive:true});
    box.addEventListener('touchcancel', up, {passive:true});
    box.addEventListener('mousedown', down);
    document.addEventListener('mousemove', function(e){ if(active) move(e); });
    document.addEventListener('mouseup', function(){ if(active) up(); });
  })();

  /* ================= 时间刷新 ================= */
  var WK = ['周日','周一','周二','周三','周四','周五','周六'];
  function pad(n){ return (n<10?'0':'')+n; }
  function setTxt(id, v){ var e = document.getElementById(id); if(e) e.textContent = v; }

  /* ================= 农历（Intl 中文历法，无硬编码表） ================= */
  var CN_NUM = ['零','一','二','三','四','五','六','七','八','九'];
  function dayCn(n){
    if(n <= 10) return n === 10 ? '初十' : '初' + CN_NUM[n];
    if(n < 20)  return '十' + CN_NUM[n-10];
    if(n === 20) return '二十';
    if(n < 30)  return '廿' + CN_NUM[n-20];
    return n === 30 ? '三十' : '廿' + CN_NUM[n-20];
  }
  function lunarText(d){
    try{
      var fmt = new Intl.DateTimeFormat('zh-CN-u-ca-chinese', {year:'numeric',month:'long',day:'numeric'});
      var parts = fmt.formatToParts(d), o = {};
      parts.forEach(function(p){ o[p.type] = p.value; });
      var yName = (o.relatedYear ? '' : '') + (o.yearName || '');
      /* yearName 形如「丙午」，month 形如「八月」，day 可能为「25」或「二五」 */
      var dayRaw = o.day || '';
      var dayNum = parseInt(dayRaw.replace(/[^\d]/g,''), 10);
      var dayStr = isNaN(dayNum) ? dayRaw : dayCn(dayNum);
      var mon = (o.month || '').replace(/^闰/, '闰');
      return yName + '年' + mon + dayStr;
    }catch(e){ return ''; }
  }

  function refresh(){
    var d = new Date();
    var t = d.getHours() + ':' + pad(d.getMinutes());
    setTxt('lkTime', t);
    setTxt('pkTime', t);
    setTxt('sbTime', t);
    setTxt('setTime', t);
    setTxt('lkDate', (d.getMonth()+1) + '月' + d.getDate() + '日 ' + WK[d.getDay()]);
    setTxt('lkLunar', lunarText(d));
    setTxt('calD', WK[d.getDay()]);
    setTxt('calN', d.getDate());

    var s = d.getSeconds();
    rot('ckS', s*6 + (d.getMilliseconds()/1000)*6);
    rot('ckM', (d.getMinutes()*6) + s*0.1);
    rot('ckH', (d.getHours()%12)*30 + d.getMinutes()*0.5);
  }

  }

  function renderDots(){
    for(var i=0;i<dots.length;i++){
      dots[i].className = i < input.length ? 'on' : '';
    }
  }
  function onDigit(d){
    if(unlocked || input.length >= 4) return;
    input += d;
    renderDots();
    passMsg.classList.remove('show');
    if(input.length === 4) setTimeout(check, 130);
  }
  function onDel(){
    if(unlocked || !input.length) return;
    input = input.slice(0, -1);
    renderDots();
    passMsg.classList.remove('show');
  }
  function check(){
    if(input === PWD){ unlock(); }
    else{
      var pd = $('#passDots');
      pd.classList.add('bad');
      passMsg.classList.add('show');
      setTimeout(function(){ pd.classList.remove('bad'); }, 470);
      setTimeout(function(){ input=''; renderDots(); }, 520);
    }
  }

  function openPass(){
    if(unlocked) return;
    pass.classList.add('show');
  }
  function closePass(){
    pass.classList.remove('show');
    input = ''; renderDots(); passMsg.classList.remove('show');
  }
  function unlock(){
    unlocked = true;
    pass.classList.remove('show');
    passMsg.classList.remove('show');
    input = ''; renderDots();
    setTimeout(function(){
      lock.classList.add('gone');
      device.classList.add('unlocked');

  function relock(){

  /* --- 全面屏返回手势：屏幕左缘右滑，返回上一层 --- */
  (function(){
    var EDGE = 32, startX = 0, startY = 0;
    var tracking = false, active = false, busy = false, layer = null;
    /* 取最上层可返回的覆盖层 */
    function top(){
      /* App 内页：最高优先级（左缘右滑返回，跟手平移） */
      if(appscreen && appscreen.classList.contains('show')) return {el:appscreen, close:closeApp, dir:'x'};
      if(setDetail && setDetail.classList.contains('show')) return {el:setDetail, close:closeDetail, dir:'x'};
      if(setapp.classList.contains('show'))                 return {el:setapp,   close:closeSet,   dir:'y'};
      if(pass.classList.contains('show'))                   return {el:pass,     close:closePass,  dir:'x'};
      return null;
    }
    function clearEl(el){ el.style.transition=''; el.style.transform=''; el.style.opacity=''; }

    document.addEventListener('touchstart', function(e){
      if(busy) return;
      var t = e.touches[0];
      if(!t || t.clientX > EDGE){ tracking = false; return; }
      layer = top();
      if(!layer){ tracking = false; return; }
      tracking = true; active = false;
      startX = t.clientX; startY = t.clientY;
    }, {passive:true, capture:true});

    document.addEventListener('touchmove', function(e){
      if(!tracking || !layer) return;
      var t = e.touches[0]; if(!t) return;
      var dx = t.clientX - startX, dy = t.clientY - startY;
      if(!active){
        if(Math.abs(dy) > 14 && Math.abs(dy) > Math.abs(dx)){ tracking = false; return; } /* 判为纵向滚动 */
        if(dx > 8){ active = true; if(layer.dir === 'x') layer.el.style.transition = 'none'; }
        else return;
      }
      if(layer.dir !== 'x') return;                     /* 设置主页为纵向 sheet，不做跟手平移 */
      var w = layer.el.offsetWidth || 320;
      var x = Math.max(0, Math.min(dx, w));
      layer.el.style.transform = 'translateX(' + x + 'px)';
      if(layer.el === pass) layer.el.style.opacity = String(1 - Math.min(1, x / w));
    }, {passive:true, capture:true});

    document.addEventListener('touchend', function(e){
      if(!tracking || !layer) return;
      tracking = false;
      if(!active){ layer = null; return; }
      var t = e.changedTouches[0];
      var dx = t ? t.clientX - startX : 0;
      var el = layer.el, close = layer.close, dir = layer.dir;
      layer = null; busy = true;
      var w = el.offsetWidth || 320;
      var done = false;
      function finish(){ if(done) return; done = true; close(); clearEl(el); busy = false; }
      var commit = dx > Math.min(96, w * 0.32);
      if(commit){
        if(dir === 'y'){
          el.style.transition = 'transform .4s cubic-bezier(.32,.72,0,1)';
          el.style.transform = 'translateY(100%)';
        }else{
          el.style.transition = 'transform .3s cubic-bezier(.32,.72,0,1),opacity .28s ease';
          el.style.transform = 'translateX(100%)';
          if(el === pass) el.style.opacity = '0';
        }
        el.addEventListener('transitionend', finish, {once:true});
        setTimeout(finish, 380);
      }else{
        if(dir === 'x'){
          el.style.transition = 'transform .34s cubic-bezier(.32,.72,0,1),opacity .3s ease';
          el.style.transform = 'translateX(0)';
          if(el === pass) el.style.opacity = '1';
        }
        function reset(){ if(done) return; done = true; clearEl(el); busy = false; }
        el.addEventListener('transitionend', reset, {once:true});
        setTimeout(reset, 400);
      }
    }, {passive:true, capture:true});
  })();

  var EMBED_KEYS = { telegram:1, cardmall:1 };
  var EMBED_SRC = {}, EMBED_IFRAME = {};
  var embedPark = document.createElement('div');
  embedPark.setAttribute('aria-hidden','true');
  embedPark.style.cssText = 'position:absolute;left:-9999px;top:-9999px;width:2px;height:2px;overflow:hidden;';
  document.body.appendChild(embedPark);

  function b64DecodeUtf8(b64){
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for(var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    try{ return new TextDecoder('utf-8').decode(bytes); }
    catch(e){ return decodeURIComponent(escape(bin)); }
  }
  function srcOf(k){
    if(EMBED_SRC[k] != null) return EMBED_SRC[k];
    var el = document.getElementById(k === 'telegram' ? 'src-telegram' : 'src-cardmall');
    var b64 = (el ? el.textContent : '') || '';
    EMBED_SRC[k] = b64 ? b64DecodeUtf8(b64.trim()) : '';
    return EMBED_SRC[k];
  }
  function iframeOf(k){
    if(EMBED_IFRAME[k]) return EMBED_IFRAME[k];
    var f = document.createElement('iframe');
    f.className = 'embed-frame';
    f.setAttribute('title', k === 'telegram' ? 'Telegram' : '卡密商城');
    f.setAttribute('allow', 'clipboard-write');
    f.srcdoc = srcOf(k);
    EMBED_IFRAME[k] = f;
    embedPark.appendChild(f);            /* 先寄存在离屏容器，保持运行状态 */
    return f;
  }
  function parkEmbed(k){
    if(!EMBED_KEYS[k]) return;
    var f = EMBED_IFRAME[k];
    if(f && f.parentNode !== embedPark) embedPark.appendChild(f);
  }

    for(var i = 0; i < WALLS.length; i++){
      h += '<div class="wall-item' + (i === curWall ? ' on' : '') + '" data-w="' + i + '" style="background:' + WALLS[i].css + '"><b>' + WALLS[i].n + '</b></div>';
    }
    return h + '</div></div>';
  };

  /* ---------- 控制中心 ---------- */
  var CC_ICON = {
    rot:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.2 12a7.8 7.8 0 0 1 13.2-5.6"/><path d="M19.8 12a7.8 7.8 0 0 1-13.2 5.6"/><path d="M17.6 2.8v3.8h-3.8M6.4 21.2v-3.8h3.8"/></svg>',
    rec:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="8.4"/><circle cx="12" cy="12" r="3.4" fill="#fff" stroke="none"/></svg>'
  };
  var CC_TILES = [
    {k:'air',     n:'飞行模式',   on:0, ic:SETI.airplane},
    {k:'wifi',    n:'无线局域网', on:1, ic:SETI.wifi},
    {k:'bt',      n:'蓝牙',       on:1, ic:SETI.bluetooth},
    {k:'cell',    n:'蜂窝网络',   on:1, ic:SETI.cell},
    {k:'moon',    n:'专注模式',   on:0, ic:SETI.moon},
    {k:'rot',     n:'旋转锁定',   on:0, ic:CC_ICON.rot},
    {k:'airdrop', n:'隔空投送',   on:0, ic:SETI.hotspot},
    {k:'rec',     n:'屏幕录制',   on:0, ic:CC_ICON.rec}
  ];
  var ccBuilt = false, ccStartY = null;
  function applyBright(p){
    var dev = document.getElementById('device');
    var d = document.getElementById('dimOv');
    if(!d){
      d = document.createElement('div');
      d.id = 'dimOv';
      d.style.cssText = 'position:absolute;inset:0;background:#000;pointer-events:none;z-index:200;opacity:0;transition:opacity .2s ease;';
      dev.appendChild(d);
    }
    d.style.opacity = String(Math.max(0, (100 - p) / 100 * 0.62));
  }
  function buildCC(){
    if(ccBuilt) return; ccBuilt = true;
    var dev = document.getElementById('device');
    var cc = document.createElement('div');
    cc.className = 'cc'; cc.id = 'cc';
    var h = '<div class="cc-mask" id="ccMask"></div><div class="cc-panel"><div class="cc-grid">';
    for(var i = 0; i < CC_TILES.length; i++){
      var t = CC_TILES[i];
      h += '<div class="cc-tile' + (t.on ? ' on' : '') + '" data-i="' + i + '">' + t.ic + '<span>' + t.n + '</span></div>';
    }
    h += '</div><div class="cc-sub">';
    h += '<div class="cc-card"><div class="cc-lab">☀ 亮度</div><div class="cc-slider" id="ccBright"><i style="width:62%"></i></div></div>';
    h += '<div class="cc-card"><div class="cc-lab">🔊 音量</div><div class="cc-slider" id="ccVol"><i style="width:48%"></i></div></div>';
    h += '</div><div class="cc-hint">点击空白处或上滑关闭</div></div>';
    cc.innerHTML = h;
    dev.appendChild(cc);

    var tiles = cc.querySelectorAll('.cc-tile');
    for(var j = 0; j < tiles.length; j++){
      (function(el, idx){
        el.addEventListener('click', function(){
          el.classList.toggle('on');
          CC_TILES[idx].on = el.classList.contains('on') ? 1 : 0;
          try{ AUDIO.SFX.click(); }catch(e){}
          toast(CC_TILES[idx].n + (CC_TILES[idx].on ? ' 已开启' : ' 已关闭'));
        });
      })(tiles[j], j);
    }
    function bindSlider(id, cb){
      var s = document.getElementById(id); if(!s) return;
      function set(e){
        var r = s.getBoundingClientRect();
        var x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
        var pct = Math.max(0, Math.min(100, x / r.width * 100));
        s.firstChild.style.width = pct + '%';
        if(cb) cb(pct);
      }
      s.addEventListener('click', set);
      s.addEventListener('touchmove', function(e){ set(e); }, {passive:true});
      s.addEventListener('mousedown', function(e){
        function mv(ev){ set(ev); }
        function up(){ document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); }
        document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
      });
    }
    bindSlider('ccBright', function(p){ applyBright(p); });
    bindSlider('ccVol');

    cc.querySelector('#ccMask').addEventListener('click', hideCC);
    var panel = cc.querySelector('.cc-panel');
    panel.addEventListener('touchstart', function(e){ ccStartY = e.touches[0].clientY; }, {passive:true});
    panel.addEventListener('touchend', function(e){
      if(ccStartY != null && e.changedTouches[0].clientY - ccStartY < -46) hideCC();
      ccStartY = null;
    }, {passive:true});
  }
  function showCC(){ buildCC(); var cc = document.getElementById('cc'); if(cc) cc.classList.add('show'); }
  function hideCC(){ var cc = document.getElementById('cc'); if(cc) cc.classList.remove('show'); }

  /* 右上角下拉呼出控制中心（触屏 + 鼠标） */
  (function(){
    var st = false, sy = 0, dev = document.getElementById('device');
    function unlockedOK(){
      return device.classList.contains('unlocked') &&
        !appscreen.classList.contains('show') &&
        !setapp.classList.contains('show') &&
        !pass.classList.contains('show');
    }
    document.addEventListener('touchstart', function(e){
      if(!unlockedOK()) return;
      var t = e.touches[0]; if(!t) return;
      var w = dev.clientWidth || 320;
      if(t.clientY < 46 && t.clientX > w * 0.5){ st = true; sy = t.clientY; } else st = false;
    }, {passive:true, capture:true});
    document.addEventListener('touchmove', function(e){
      if(!st) return; var t = e.touches[0]; if(!t) return;
      if(t.clientY - sy > 24){ st = false; showCC(); }
    }, {passive:true, capture:true});
    document.addEventListener('touchend', function(){ st = false; }, {passive:true});

    var md = false, my = 0;
    document.addEventListener('mousedown', function(e){
      if(!unlockedOK()) return;
      var w = dev.clientWidth || 320;
      if(e.clientY < 46 && e.clientX > w * 0.5){ md = true; my = e.clientY; }
    });
    document.addEventListener('mousemove', function(e){
      if(!md) return;
      if(e.clientY - my > 24){ md = false; showCC(); }
    });
    document.addEventListener('mouseup', function(){ md = false; });
  })();

  buildSettings();

  /* ================= 启动 ================= */
  refresh();
  setInterval(refresh, 1000);
})();
</script>
