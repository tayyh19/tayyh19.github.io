<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Telegram</title>
<style>
:root{
  /* ---- 品牌与语义色 ---- */
  --blue:#3390ec;--blue-d:#2b7cd3;--blue-l:rgba(51,144,236,.16);
  --txt:#0f172a;--dim:#5f7086;
  --line:rgba(255,255,255,.5);--sep:rgba(0,0,0,.18);
  --hover:rgba(255,255,255,.5);--check:#41a883;--ring:rgba(255,255,255,.8);
  /* ---- 液态玻璃令牌（Liquid Glass 核心） ---- */
  --glass:rgba(255,255,255,.40);        /* 玻璃底 */
  --glass-hi:rgba(255,255,255,.56);     /* 提亮玻璃（顶栏/底栏） */
  --glass-lo:rgba(255,255,255,.26);     /* 压低玻璃（侧栏） */
  --glass-brd:rgba(255,255,255,.68);    /* 玻璃描边 */
  --glass-blur:blur(20px) saturate(1.9) brightness(1.05);
  --glass-in:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.12);
  --glow:0 10px 34px rgba(56,120,220,.16);
  --glow-blue:0 0 20px rgba(51,144,236,.45);
  /* ---- 液态玻璃：折射 / 高光 / 色散 ---- */
  --lg-blend:soft-light;
  --lg-gloss:.9;
  --lg-sheen:linear-gradient(115deg,rgba(255,255,255,.75) 0%,rgba(255,255,255,.18) 20%,rgba(255,255,255,0) 44%,rgba(255,255,255,.10) 70%,rgba(255,255,255,.46) 100%);
  --lg-refract:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,0) 46%);
  --bg:#eef3fb;--chat-bg:#ffffff;--header:transparent;
  --chat-dot:rgba(51,144,236,.10);
  --bub-you:#f1f4fa;--bub-you-brd:rgba(31,84,150,.10);
  --bub-me:rgba(51,144,236,.92);
  /* ---- 尺寸令牌（统一间距/圆角） ---- */
  --r-bub:18px;--r-bub-tail:6px;--r-pill:22px;--r-btn:50%;
  --gap-msg:9px;--pad-bub:8px 12px 9px;--pad-screen:14px;
  /* ---- 阴影 ---- */
  --sh-bub:0 4px 16px rgba(31,84,150,.10);
  --sh-composer:0 -6px 24px rgba(31,84,150,.08);
  --sh-fab:0 6px 20px rgba(31,84,150,.26),0 0 18px rgba(51,144,236,.25);
  /* ---- 动效 ---- */
  --ease:cubic-bezier(.32,1.22,.5,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  /* ---- 消息区最大宽度 ---- */
  --col:760px;
}
body.dark{
  --blue:#5aa9f0;--blue-d:#3f8bd4;--blue-l:rgba(90,169,240,.18);
  --txt:#eaf2fb;--dim:#93a4b6;--line:rgba(255,255,255,.13);--sep:rgba(255,255,255,.17);
  --hover:rgba(255,255,255,.10);--check:#6fc96f;--ring:rgba(12,20,32,.85);
  --glass:rgba(22,32,46,.42);--glass-hi:rgba(34,48,68,.56);--glass-lo:rgba(16,24,36,.30);
  --glass-brd:rgba(255,255,255,.16);
  --glass-blur:blur(20px) saturate(1.7) brightness(1.12);
  --glass-in:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.26),inset 0 0 0 1px rgba(255,255,255,.05);
  --glow:0 12px 38px rgba(0,0,0,.42);
  --glow-blue:0 0 22px rgba(90,169,240,.5);
  --lg-blend:screen;
  --lg-gloss:.42;
  --lg-sheen:linear-gradient(115deg,rgba(255,255,255,.34) 0%,rgba(255,255,255,.07) 20%,rgba(255,255,255,0) 44%,rgba(255,255,255,.04) 70%,rgba(255,255,255,.20) 100%);
  --lg-refract:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0) 46%);
  --bg:#0b1526;--chat-bg:#0b1526;--header:transparent;
  --chat-dot:rgba(255,255,255,.07);
  --bub-you:#1b2637;--bub-you-brd:rgba(255,255,255,.09);
  --bub-me:rgba(46,116,196,.92);
  --sh-bub:0 6px 20px rgba(0,0,0,.32);
  --sh-composer:0 -6px 24px rgba(0,0,0,.34);
  --sh-fab:0 6px 20px rgba(0,0,0,.5),0 0 18px rgba(90,169,240,.3);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--txt);overflow:hidden;font-size:15px;line-height:1.35;
  background:#eef3fb;
  transition:background .3s,color .3s}
body.dark{background:#0b1526}
/* ---- 原「巨型模糊光斑」已移除：两个 60vmax+ 的 layer 每帧高斯模糊并无限位移动画，
        是滚动卡顿的主因；纯白/纯深底不再需要它来“透” ---- */
body::before,body::after{content:none!important;animation:none!important;filter:none!important}
/* ---- 半发光背景光斑（玻璃要有东西可“透”） ---- */
/* （原半发光光斑样式与 drift1/drift2 关键帧已删除） */
.app{display:flex;height:calc(100dvh - var(--tabh));max-width:1400px;margin:0 auto;position:relative;z-index:1}

/* ---------- 侧栏 ---------- */
.side{width:340px;flex:none;display:flex;flex-direction:column;position:relative;z-index:2;
  background:var(--glass-lo);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border-right:1px solid var(--glass-brd);box-shadow:var(--glass-in),var(--glow);
  transition:background .3s}
.side-head{display:flex;align-items:center;gap:12px;padding:10px 14px;
  background:transparent;border-bottom:1px solid var(--line)}
.menu-btn{width:40px;height:40px;border-radius:50%;border:none;background:none;
  display:grid;place-items:center;cursor:pointer;color:var(--dim);flex:none;transition:background .15s,box-shadow .15s}
.menu-btn:hover{background:var(--hover);box-shadow:var(--glass-in)}
.menu-btn svg{width:22px;height:22px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--glass);
  border:1px solid var(--glass-brd);border-radius:20px;padding:8px 14px;
  backdrop-filter:blur(10px) saturate(1.5);-webkit-backdrop-filter:blur(10px) saturate(1.5);
  transition:box-shadow .2s var(--ease)}
.search:focus-within{box-shadow:inset 0 0 0 1.5px var(--blue),var(--glow-blue)}
.search svg{width:18px;height:18px;color:var(--dim);flex:none}
.search input{border:none;background:none;outline:none;font-family:inherit;
  font-size:14.5px;width:100%;color:var(--txt)}
.search input::placeholder{color:var(--dim)}

.chat-list{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 0}
.chat-list::-webkit-scrollbar{width:6px}
.chat-list::-webkit-scrollbar-thumb{background:rgba(128,128,128,.3);border-radius:3px}
.chat-list::-webkit-scrollbar-thumb:hover{background:rgba(128,128,128,.5)}
.chat-item{display:flex;gap:12px;padding:9px 12px;cursor:pointer;
  transition:background .14s var(--ease),box-shadow .14s var(--ease),transform .12s var(--ease);
  position:relative;border-radius:10px;margin:1px 6px;-webkit-tap-highlight-color:transparent}
.chat-item:active{transform:scale(.985)}
.chat-item:hover{background:var(--hover);box-shadow:var(--glass-in)}
.chat-item.active{background:linear-gradient(135deg,rgba(51,144,236,.94),rgba(96,176,255,.84));
  box-shadow:0 6px 20px rgba(51,144,236,.36),var(--glow-blue),var(--glass-in)}
.chat-item.active .ci-name,.chat-item.active .ci-last,.chat-item.active .ci-time{color:#fff}
.chat-item.active .ci-last .check{color:rgba(255,255,255,.95)}
.chat-item.active .badge{background:#fff;color:var(--blue)}
.chat-item.active .avatar .online{border-color:var(--blue)}
.chat-item:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}

/* ---------- 联系人分隔线（每条之间 1px 细横杠） ---------- */
.chat-item::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--sep);pointer-events:none}
.chat-item:last-child::after{display:none}
.chat-item.active::after{background:rgba(255,255,255,.24)}
/* 置顶/静音状态 */
.ci-pin{display:inline-block;margin-right:5px;font-size:11px;vertical-align:1px;opacity:.85}
.chat-item.active .ci-pin{filter:brightness(0) invert(1)}
.mute-ico{margin-left:5px;font-size:11.5px;opacity:.7;vertical-align:1px}
.chat-item.active .mute-ico{opacity:.9}
.chat-item.muted .ci-name{opacity:.82}
.chat-item.muted .badge{background:linear-gradient(135deg,#9aa6b2,#6d7a86);box-shadow:none}
.chat-item.muted .badge.dot{background:#9aa6b2}

/* ---------- 聊天列表长按 / 右键菜单 ---------- */
.ctx-menu{position:fixed;z-index:70;min-width:192px;padding:6px;border-radius:14px;
  background:var(--glass-hi);border:1px solid var(--glass-brd);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  box-shadow:var(--glass-in),0 18px 46px rgba(0,0,0,.34);
  opacity:0;transform:scale(.94);transform-origin:top left;pointer-events:none;
  transition:opacity .24s var(--ease),transform .24s var(--ease-spring)}
.ctx-menu.show{opacity:1;transform:scale(1);pointer-events:auto}
.ctx-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;
  font-size:14px;cursor:pointer;color:var(--txt);transition:background .12s var(--ease);
  -webkit-tap-highlight-color:transparent}
.ctx-item:hover{background:var(--hover)}
.ctx-item:active{transform:scale(.985)}
.ctx-item .ic{width:20px;text-align:center;font-size:15px;flex:none}
.ctx-item.danger{color:#e17076}
.ctx-sep{height:1px;margin:4px 8px;background:var(--line)}

/* ---------- 搜索清空按钮 ---------- */
.search-clear{display:none;flex:none;width:22px;height:22px;border:none;background:none;
  border-radius:50%;color:var(--dim);cursor:pointer;font-size:15px;line-height:1;
  align-items:center;justify-content:center;padding:0;
  transition:background .14s var(--ease),color .14s var(--ease)}
.search-clear:hover{background:var(--hover);color:var(--txt)}
.search.has-q .search-clear{display:flex}

.avatar{width:54px;height:54px;border-radius:50%;flex:none;display:grid;place-items:center;
  color:#fff;font-weight:600;font-size:20px;position:relative;user-select:none;
  box-shadow:0 0 0 1px rgba(255,255,255,.45) inset,0 6px 16px rgba(31,84,150,.24),0 0 14px rgba(51,144,236,.18);
  transition:border-radius .18s var(--ease),box-shadow .18s var(--ease)}
.chat-item:hover .avatar{border-radius:34%}
.avatar .online{position:absolute;right:1px;bottom:1px;width:13px;height:13px;border-radius:50%;
  background:#4fae4e;border:2.5px solid var(--ring);box-shadow:0 0 8px rgba(79,174,78,.9)}
.ci-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
.ci-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ci-name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-time{font-size:12px;color:var(--dim);flex:none;font-variant-numeric:tabular-nums}
.ci-bot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ci-last{font-size:14px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.ci-last .check{color:var(--check);margin-right:3px}
.badge{background:linear-gradient(135deg,#4aa3ff,#2b7cd3);color:#fff;font-size:12px;font-weight:600;min-width:22px;height:22px;
  padding:0 6px;border-radius:11px;display:grid;place-items:center;flex:none;
  font-variant-numeric:tabular-nums;animation:badgeIn .25s var(--ease);
  box-shadow:0 0 10px rgba(51,144,236,.7)}
@keyframes badgeIn{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.badge.dot{width:10px;height:10px;min-width:10px;padding:0}

/* ---------- 主区 ---------- */
.main{flex:1;display:flex;flex-direction:column;position:relative;background:var(--chat-bg);min-width:0;
  background-image:radial-gradient(circle at 50% 50%,var(--chat-dot) 1.6px,transparent 1.7px);
  background-size:18px 18px;background-repeat:repeat;
  transition:background-color .3s}
/* 旧的四层彩色光晕已废弃：聊天背景改为实色底 + 点阵图案 */
.main::before{content:none}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;color:var(--dim);position:relative;z-index:1}
.empty .big{width:110px;height:110px;border-radius:50%;background:var(--glass);
  border:1px solid var(--glass-brd);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  display:grid;place-items:center;box-shadow:var(--glass-in),var(--glow),var(--glow-blue)}
.empty .big svg{width:56px;height:56px;color:var(--dim)}
.empty p{font-size:14px}

.chat-head{display:flex;align-items:center;gap:12px;padding:8px 14px;
  background:var(--glass-hi);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border-bottom:1px solid var(--line);box-shadow:var(--glass-in);position:relative;z-index:3;flex:none}
.back-btn{width:40px;height:40px;border-radius:50%;border:none;background:none;
  display:none;place-items:center;cursor:pointer;color:var(--dim);flex:none;transition:background .15s}
.back-btn:hover{background:var(--hover)}
.back-btn svg{width:24px;height:24px}
.chat-head .avatar{width:42px;height:42px;font-size:17px}
.ch-info{flex:1;min-width:0}
.ch-name-row{display:flex;align-items:center;gap:2px;min-width:0}
.ch-name{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-status{font-size:13px;color:var(--blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-actions{display:flex;gap:2px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:none;background:none;display:grid;
  place-items:center;cursor:pointer;color:var(--dim);transition:background .15s}
.icon-btn:hover{background:var(--hover)}
.icon-btn svg{width:21px;height:21px}

.messages{flex:1;overflow-y:auto;padding:18px 4% 22px;position:relative;z-index:1;
  display:flex;flex-direction:column;gap:var(--gap-msg);scroll-behavior:smooth;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;contain:layout paint}
.messages::-webkit-scrollbar{width:7px}
.messages::-webkit-scrollbar-thumb{background:rgba(128,128,128,.35);border-radius:4px}
.messages::-webkit-scrollbar-thumb:hover{background:rgba(128,128,128,.55)}
/* 消息按列居中限宽，避免超宽屏气泡被拉长 */
.messages > *{width:100%;max-width:var(--col);margin:0 auto}
.messages > .msg{align-self:auto}

.msg{max-width:70%;padding:var(--pad-bub);border-radius:var(--r-bub);position:relative;
  word-wrap:break-word;overflow-wrap:anywhere;line-height:1.42;box-shadow:var(--sh-bub);
  animation:pop .24s var(--ease);font-size:15px}
@keyframes pop{from{opacity:0;transform:translateY(7px) scale(.97)}to{opacity:1;transform:none}}
.msg.you{align-self:flex-start;margin-right:auto;background:var(--bub-you);
  border:1px solid var(--bub-you-brd);
  box-shadow:var(--sh-bub);border-bottom-left-radius:var(--r-bub-tail)}
.msg.me{align-self:flex-end;margin-left:auto;color:#fff;
  background:linear-gradient(135deg,rgba(51,144,236,.94),rgba(96,176,255,.86));
  border:1px solid rgba(255,255,255,.34);
  box-shadow:0 6px 20px rgba(51,144,236,.34),0 0 18px rgba(51,144,236,.26),var(--glass-in);
  border-bottom-right-radius:var(--r-bub-tail)}
.msg.me .who{color:rgba(255,255,255,.92)}
/* 连续同方向消息：收紧间距并合并圆角（由 JS 加 .stack） */
.msg.stack{margin-top:-3px}
.msg.me + .msg.me.stack{border-top-right-radius:var(--r-bub-tail)}
.msg.you + .msg.you.stack{border-top-left-radius:var(--r-bub-tail)}
.msg .txt{white-space:pre-wrap}
.msg .who{font-size:13px;font-weight:600;color:var(--blue);margin-bottom:2px}
.msg .meta{display:inline-flex;align-items:center;gap:3px;float:right;
  margin:5px -2px -3px 9px;font-size:11.5px;color:var(--check);position:relative;top:3px;
  user-select:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.msg.you .meta{color:var(--dim)}
.msg .meta svg{width:16px;height:16px}
.msg.me .meta{color:rgba(255,255,255,.82)}
.msg.me .meta svg{color:rgba(255,255,255,.92)}
/* 待发送/失败态（AI 接入后复用） */
.msg.pending{opacity:.6}
.msg.failed .meta{color:#e0524a}
.msg .retry{margin-left:6px;color:#e0524a;cursor:pointer;text-decoration:underline;font-weight:600}

/* ---- AI 接入新增样式 ---- */
/* 流式光标 */
.msg .txt.streaming::after{content:"▍";color:var(--blue);margin-left:1px;
  animation:caret 1s steps(1) infinite;font-weight:400}
@keyframes caret{0%,50%{opacity:1}51%,100%{opacity:0}}
/* 系统/错误提示行 */
.sys-note{align-self:center;margin:6px auto;max-width:82%;text-align:center;font-size:12.5px;
  color:var(--dim);background:var(--hover);padding:5px 12px;border-radius:12px}
.sys-note.err{color:#e0524a}
/* 头部 AI 状态徽标 */
.ai-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  padding:2px 7px;border-radius:9px;background:var(--blue-l);color:var(--blue);
  margin-left:6px;vertical-align:1px;flex:none}
.ai-pill.off{background:var(--hover);color:var(--dim)}
.ai-pill.err{background:rgba(224,82,74,.16);color:#e0524a}
.ai-pill i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.ai-pill.busy i{animation:pulseDot .9s infinite}
@keyframes pulseDot{0%,100%{opacity:.3}50%{opacity:1}}
/* 代码块 / 行内代码 */
.msg .txt code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:13px;background:rgba(128,128,128,.16);padding:1.5px 5px;border-radius:5px}
.msg .txt pre{margin:6px 0;padding:9px 11px;border-radius:10px;overflow-x:auto;
  background:rgba(0,0,0,.07);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:13px;line-height:1.5}
body.dark .msg.me .txt pre{background:rgba(0,0,0,.28)}
body.dark .msg.you .txt pre{background:rgba(0,0,0,.32)}
.msg .txt pre code{background:none;padding:0}
/* 设置面板 */
.set-panel{position:fixed;inset:0;z-index:50;background:rgba(10,20,35,.42);display:none;
  align-items:center;justify-content:center;padding:18px;
  backdrop-filter:blur(10px) saturate(1.3);-webkit-backdrop-filter:blur(10px) saturate(1.3)}
.set-panel.show{display:flex}
.set-card{background:var(--glass-hi);color:var(--txt);width:100%;max-width:460px;max-height:86dvh;
  overflow-y:auto;border-radius:18px;padding:20px;
  border:1px solid var(--glass-brd);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  box-shadow:var(--glass-in),0 20px 60px rgba(10,30,60,.34),var(--glow);
  animation:pop .22s var(--ease)}
.set-card h3{font-size:17px;margin-bottom:4px}
.set-card .hint{font-size:12.5px;color:var(--dim);margin-bottom:14px;line-height:1.5}
.set-card label{display:block;font-size:12.5px;font-weight:600;color:var(--dim);margin:12px 0 5px}
.set-card input,.set-card select{width:100%;padding:9px 12px;border-radius:10px;font-family:inherit;
  font-size:14px;border:1px solid var(--glass-brd);background:var(--glass);color:var(--txt);outline:none}
.set-card input:focus,.set-card select:focus{border-color:var(--blue);box-shadow:var(--glow-blue)}
.set-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}
.set-actions button{padding:9px 18px;border-radius:10px;border:none;font-family:inherit;
  font-size:14px;font-weight:600;cursor:pointer}
.set-actions .ghost{background:var(--glass);color:var(--txt);border:1px solid var(--glass-brd)}
.set-actions .primary{background:linear-gradient(135deg,#4aa3ff,#2b7cd3);color:#fff;
  box-shadow:0 4px 16px rgba(51,144,236,.45),0 0 20px rgba(51,144,236,.35)}
.set-row{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-top:12px}
.set-row input[type=checkbox]{width:auto}

.date-sep{align-self:center;width:auto;background:rgba(84,110,122,.36);color:#fff;font-size:12.5px;
  padding:4px 13px;border-radius:12px;margin:10px auto;
  backdrop-filter:blur(10px) saturate(1.4);-webkit-backdrop-filter:blur(10px) saturate(1.4);
  border:1px solid rgba(255,255,255,.28);
  font-weight:500;box-shadow:0 4px 12px rgba(0,0,0,.10),0 0 14px rgba(120,170,220,.22)}
body.dark .date-sep{background:rgba(90,110,130,.36);border-color:rgba(255,255,255,.16)}

.typing{align-self:flex-start;margin-right:auto;background:var(--bub-you);padding:14px 16px;
  border-radius:var(--r-bub);border-bottom-left-radius:var(--r-bub-tail);display:flex;gap:5px;
  border:1px solid var(--glass-brd);backdrop-filter:blur(12px) saturate(1.6);
  -webkit-backdrop-filter:blur(12px) saturate(1.6);
  box-shadow:var(--sh-bub),var(--glass-in);animation:pop .24s var(--ease)}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--blue);animation:bounce 1.3s infinite;
  box-shadow:0 0 8px rgba(51,144,236,.8)}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}

/* 滚动到底部悬浮按钮 */
.scroll-fab{position:absolute;right:18px;bottom:86px;z-index:6;width:44px;height:44px;
  border-radius:50%;border:1px solid var(--glass-brd);background:var(--glass-hi);color:var(--dim);cursor:pointer;
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  display:grid;place-items:center;box-shadow:var(--glass-in),var(--sh-fab);
  opacity:0;transform:translateY(10px) scale(.9);pointer-events:none;
  transition:opacity .22s var(--ease),transform .22s var(--ease)}
.scroll-fab.show{opacity:1;transform:none;pointer-events:auto}
.scroll-fab:hover{color:var(--blue);box-shadow:var(--glass-in),var(--sh-fab),var(--glow-blue)}
.scroll-fab:active{transform:scale(.9)}
.scroll-fab svg{width:22px;height:22px}
.scroll-fab .nbadge{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;
  border-radius:10px;background:linear-gradient(135deg,#4aa3ff,#2b7cd3);color:#fff;font-size:11px;font-weight:700;
  display:none;place-items:center;border:2px solid rgba(255,255,255,.72);
  box-shadow:0 0 10px rgba(51,144,236,.8)}
body.dark .scroll-fab .nbadge{border-color:rgba(12,20,32,.9)}

.composer{flex:none;display:flex;align-items:flex-end;gap:8px;padding:10px 14px 14px;
  background:var(--chat-bg);
  border-top:1px solid var(--line);box-shadow:var(--glass-in),var(--sh-composer);
  position:relative;z-index:3}
.composer .icon-btn{flex:none;width:44px;height:44px}
.input-wrap{flex:1;background:var(--glass);border-radius:var(--r-pill);padding:10px 15px;min-height:44px;
  display:flex;align-items:center;border:1px solid var(--glass-brd);
  backdrop-filter:blur(10px) saturate(1.5);-webkit-backdrop-filter:blur(10px) saturate(1.5);
  transition:box-shadow .2s var(--ease),background .2s}
.input-wrap:focus-within{box-shadow:inset 0 0 0 1.5px var(--blue),var(--glow-blue)}
.input-wrap textarea{border:none;outline:none;background:none;font-family:inherit;font-size:15px;
  width:100%;resize:none;max-height:120px;line-height:1.45;color:var(--txt);overflow-y:auto}
.input-wrap textarea::placeholder{color:var(--dim)}
.send-btn{width:48px;height:48px;border-radius:var(--r-btn);border:none;flex:none;
  background:linear-gradient(135deg,#4aa3ff,#2b7cd3);
  color:#fff;display:grid;place-items:center;cursor:pointer;
  transition:transform .16s var(--ease),background .16s,opacity .16s,box-shadow .16s;
  box-shadow:0 4px 16px rgba(51,144,236,.5),0 0 22px rgba(51,144,236,.42)}
.send-btn:hover{background:linear-gradient(135deg,#5cb0ff,#2f86dd);
  box-shadow:0 6px 20px rgba(51,144,236,.6),0 0 28px rgba(51,144,236,.55)}
.send-btn:active{transform:scale(.9)}
.send-btn:disabled{opacity:.45;cursor:default;box-shadow:none;transform:none}
.send-btn svg{width:24px;height:24px;margin-right:3px}
/* 发送中：图标换成旋转圈 */
.send-btn.loading svg{display:none}
.send-btn.loading::after{content:"";width:20px;height:20px;border-radius:50%;
  border:2.5px solid rgba(255,255,255,.45);border-top-color:#fff;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:768px){
  .side{width:100%;border-right:none}
  .main{position:absolute;inset:0;z-index:10;width:100%;transform:translateX(100%);
    transition:transform .36s var(--ease);will-change:transform}
  .app.chat-open .main{transform:translateX(0)}
  .back-btn{display:grid}
  .msg{max-width:84%}
  .messages{padding:14px 12px 18px}
  .messages > *{max-width:100%}
  .composer{padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px))}
  .scroll-fab{right:12px;bottom:80px}
  .input-wrap textarea,.msg{font-size:15.5px}
}
@media(max-width:380px){
  .composer .icon-btn:last-of-type{display:none}
  .send-btn{width:44px;height:44px}
}
@media(min-width:1100px){
  .side{width:380px}
}
/* ============================================================
   底部主导航（聊天 / 动态 / 我的）+ 动态流 + 个人页 + 消息互动
   ============================================================ */
:root{--tabh:62px}
.view{display:none;flex-direction:column;height:calc(100dvh - var(--tabh));
  max-width:1400px;margin:0 auto;position:relative;z-index:1;overflow:hidden}
body.tab-feed .app,body.tab-me .app{display:none}
body.tab-feed .view-feed{display:flex}
body.tab-me .view-me{display:flex}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;
  height:calc(var(--tabh) + env(safe-area-inset-bottom,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--glass-hi);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border-top:1px solid var(--glass-brd);
  box-shadow:var(--glass-in),0 -6px 24px rgba(31,84,150,.10)}
body.dark .tabbar{box-shadow:var(--glass-in),0 -6px 24px rgba(0,0,0,.42)}
.tabbar-inner{max-width:1400px;margin:0 auto;height:var(--tabh);display:flex}
.tab{flex:1;border:none;background:none;font:inherit;cursor:pointer;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--dim);font-size:11.5px;letter-spacing:.2px;
  transition:color .18s var(--ease),transform .14s var(--ease)}
.tab svg{width:24px;height:24px;transition:transform .2s var(--ease)}
.tab:active{transform:scale(.93)}
.tab:hover{background:var(--hover)}
.tab.on{color:var(--blue);font-weight:600}
.tab.on svg{transform:translateY(-1px);filter:drop-shadow(0 0 8px rgba(51,144,236,.6))}
.tab.on::before{content:"";position:absolute;top:0;width:36px;height:3px;border-radius:0 0 3px 3px;
  background:var(--blue);box-shadow:0 0 12px var(--blue);animation:tabIn .34s var(--ease-spring)}
@keyframes tabIn{from{width:0;opacity:0}to{width:36px;opacity:1}}
.tab .tb-dot{position:absolute;top:7px;left:calc(50% + 7px);min-width:17px;height:17px;padding:0 4px;
  border-radius:9px;background:linear-gradient(135deg,#4aa3ff,#2b7cd3);color:#fff;
  font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums;display:none;place-items:center;
  box-shadow:0 0 9px rgba(51,144,236,.75)}
.tab .tb-dot.show{display:grid}
.tab .tb-dot.dot{min-width:9px;width:9px;height:9px;padding:0;left:calc(50% + 9px)}

/* ---------- 动态 ---------- */
.vf-head{flex:none;display:flex;align-items:center;gap:10px;padding:14px 16px 12px;
  border-bottom:1px solid var(--line)}
.vf-title{flex:1;font-size:20px;font-weight:700}
.vf-body{flex:1;overflow-y:auto;padding:14px 14px 26px;display:flex;flex-direction:column;gap:14px}
.vf-body::-webkit-scrollbar{width:7px}
.vf-body::-webkit-scrollbar-thumb{background:rgba(128,128,128,.3);border-radius:4px}
.card{background:var(--bub-you);border:1px solid var(--bub-you-brd);border-radius:16px;
  box-shadow:var(--sh-bub);padding:12px}
.compose-card{display:flex;gap:10px;align-items:flex-start}
.avatar.sm{width:40px;height:40px;font-size:16px}
.avatar.me{background:linear-gradient(135deg,#4aa3ff,#7c5cff)}
.avatar.big{width:88px;height:88px;font-size:32px}
.cc-main{flex:1;min-width:0}
#feedInput{width:100%;border:none;outline:none;background:none;font:inherit;color:var(--txt);
  resize:none;min-height:42px;line-height:1.45;padding:9px 2px;overflow:hidden}
#feedInput::placeholder{color:var(--dim)}
.cc-bar{display:flex;align-items:center;gap:8px;margin-top:6px}
.cc-tools{display:flex;gap:5px;flex:1;flex-wrap:wrap}
.chip{width:34px;height:34px;border-radius:50%;border:1px solid var(--glass-brd);background:var(--glass);
  font-size:17px;line-height:1;cursor:pointer;display:grid;place-items:center;
  transition:transform .14s var(--ease),background .14s}
.chip:active{transform:scale(.86)}
.chip:hover{background:var(--hover)}
.btn-primary{border:none;border-radius:12px;padding:9px 18px;font:inherit;font-weight:600;font-size:14px;
  color:#fff;cursor:pointer;background:linear-gradient(135deg,#4aa3ff,#2b7cd3);
  box-shadow:0 4px 16px rgba(51,144,236,.45);
  transition:transform .16s var(--ease),opacity .16s,box-shadow .16s}
.btn-primary:active{transform:scale(.94)}
.btn-primary:hover{box-shadow:0 6px 20px rgba(51,144,236,.6)}
.post{display:flex;flex-direction:column;gap:10px}
.post.fresh{animation:postIn .46s var(--ease-spring)}
@keyframes postIn{from{opacity:0;transform:translateY(-10px) scale(.98)}to{opacity:1;transform:none}}
.post-head{display:flex;align-items:center;gap:10px}
.ph-info{flex:1;min-width:0}
.ph-name{font-weight:600;font-size:15px}
.ph-time{font-size:12px;color:var(--dim);margin-top:1px}
.follow-btn{border:1px solid var(--blue);color:var(--blue);background:none;border-radius:20px;
  padding:5px 13px;font:inherit;font-size:13px;cursor:pointer;flex:none;
  transition:background .16s,color .16s,transform .14s var(--ease)}
.follow-btn:active{transform:scale(.93)}
.follow-btn.on{background:var(--blue-l);border-color:transparent}
.post-text{font-size:15px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;cursor:pointer}
.post-media{height:150px;border-radius:14px;display:grid;place-items:center;font-size:42px;
  user-select:none;box-shadow:var(--glass-in);position:relative;overflow:hidden;cursor:pointer;
  transition:transform .2s var(--ease)}
.post-media:active{transform:scale(.985)}
.post-acts{display:flex;align-items:center;gap:6px;padding-top:6px;border-top:1px solid var(--line)}
.act{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:none;background:none;
  font:inherit;font-size:13.5px;color:var(--dim);cursor:pointer;padding:9px 4px;border-radius:10px;
  transition:background .15s,color .15s,transform .14s var(--ease)}
.act:active{transform:scale(.93)}
.act:hover{background:var(--hover)}
.act svg{width:19px;height:19px}
.act.liked{color:#e0524a}
.act.liked svg{fill:#e0524a;stroke:#e0524a;animation:heartPop .52s var(--ease-spring)}
@keyframes heartPop{0%{transform:scale(.6)}45%{transform:scale(1.35)}70%{transform:scale(.92)}100%{transform:scale(1)}}
.post-cmts{margin-top:2px;padding-top:9px;border-top:1px dashed var(--line);
  display:flex;flex-direction:column;gap:8px;animation:cmtIn .25s var(--ease)}
@keyframes cmtIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.cmt{font-size:13.5px;line-height:1.45;animation:cmtIn .22s var(--ease)}
.cmt b{color:var(--blue);font-weight:600;margin-right:5px}
.cmt-input{display:flex;gap:8px;align-items:center;margin-top:2px}
.cmt-input input{flex:1;min-width:0;border:1px solid var(--glass-brd);background:var(--glass);
  border-radius:20px;padding:8px 14px;font:inherit;font-size:14px;color:var(--txt);outline:none;
  transition:box-shadow .18s}
.cmt-input input::placeholder{color:var(--dim)}
.cmt-input input:focus{box-shadow:inset 0 0 0 1.5px var(--blue)}
.cmt-send{border:none;background:var(--blue);color:#fff;border-radius:50%;width:34px;height:34px;
  display:grid;place-items:center;cursor:pointer;flex:none;transition:transform .14s var(--ease)}
.cmt-send:active{transform:scale(.88)}
.cmt-send svg{width:17px;height:17px}
.burst{position:absolute;left:50%;top:50%;font-size:58px;pointer-events:none;z-index:5;
  animation:burst .82s var(--ease-spring) forwards}
@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
  25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
  70%{opacity:1;transform:translate(-50%,-58%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-95%) scale(1.05)}}

/* ---------- 我的 ---------- */
.vm-scroll{flex:1;overflow-y:auto;padding:18px 14px 26px;display:flex;flex-direction:column;gap:14px}
.vm-scroll::-webkit-scrollbar{width:7px}
.vm-scroll::-webkit-scrollbar-thumb{background:rgba(128,128,128,.3);border-radius:4px}
.vm-hero{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 16px;
  background:var(--bub-you);border:1px solid var(--bub-you-brd);border-radius:18px;box-shadow:var(--sh-bub)}
.vm-name{font-size:19px;font-weight:700;display:flex;align-items:center;gap:7px}
.vm-tag{font-size:11px;font-weight:600;color:#4fae4e;background:rgba(79,174,78,.14);
  border-radius:9px;padding:2px 8px}
.vm-user{font-size:13px;color:var(--dim)}
.vm-sign{font-size:14px;text-align:center;padding:7px 12px;border-radius:10px;outline:none;cursor:text;
  max-width:100%;transition:background .15s,box-shadow .15s}
.vm-sign:hover{background:var(--hover)}
.vm-sign[contenteditable="true"]{background:var(--glass);box-shadow:inset 0 0 0 1.5px var(--blue);cursor:text}
.vm-stats{display:flex;gap:10px}
.stat{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 6px;
  background:var(--bub-you);border:1px solid var(--bub-you-brd);border-radius:16px;box-shadow:var(--sh-bub);
  cursor:pointer;transition:transform .16s var(--ease),box-shadow .16s}
.stat:active{transform:scale(.95)}
.stat b{font-size:19px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--dim)}
.vm-list{padding:2px 0;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;
  border-bottom:1px solid var(--line);transition:background .15s}
.row:last-child{border-bottom:none}
.row:hover{background:var(--hover)}
.row:active{background:var(--hover)}
.r-ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;
  background:var(--blue-l);color:var(--blue);font-size:17px}
.r-ico svg{width:19px;height:19px}
.r-txt{flex:1;min-width:0}
.r-txt b{display:block;font-size:14.5px;font-weight:600}
.r-txt span{font-size:12.5px;color:var(--dim)}
.r-arrow{color:var(--dim);flex:none;font-size:19px;line-height:1}
.sw{width:46px;height:27px;border-radius:14px;background:rgba(128,128,128,.35);position:relative;flex:none;
  cursor:pointer;transition:background .2s var(--ease)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;
  background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .2s var(--ease)}
.sw.on{background:linear-gradient(135deg,#4aa3ff,#2b7cd3);box-shadow:0 0 12px rgba(51,144,236,.5)}
.sw.on::after{transform:translateX(19px)}

/* ---------- 动态：真实照片媒体 ---------- */
.post-media.img{height:auto;display:block;padding:0;overflow:hidden;background:none}
.post-media.img img{width:100%;display:block;object-fit:cover;max-height:460px;border-radius:14px}
.post-media.img:active{transform:scale(.99)}

/* ---------- 我的 · Telegram 设置风 ---------- */
.tg-group{display:flex;flex-direction:column;gap:6px}
.tg-sec{font-size:12px;font-weight:700;letter-spacing:.6px;color:var(--dim);
  text-transform:uppercase;padding:2px 8px 0}
.tg-card{background:var(--bub-you);border:1px solid var(--bub-you-brd);border-radius:16px;
  overflow:hidden;box-shadow:var(--sh-bub)}
.tg-row{display:flex;align-items:center;gap:13px;padding:12px 14px;cursor:pointer;
  border-bottom:1px solid var(--line);transition:background .15s}
.tg-row:last-child{border-bottom:none}
.tg-row:hover,.tg-row:active{background:var(--hover)}
.tg-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;
  font-size:16px;color:#fff;box-shadow:var(--glass-in)}
.tg-body{flex:1;min-width:0}
.tg-body b{display:block;font-size:14.5px;font-weight:600}
.tg-body span{font-size:12.5px;color:var(--dim)}
.tg-val{font-size:13px;color:var(--dim);flex:none}
.tg-arrow{color:var(--dim);flex:none;font-size:18px;line-height:1;opacity:.7}
/* ---------- 我的 · 底部弹层（选择/输入/确认/信息） ---------- */
.me-mask{position:fixed;inset:0;background:rgba(0,0,0,.34);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.me-mask.show{opacity:1;pointer-events:auto}
.me-sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%) translateY(110%);width:100%;max-width:520px;z-index:81;box-sizing:border-box;background:var(--glass-hi);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--glass-brd);border-bottom:none;border-radius:20px 20px 0 0;padding:10px 12px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -12px 40px rgba(0,0,0,.28);transition:transform .4s var(--ease-spring);max-height:78vh;overflow-y:auto}
.me-sheet.show{transform:translateX(-50%) translateY(0)}
.me-handle{width:38px;height:4px;border-radius:3px;background:var(--dim);opacity:.4;margin:4px auto 10px}
.me-title{font-size:15px;font-weight:700;padding:2px 8px 10px;color:var(--txt)}
.me-sub{font-size:12.5px;color:var(--dim);padding:0 8px 10px;line-height:1.55}
.me-item{display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:12px;cursor:pointer;font-size:14.5px;transition:background .14s}
.me-item:hover,.me-item:active{background:var(--hover)}
.me-item .mi-txt{flex:1;min-width:0;text-align:left}
.me-item .mi-ck{color:var(--blue);font-weight:800;opacity:0;flex:none}
.me-item.on .mi-ck{opacity:1}
.me-item.on .mi-txt{color:var(--blue);font-weight:600}
.me-item.danger .mi-txt{color:#e5484d}
.me-input{width:calc(100% - 16px);box-sizing:border-box;padding:12px 14px;border-radius:12px;border:1px solid var(--glass-brd);background:var(--glass);color:var(--txt);font-size:15px;outline:none;margin:2px 8px}
.me-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(51,144,236,.18)}
.me-btns{display:flex;gap:10px;margin-top:10px}
.me-btn{flex:1;padding:12px;border-radius:12px;border:none;font-size:14.5px;font-weight:600;cursor:pointer;background:var(--glass);color:var(--txt);transition:transform .12s}
.me-btn:active{transform:scale(.97)}
.me-btn.primary{background:var(--blue);color:#fff;box-shadow:var(--glow-blue)}
.me-btn.danger{background:#e5484d;color:#fff}
/* ---------- 动态：Twitter / X 风 ---------- */
.x-head{padding:10px 14px 8px;gap:12px}
.x-head .vf-title{font-size:19px;text-align:left}
.x-tabs{flex:none;display:flex;border-bottom:1px solid var(--line)}
.x-tab{flex:1;text-align:center;padding:12px 6px;font-size:14px;font-weight:600;color:var(--dim);cursor:pointer;position:relative;transition:background .14s,color .14s}
.x-tab:hover{background:var(--hover)}
.x-tab.on{color:var(--txt)}
.x-tab.on::after{content:"";position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);width:54px;height:3px;border-radius:3px;background:var(--blue)}
.x-trends{padding:12px 14px}
.x-trends .xt-h{font-size:13px;font-weight:700;color:var(--dim);margin-bottom:8px}
.x-trend{display:flex;flex-direction:column;gap:1px;padding:7px 8px;border-radius:10px;cursor:pointer;transition:background .14s}
.x-trend:hover{background:var(--hover)}
.x-trend b{font-size:14.5px}
.x-trend span{font-size:12px;color:var(--dim)}
.x-post{flex-direction:row;align-items:flex-start;gap:11px;padding:14px 14px}
.x-post .avatar.sm{flex:none}
.x-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.x-head2{display:flex;align-items:center;gap:6px}
.x-name{display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-width:0;flex:1}
.x-name b{font-weight:700;font-size:14.5px}
.x-ver{width:15px;height:15px;border-radius:50%;background:var(--blue);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;flex:none;line-height:1}
.x-handle,.x-time,.x-dot{color:var(--dim);font-size:13px}
.x-more{margin-left:2px;border:none;background:none;color:var(--dim);font-size:16px;line-height:1;cursor:pointer;padding:2px 7px;border-radius:8px;flex:none}
.x-more:hover{background:var(--hover)}
.x-post .follow-btn{padding:4px 11px;font-size:12.5px}
.x-post .post-text{font-size:15px}
.x-post .post-media{height:190px;border-radius:16px;border:1px solid var(--glass-brd)}
.x-acts{display:flex;align-items:center;justify-content:space-between;gap:2px;margin-top:2px}
.x-act{display:flex;align-items:center;gap:5px;border:none;background:none;color:var(--dim);font:inherit;font-size:12.5px;cursor:pointer;padding:5px 8px;border-radius:20px;transition:background .15s,color .15s,transform .14s}
.x-act:hover{background:var(--hover)}
.x-act:active{transform:scale(.92)}
.x-act svg{width:17px;height:17px;flex:none}
.x-act.liked{color:#e0524a}
.x-act.liked svg{fill:#e0524a;stroke:#e0524a;animation:heartPop .52s var(--ease-spring)}
.x-act.reposted{color:#00ba7c}
.x-act.reposted svg{stroke:#00ba7c}
.x-empty{text-align:center;color:var(--dim);font-size:14px;padding:40px 10px}

/* ---------- 钱包（USDT） ---------- */
.wallet{position:relative;isolation:isolate;border-radius:18px;padding:16px 16px 14px;color:#fff;
  overflow:hidden;max-width:100%;
  background:linear-gradient(150deg,#2bb389 0%,#199e77 42%,#0b7a55 100%);
  box-shadow:0 12px 34px rgba(15,122,85,.34),inset 0 1px 0 rgba(255,255,255,.28)}
/* 高光 / 光斑层：与页面液态玻璃质感统一 */
.wallet::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:
    radial-gradient(180px 120px at 92% -18%,rgba(255,255,255,.34),transparent 68%),
    radial-gradient(200px 150px at -14% 116%,rgba(255,255,255,.16),transparent 70%),
    linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0) 42%)}
/* 右上角链网络指示：小圆点 + 文本 */
.w-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;row-gap:6px;
  font-size:12.5px;font-weight:600;letter-spacing:.3px;opacity:.95;
  font-variant-numeric:tabular-nums}
.w-brand{display:flex;align-items:center;gap:7px;min-width:0;flex:1 1 auto}
.w-brand span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-brand i{width:20px;height:20px;flex:none;border-radius:50%;display:grid;place-items:center;
  font-style:normal;font-size:11px;font-weight:800;color:#0b7a55;
  background:linear-gradient(180deg,#fff,#d8f3e8);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.w-net{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;
  letter-spacing:.4px;background:rgba(255,255,255,.20);
  border:1px solid rgba(255,255,255,.26);padding:3px 9px;border-radius:20px;white-space:nowrap}
.w-net::before{content:"";width:6px;height:6px;border-radius:50%;background:#b9f5df;
  box-shadow:0 0 7px rgba(185,245,223,.9)}
/* 余额区：金额 + 单位基线对齐，等宽数字防跳动 */
.w-bal-wrap{margin-top:14px;min-width:0}
.w-cap{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;opacity:.78}
.w-bal{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;row-gap:3px;margin-top:5px;
  min-width:0;font-variant-numeric:tabular-nums;line-height:1.05}
.w-bal b{font-size:clamp(23px,7.4vw,32px);font-weight:800;letter-spacing:.5px;min-width:0;overflow-wrap:anywhere}
.w-bal small{font-size:13px;font-weight:700;opacity:.9;letter-spacing:.6px}
.w-cny{font-size:12.5px;opacity:.9;margin-top:7px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
/* 地址行：可点击复制，等宽字体与右侧图标对齐 */
.w-addr{display:flex;align-items:center;gap:6px;margin-top:10px;padding:7px 10px;
  background:rgba(0,0,0,.16);border:1px solid rgba(255,255,255,.16);border-radius:11px;
  font-size:11.5px;font-variant-numeric:tabular-nums;cursor:pointer;
  transition:background .15s}
.w-addr:hover{background:rgba(0,0,0,.24)}
.w-addr svg{width:13px;height:13px;flex:none;opacity:.85}
.w-addr span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.2px}
/* 操作区：2×2 网格，窄屏自动不挤压 */
.w-acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:14px}
.w-btn{display:flex;align-items:center;justify-content:center;gap:6px;min-width:0;
  border:1px solid rgba(255,255,255,.34);background:rgba(255,255,255,.15);color:#fff;
  font:inherit;font-weight:600;font-size:13.5px;padding:10px 8px;border-radius:12px;
  cursor:pointer;white-space:nowrap;backdrop-filter:blur(6px);
  transition:transform .13s var(--ease),background .15s,border-color .15s}
.w-btn svg{width:15px;height:15px;flex:none}
.w-btn:hover{background:rgba(255,255,255,.26);border-color:rgba(255,255,255,.5)}
.w-btn:active{transform:scale(.96)}
/* 主操作（充值）加强对比 */
.w-btn.primary{background:#fff;color:#0b7a55;border-color:#fff}
.w-btn.primary:hover{background:#f0fbf6}
/* 交易记录列表：贴在钱包卡内部，与主卡视觉咬合 */
.w-tx{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.2)}
.w-tx-head{display:flex;align-items:center;justify-content:space-between;
  font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;opacity:.82}
.w-tx-head button{border:none;background:none;color:#fff;font:inherit;font-size:11.5px;
  font-weight:700;letter-spacing:.2px;opacity:.95;cursor:pointer;padding:2px 0;text-transform:none}
.w-tx-head button:hover{text-decoration:underline}
.w-tx-list{margin-top:8px;display:flex;flex-direction:column}
.w-tx-item{display:flex;align-items:center;gap:10px;padding:8px 0;
  border-bottom:1px solid rgba(255,255,255,.12)}
.w-tx-item:last-child{border-bottom:none;padding-bottom:2px}
.w-tx-ico{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;
  font-size:14px;background:rgba(255,255,255,.18)}
.w-tx-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.w-tx-body b{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-tx-body span{font-size:11px;opacity:.72;font-variant-numeric:tabular-nums}
.w-tx-amt{flex:none;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
.w-tx-amt.in{color:#d7ffe9}
@media(max-width:360px){
  .w-bal b{font-size:24px}
  .w-top{font-size:12px}
  .w-acts{gap:7px}
  .w-btn{font-size:12.5px;padding:9px 5px}
}

/* ---------- 弹层输入增强 ---------- */
.me-hint{font-size:12px;color:var(--dim);margin:8px 12px 0;line-height:1.45}
.me-cnt{text-align:right;font-size:12px;color:var(--dim);margin:6px 12px 0;font-variant-numeric:tabular-nums}

/* ============ 小程序中心（Mini Program Center） ============ */
.mp-entry{display:flex;flex-direction:column;gap:11px;padding:14px;
  background:var(--bub-you);border:1px solid var(--bub-you-brd);border-radius:16px;
  box-shadow:var(--sh-bub);cursor:pointer;
  transition:transform .16s var(--ease),box-shadow .16s}
.mp-entry:hover{transform:translateY(-1px)}
.mp-entry:active{transform:scale(.985)}
.mp-entry-head{display:flex;align-items:center;gap:9px}
.mp-entry-head .me-arrow{margin-left:auto;color:var(--dim);font-size:19px;line-height:1;opacity:.7}
.mp-entry-title{font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.mp-entry-badge{font-size:10px;font-weight:700;letter-spacing:.3px;padding:2px 7px;border-radius:8px;
  background:var(--blue-l);color:var(--blue);flex:none}
.mp-entry-sub{font-size:12.5px;color:var(--dim);margin-left:1px}
.mp-entry-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mp-entry-mini{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.mp-entry-mini i{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
  font-style:normal;font-size:21px;color:#fff;
  box-shadow:0 6px 16px rgba(31,84,150,.24),var(--glass-in);
  transition:transform .16s var(--ease)}
.mp-entry:active .mp-entry-mini i{transform:scale(.94)}
.mp-entry-mini span{font-size:11px;color:var(--dim);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:100%}

.mp-mask{position:fixed;inset:0;background:rgba(0,0,0,.34);z-index:72;
  opacity:0;pointer-events:none;transition:opacity .24s}
.mp-mask.show{opacity:1;pointer-events:auto}
.mp-sheet{position:fixed;inset:0;z-index:73;display:flex;flex-direction:column;
  background:var(--glass-hi);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  transform:translateY(100%);transition:transform .32s cubic-bezier(.22,1,.36,1);
  padding-top:env(safe-area-inset-top,0px)}
.mp-sheet.show{transform:translateY(0)}
.mp-head{flex:none;display:flex;align-items:center;gap:10px;padding:10px 12px;
  border-bottom:1px solid var(--line);box-shadow:var(--glass-in);position:relative;isolation:isolate}
.mp-back{width:40px;height:40px;border-radius:50%;border:none;background:none;display:grid;
  place-items:center;cursor:pointer;color:var(--txt);flex:none;transition:background .15s}
.mp-back:hover{background:var(--hover)}
.mp-back svg{width:23px;height:23px}
.mp-head-title{flex:1;font-size:18px;font-weight:700}
.mp-search-btn{width:40px;height:40px;border-radius:50%;border:none;background:none;display:grid;
  place-items:center;cursor:pointer;color:var(--dim);flex:none;transition:background .15s}
.mp-search-btn:hover{background:var(--hover)}
.mp-search-btn svg{width:21px;height:21px}
.mp-body{flex:1;overflow-y:auto;padding:14px 14px calc(26px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:16px}
.mp-body::-webkit-scrollbar{width:7px}
.mp-body::-webkit-scrollbar-thumb{background:rgba(128,128,128,.3);border-radius:4px}

.mp-banner{position:relative;isolation:isolate;overflow:hidden;border-radius:18px;
  padding:16px 16px 14px;color:#fff;
  background:linear-gradient(135deg,#4aa3ff 0%,#7c5cff 58%,#e17076 118%);
  box-shadow:0 12px 30px rgba(60,110,220,.32),var(--glass-in)}
.mp-banner h3{font-size:17px;font-weight:800;letter-spacing:.2px}
.mp-banner p{font-size:12.5px;opacity:.92;margin-top:5px;line-height:1.5}
.mp-banner .mp-bn-row{display:flex;gap:8px;margin-top:12px}
.mp-banner .mp-bn-row i{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
  font-style:normal;font-size:17px;background:rgba(255,255,255,.22);
  border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(4px)}

.mp-sec{font-size:12px;font-weight:700;letter-spacing:.6px;color:var(--dim);
  text-transform:uppercase;padding:0 4px}
.mp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mp-card{display:flex;flex-direction:column;gap:9px;padding:13px;cursor:pointer;
  background:var(--bub-you);border:1px solid var(--bub-you-brd);border-radius:18px;
  box-shadow:var(--sh-bub);transition:transform .16s var(--ease),box-shadow .16s}
.mp-card:hover{transform:translateY(-2px)}
.mp-card.pop{animation:mpPop .44s var(--ease-spring)}
@keyframes mpPop{0%{transform:scale(1)}45%{transform:scale(.94)}100%{transform:scale(1)}}
.mp-card-top{display:flex;align-items:center;gap:10px;min-width:0}
.mp-ico{width:52px;height:52px;border-radius:16px;flex:none;display:grid;place-items:center;
  font-size:24px;color:#fff;position:relative;isolation:isolate;
  box-shadow:0 8px 20px rgba(31,84,150,.28),var(--glass-in)}
.mp-ico::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(60px 40px at 80% -20%,rgba(255,255,255,.45),transparent 70%)}
.mp-card-name{font-size:14.5px;font-weight:700;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-card-desc{font-size:12px;color:var(--dim);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.mp-tag{position:absolute;top:-4px;right:-4px;font-size:9.5px;font-weight:800;letter-spacing:.2px;
  padding:2px 6px;border-radius:8px;background:var(--blue);color:#fff;
  box-shadow:0 3px 9px rgba(51,144,236,.5);z-index:2}

.mp-hint{text-align:center;font-size:12px;color:var(--dim);padding:6px 0 2px}

.mp-host{position:fixed;inset:0;z-index:74;display:flex;flex-direction:column;
  background:var(--glass-hi);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  transform:translateX(100%);transition:transform .3s cubic-bezier(.22,1,.36,1);
  padding-top:env(safe-area-inset-top,0px)}
.mp-host.show{transform:translateX(0)}
.mp-host-head{flex:none;display:flex;align-items:center;gap:10px;padding:8px 12px;
  border-bottom:1px solid var(--line);box-shadow:var(--glass-in);position:relative;
  isolation:isolate;color:#fff}
.mp-host-head .mp-back{color:#fff}
.mp-host-head .mp-back:hover{background:rgba(255,255,255,.18)}
.mp-host-title{flex:1;min-width:0;font-size:16.5px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-host-more{width:38px;height:38px;border-radius:50%;border:none;background:none;color:#fff;
  display:grid;place-items:center;cursor:pointer;flex:none;font-size:19px;line-height:1}
.mp-host-more:hover{background:rgba(255,255,255,.18)}
.mp-host-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
.mp-host-body::-webkit-scrollbar{width:7px}
.mp-host-body::-webkit-scrollbar-thumb{background:rgba(128,128,128,.3);border-radius:4px}



/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 26px);transform:translate(-50%,16px);
  background:rgba(17,24,39,.94);color:#fff;font-size:13.5px;padding:10px 18px;border-radius:22px;
  z-index:200;opacity:0;pointer-events:none;max-width:82vw;text-align:center;
  box-shadow:0 8px 26px rgba(0,0,0,.35);
  transition:opacity .22s var(--ease),transform .22s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- 消息互动：长按菜单 / 表情回应 / 引用 ---------- */
.msg .react{display:inline-flex;align-items:center;margin-left:6px;font-size:12.5px;
  background:var(--blue-l);border:1px solid var(--blue);border-radius:10px;padding:0 6px;
  position:relative;top:2px;animation:pop .24s var(--ease)}
.msg .quote{border-left:3px solid var(--blue);padding:2px 0 2px 8px;margin:0 0 5px;
  font-size:13px;opacity:.86;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.msg .quote b{color:var(--blue);font-weight:600;margin-right:4px}
.msg.me .quote{border-left-color:rgba(255,255,255,.85)}
.msg.me .quote b{color:#fff}
.msg-menu{position:fixed;z-index:150;display:none;flex-direction:column;gap:6px;
  background:var(--glass-hi);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-brd);border-radius:16px;padding:7px;
  box-shadow:var(--glass-in),0 12px 34px rgba(0,0,0,.28);animation:menuIn .3s var(--ease-spring)}
.msg-menu.show{display:flex}
@keyframes menuIn{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:none}}
.mm-emojis{display:flex;gap:2px}
.mm-emoji{width:36px;height:36px;border-radius:50%;border:none;background:none;font-size:19px;
  cursor:pointer;display:grid;place-items:center;
  transition:transform .14s var(--ease),background .14s}
.mm-emoji:hover{background:var(--hover);transform:scale(1.14)}
.mm-emoji.on{background:var(--blue-l);box-shadow:inset 0 0 0 1.5px var(--blue)}
.mm-acts{display:flex;gap:2px;border-top:1px solid var(--line);padding-top:6px}
.mm-act{display:flex;align-items:center;gap:5px;border:none;background:none;font:inherit;font-size:12.5px;
  color:var(--txt);padding:7px 9px;border-radius:9px;cursor:pointer;white-space:nowrap;
  transition:background .14s}
.mm-act:hover{background:var(--hover)}
.mm-act svg{width:15px;height:15px}
.mm-act.danger{color:#e0524a}
.quote-bar{display:none;align-items:center;gap:9px;padding:7px 14px;background:var(--glass);
  border-top:1px solid var(--line)}
.quote-bar.show{display:flex}
.qb-line{width:3px;height:28px;border-radius:2px;background:var(--blue);flex:none}
.qb-txt{flex:1;min-width:0;font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.qb-txt b{color:var(--blue);font-weight:600;margin-right:5px}
.qb-x{border:none;background:none;color:var(--dim);cursor:pointer;font-size:19px;line-height:1;
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.qb-x:hover{background:var(--hover)}

/* ---------- 收尾补充：动态列表 / 消息可交互 / 移动端适配 ---------- */
#feedList{display:flex;flex-direction:column;gap:14px}
#feedList:empty{display:none}
.msg{cursor:pointer;-webkit-tap-highlight-color:transparent}
.msg.me .react{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.5)}
.msg .meta{margin-left:6px}
.composer{position:relative}
@media(max-width:768px){
  .tabbar{box-shadow:var(--glass-in),0 -4px 18px rgba(31,84,150,.12)}
  .vf-body,.vm-scroll{padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
}

/* ============================================================
   液态玻璃（Liquid Glass）主题层
   折射高光 · 边缘色散 · 流动光泽 —— 叠加在原毛玻璃之上
   ============================================================ */
/* 环境光：给玻璃「有东西可透」，静态绘制 + 极慢位移（合成层，不重绘） */
.lg-ambient{position:fixed;inset:-12%;z-index:0;pointer-events:none;
  background:
    radial-gradient(38% 30% at 14% 6%,rgba(92,170,255,.34),transparent 70%),
    radial-gradient(34% 28% at 86% 20%,rgba(178,120,255,.24),transparent 72%),
    radial-gradient(42% 34% at 72% 94%,rgba(78,222,198,.20),transparent 74%),
    radial-gradient(30% 26% at 22% 80%,rgba(255,158,208,.16),transparent 74%);
  filter:blur(26px);opacity:.92;
  animation:lgDrift 26s ease-in-out infinite alternate}
@keyframes lgDrift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(0,-2.2%,0) scale(1.04)}}
body.dark .lg-ambient{opacity:.72;
  background:
    radial-gradient(38% 30% at 14% 6%,rgba(58,130,225,.34),transparent 70%),
    radial-gradient(34% 28% at 86% 20%,rgba(58,130,225,.22),transparent 72%),
    radial-gradient(42% 34% at 72% 94%,rgba(74,150,235,.20),transparent 74%),
    radial-gradient(30% 26% at 22% 80%,rgba(90,169,240,.16),transparent 74%)}

/* ---- 液态面板：统一的折射高光层 ---- */
.side,.chat-head,.tabbar,.composer,.search,.input-wrap,.set-card,.msg-menu,.scroll-fab,
.empty .big,.card,.tg-card,.chip,.vm-hero,.stat,.quote-bar,.new-chat-fab{position:relative;isolation:isolate}
.side::before,.chat-head::before,.tabbar::before,.composer::before,.search::before,
.input-wrap::before,.set-card::before,.msg-menu::before,.scroll-fab::before,.empty .big::before,
.card::before,.tg-card::before,.chip::before,.vm-hero::before,.stat::before,
.quote-bar::before,.new-chat-fab::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background-image:var(--lg-refract),var(--lg-sheen);
  background-size:100% 100%,260% 100%;background-position:0 0,118% 0;background-repeat:no-repeat;
  mix-blend-mode:var(--lg-blend);opacity:var(--lg-gloss)}

/* 顶边折射亮线（玻璃的「棱」） */
.chat-head::after,.msg-menu::after,.set-card::after,.composer::after{
  content:"";position:absolute;left:12%;right:12%;top:0;height:1px;pointer-events:none;z-index:-1;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);opacity:.8}
body.dark .chat-head::after,body.dark .msg-menu::after,body.dark .set-card::after,body.dark .composer::after{
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);opacity:.6}

/* 底栏流动光泽（仅 transform，走合成层，不触发重绘/重排） */
.tabbar::after{content:"";position:absolute;top:0;bottom:0;left:0;width:55%;pointer-events:none;z-index:-1;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.5) 50%,transparent);
  transform:translateX(-170%);animation:lgSweep 8.5s cubic-bezier(.4,0,.2,1) infinite}
body.dark .tabbar::after{background:linear-gradient(100deg,transparent,rgba(255,255,255,.26) 50%,transparent)}
@keyframes lgSweep{0%,56%{transform:translateX(-170%)}88%,100%{transform:translateX(340%)}}

/* ---- 面板表面：更「湿」的液态玻璃 ---- */
.search,.input-wrap{background:var(--glass);border-color:var(--glass-brd);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur)}
.composer{background:var(--glass-lo);border-top-color:var(--glass-brd);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  box-shadow:var(--glass-in),var(--sh-composer)}
.card,.tg-card,.vm-hero,.stat{background:var(--glass-hi);border:1px solid var(--glass-brd);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  box-shadow:var(--glass-in),var(--sh-bub)}
.msg{isolation:isolate}
.msg::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 58%);
  mix-blend-mode:var(--lg-blend);opacity:var(--lg-gloss)}
.msg.me::after{background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 62%)}
.msg.you{background:var(--glass-hi);border-color:var(--glass-brd);
  backdrop-filter:blur(14px) saturate(1.5);-webkit-backdrop-filter:blur(14px) saturate(1.5)}

/* ---- Telegram 风：导航选中胶囊（取代原顶部小横条） ---- */
.tab.on::before{content:"";position:absolute;top:6px;width:58px;height:30px;border-radius:16px;
  background:var(--blue-l);box-shadow:0 0 18px rgba(51,144,236,.4);animation:tabPill .36s var(--ease-spring)}
@keyframes tabPill{from{width:20px;opacity:0}to{width:58px;opacity:1}}

/* ---- Telegram 风：聊天列表右下「新建对话」浮动按钮 ---- */
.new-chat-fab{position:absolute;right:16px;bottom:16px;z-index:5;width:54px;height:54px;border-radius:50%;
  border:1px solid var(--glass-brd);cursor:pointer;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,rgba(74,163,255,.96),rgba(43,124,211,.96));
  box-shadow:0 8px 24px rgba(51,144,236,.5),0 0 22px rgba(51,144,236,.4),var(--glass-in);
  transition:transform .18s var(--ease),box-shadow .18s var(--ease)}
.new-chat-fab svg{width:24px;height:24px}
.new-chat-fab:hover{transform:scale(1.06);
  box-shadow:0 10px 28px rgba(51,144,236,.62),0 0 30px rgba(51,144,236,.5),var(--glass-in)}
.new-chat-fab:active{transform:scale(.92)}
@media(max-width:768px){.new-chat-fab{bottom:18px;right:14px}}

/* 无障碍：尊重系统“减少动态效果” */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ====== 小程序样式（注入） ====== */
/* ---------- 小程序内容：通用 ---------- */
.mp-seg{display:flex;gap:6px;background:var(--hover);border-radius:12px;padding:4px;margin:0 0 2px}
.mp-seg button{flex:1;border:none;background:none;padding:8px 0;border-radius:9px;font-size:13px;font-weight:600;color:var(--dim);cursor:pointer;font-family:inherit;transition:background .15s,color .15s}
.mp-seg button.on{background:var(--glass-hi);color:var(--txt);box-shadow:var(--glass-in)}
.mp-list{display:flex;flex-direction:column;gap:9px}
.mp-row{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:16px;
  background:var(--bub-you);border:1px solid var(--bub-you-brd);box-shadow:var(--sh-bub);cursor:pointer;
  transition:transform .15s var(--ease)}
.mp-row:hover{transform:translateY(-1px)}
.mp-row:active{transform:scale(.988)}
.mp-row .mp-ico{width:44px;height:44px;border-radius:13px;font-size:20px}
.mp-row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.mp-row-t{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-row-s{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-row-r{flex:none;font-size:12.5px;color:var(--dim);text-align:right;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.mp-row-r b{font-variant-numeric:tabular-nums;color:var(--txt)}
.mp-badge{display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;
  font-size:11px;font-weight:700;color:#fff;background:#ff3b30;border-radius:9px;padding:0 5px}
.mp-input{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:14px;font-size:15px;
  border:1px solid var(--bub-you-brd);background:var(--bub-you);color:var(--txt);font-family:inherit;outline:none}
.mp-input:focus{border-color:var(--blue)}

/* ---------- 炒股 ---------- */
.up{color:#e5484d}.dn{color:#16a34a}
.st-idx{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.st-idx-item{padding:11px 10px;border-radius:14px;background:var(--bub-you);border:1px solid var(--bub-you-brd);
  box-shadow:var(--sh-bub);display:flex;flex-direction:column;gap:4px;min-width:0}
.st-idx-item b{font-size:15px;font-variant-numeric:tabular-nums}
.st-idx-item small{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-idx-item span{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.st-hero{padding:16px;border-radius:18px;color:#fff;background:linear-gradient(135deg,#ff5e62,#c81e3c);
  box-shadow:0 12px 30px rgba(200,30,60,.3),var(--glass-in);position:relative;isolation:isolate;overflow:hidden}
.st-hero .st-name{font-size:15px;font-weight:700;opacity:.95}
.st-hero .st-code{font-size:11.5px;opacity:.8;margin-top:2px}
.st-hero .st-price{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:8px}
.st-hero .st-chg{font-size:14px;font-weight:700;margin-top:3px;display:flex;gap:12px;opacity:.97}
.st-kline{margin-top:12px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
  border-radius:14px;padding:8px 6px}
.st-kline svg{display:block;width:100%;height:116px}
.st-grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.st-cell{padding:11px 12px;border-radius:14px;background:var(--bub-you);border:1px solid var(--bub-you-brd);
  box-shadow:var(--sh-bub);display:flex;justify-content:space-between;font-size:13px;gap:8px}
.st-cell span{color:var(--dim)}
.st-cell b{font-variant-numeric:tabular-nums}
.st-order{display:flex;flex-direction:column;gap:5px}
.st-ob{display:flex;justify-content:space-between;font-size:12.5px;font-variant-numeric:tabular-nums;padding:3px 4px;border-radius:8px}
.st-ob:nth-child(5){border-top:1px solid var(--line)}
.st-ob b{font-weight:600}
.st-ob i{font-style:normal;color:var(--dim);width:40px;display:inline-block}
.st-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:2px}
.st-btns button{border:none;border-radius:14px;padding:13px 0;font-size:15px;font-weight:700;color:#fff;
  cursor:pointer;font-family:inherit;box-shadow:0 8px 20px rgba(0,0,0,.14),var(--glass-in)}
.st-buy{background:linear-gradient(135deg,#ff5e62,#e5484d)}
.st-sell{background:linear-gradient(135deg,#22c55e,#15803d)}
.st-inline-btn{background:var(--hover);color:var(--dim);border:none;border-radius:20px;padding:8px 15px;
  font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.st-unit{font-style:normal;font-size:11px;opacity:.72;margin-left:4px;font-weight:600}
.st-spark{width:62px;height:26px;flex:none;opacity:.92;margin:0 4px}
.st-spark svg{display:block;width:100%;height:100%}
.st-bars{display:flex;flex-direction:column}
.st-chart-cap{font-size:11.5px;color:var(--dim);font-weight:600;margin-bottom:6px}
.st-bar-svg{background:var(--bub-you);border:1px solid var(--bub-you-brd);border-radius:14px;padding:10px 8px;
  box-shadow:var(--sh-bub)}
.st-bar-svg svg{display:block;width:100%;height:94px}

/* ---------- 公众号 ---------- */
.oa-hero{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;
  background:var(--bub-you);border:1px solid var(--bub-you-brd);box-shadow:var(--sh-bub)}
.oa-hero .mp-ico{width:56px;height:56px;border-radius:16px;font-size:26px}
.oa-hero-main{flex:1;min-width:0}
.oa-hero-main b{font-size:16px}
.oa-hero-main p{font-size:12.5px;color:var(--dim);margin-top:4px;line-height:1.5}
.oa-follow{flex:none;border:none;border-radius:20px;padding:8px 15px;font-size:12.5px;font-weight:700;
  cursor:pointer;font-family:inherit;background:var(--blue);color:#fff;transition:opacity .15s}
.oa-follow.on{background:var(--hover);color:var(--dim)}
.oa-art{display:flex;gap:11px;padding:13px;border-radius:16px;background:var(--bub-you);
  border:1px solid var(--bub-you-brd);box-shadow:var(--sh-bub);cursor:pointer;transition:transform .15s var(--ease)}
.oa-art:hover{transform:translateY(-1px)}
.oa-art:active{transform:scale(.988)}
.oa-art-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.oa-art-t{font-size:14.5px;font-weight:700;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.oa-art-meta{font-size:11.5px;color:var(--dim);margin-top:auto;display:flex;gap:10px;flex-wrap:wrap}
.oa-thumb{width:76px;height:76px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:30px;
  background:linear-gradient(135deg,#4aa3ff,#7c5cff)}
.oa-cover{height:150px;border-radius:18px;display:grid;place-items:center;font-size:54px;color:#fff;
  background:linear-gradient(135deg,#4aa3ff,#7c5cff);box-shadow:var(--sh-bub)}
.oa-title{font-size:20px;font-weight:800;line-height:1.4}
.oa-byline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim)}
.oa-body{font-size:14.5px;line-height:1.85;color:var(--txt)}
.oa-body p{margin:0 0 12px}
.oa-end{text-align:center;font-size:12px;color:var(--dim);padding:8px 0 2px}
.oa-acts{display:flex;gap:9px;justify-content:center;padding:6px 0 2px}
.oa-act{border:1px solid var(--line);background:var(--glass-hi);border-radius:22px;padding:10px 0;flex:1;
  font-size:13px;color:var(--dim);display:flex;align-items:center;justify-content:center;gap:6px;
  cursor:pointer;font-family:inherit;transition:transform .12s var(--ease),color .15s}
.oa-act:active{transform:scale(.95)}
.oa-act.on{color:var(--blue);border-color:var(--blue)}
.oa-act svg{width:17px;height:17px}
.oa-cmt{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.oa-cmt:last-child{border-bottom:none}
.oa-cmt-av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-size:15px}
.oa-cmt-main{flex:1;min-width:0}
.oa-cmt-main b{font-size:12.5px}
.oa-cmt-main p{font-size:13.5px;line-height:1.55;margin-top:3px}
.oa-cmt-main span{font-size:11px;color:var(--dim);display:block;margin-top:4px}
.oa-edit{display:flex;gap:9px;margin-top:10px}
.oa-edit input{flex:1;min-width:0;box-sizing:border-box;padding:11px 14px;border-radius:22px;font-size:13.5px;
  border:1px solid var(--bub-you-brd);background:var(--bub-you);color:var(--txt);font-family:inherit;outline:none}
.oa-edit input:focus{border-color:var(--blue)}
.oa-edit button{flex:none;border:none;border-radius:22px;padding:0 18px;font-size:13.5px;font-weight:700;
  background:var(--blue);color:#fff;cursor:pointer;font-family:inherit}
.oa-day{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;
  background:var(--bub-you);border:1px solid var(--bub-you-brd);box-shadow:var(--sh-bub)}
.oa-day b{width:56px;flex:none;font-size:13.5px}
.oa-day i{font-style:normal;font-size:22px;flex:none}
.oa-day span{flex:1;font-size:12.5px;color:var(--dim);text-align:right}
.oa-tl{display:flex;flex-direction:column;gap:0;padding-left:6px}
.oa-tl-item{position:relative;padding:0 0 16px 20px;border-left:2px solid var(--line)}
.oa-tl-item:last-child{border-left-color:transparent}
.oa-tl-item::before{content:"";position:absolute;left:-6px;top:2px;width:10px;height:10px;border-radius:50%;
  background:var(--blue);box-shadow:0 0 0 3px var(--bub-you)}
.oa-tl-item.done::before{background:#16a34a}
.oa-tl-item b{font-size:13.5px}
.oa-tl-item p{font-size:12px;color:var(--dim);margin-top:3px}

</style>
</head>
<body>
<div class="lg-ambient" aria-hidden="true"></div>
<div class="app" id="app">

  <aside class="side">
    <div class="side-head">
      <button class="menu-btn" id="themeBtn" title="切换主题">

    <div class="chat-list" id="chatList"></div>

            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>

        <button class="icon-btn" title="通话">

        <button class="icon-btn" title="更多">
          <svg viewBox="0 0 24 24" fill="currentColor">

        </button>

    </div>

    <div class="messages" id="messages"></div>

    <button class="scroll-fab" id="scrollFab" title="回到底部" aria-label="回到底部">

</div>

<!-- ============ 动态（Feed）视图 ============ -->
<section class="view view-feed" id="viewFeed">
  <div class="vf-head x-head">
    <div class="avatar sm me" id="xHeadAvatar">我</div>
    <div class="vf-title">首页</div>
    <button class="icon-btn" id="feedRefresh" title="刷新">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
    </button>
  </div>
  <div class="x-tabs" id="xTabs">
    <div class="x-tab on" data-x="for-you">为你推荐</div>
    <div class="x-tab" data-x="following">正在关注</div>
  </div>

<script>
(function(){
  "use strict";

  var COLORS=["#e17076","#7bc862","#e5ca77","#65aadd","#a695e7","#ee7aae","#6ec9cb"];
  function colorOf(n){var s=0;for(var i=0;i<n.length;i++)s+=n.charCodeAt(i);return COLORS[s%COLORS.length];}
  function initial(n){return n.slice(0,1).toUpperCase();}
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

  var FIXED_BG={saved:"#3390ec",dev:"#7c5cff",bot:"#4fae4e",news:"#e8912d"};
  function avatarStyle(c){return FIXED_BG[c.id]||colorOf(c.name);}
  function avatarInner(c){var ch=c.avatar||initial(c.name);return ch==="</>"?ch:esc(ch);}

  var chats=[
    {id:"saved",name:"Saved Messages",avatar:"\uD83D\uDD16",saved:true,status:"只对自己可见",unread:0,
     msgs:[
       {from:"me",text:"\uD83D\uDCCC 这是收藏夹：发进来的东西只有我自己能看到。",t:0,read:true,base:1700000000000},
       {from:"me",text:"相当于 Telegram 的云笔记。",t:0,read:true,base:1700000060000}
     ]},
    {id:"anna",name:"Anna",avatar:"",online:true,status:"在线",unread:2,
     msgs:[
       {from:"you",text:"嘿，晚上有空吗？",base:1700100000000},
