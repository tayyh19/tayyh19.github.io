       {from:"me",text:"好啊，几点？",base:1700100420000,read:true},
       {from:"you",text:"七点半吧，我发你定位",base:1700100480000},
       {from:"you",text:"\uD83D\uDCCD 暖阳咖啡馆 · 距你 1.2km",base:1700100490000}
     ]},
    {id:"dev",name:"前端开发组",avatar:"</>",group:true,status:"6 名成员，3 人在线",unread:5,
     msgs:[
       {from:"you",who:"Kevin",text:"新版首页推到 staging 了",base:1700200000000},
       {from:"you",who:"Lucy",text:"收到，我测一下移动端适配",base:1700200300000},
       {from:"me",text:"辛苦啦，有问题随时说 \uD83D\uDC4D",base:1700200600000,read:true},
       {from:"you",who:"Kevin",text:"暗色模式也加了，效果不错",base:1700200900000}
     ]},
    {id:"bot",name:"DeepSeek Bot",avatar:"\uD83E\uDD16",status:"bot",unread:0,
     msgs:[
       {from:"me",text:"帮我写个快排",base:1700300000000,read:true},
       {from:"you",text:"好的，Python 版：\n\ndef quicksort(a):\n    if len(a)<=1: return a\n    p=a[len(a)//2]\n    l=[x for x in a if x<p]\n    m=[x for x in a if x==p]\n    r=[x for x in a if x>p]\n    return quicksort(l)+m+quicksort(r)",base:1700300060000}
     ]},
    {id:"max",name:"Max",avatar:"",status:"最后上线 2 小时前",unread:0,
     msgs:[
       {from:"you",text:"文件收到了，谢谢！",base:1700400000000},
       {from:"me",text:"不客气~",base:1700400120000,read:true}
     ]},
    {id:"news",name:"RSS 速递",avatar:"\uD83D\uDCF0",status:"频道 · 12.4K 订阅",unread:9,
     msgs:[
       {from:"you",text:"【技术】前端框架 2024 年度调研报告发布，React 仍居首位。",base:1700500000000},
       {from:"you",text:"【AI】多模态大模型迎来新一轮开源潮。",base:1700503600000}
     ]}
  ];

  /* 时间显示 */
  function pad(n){return String(n).padStart(2,"0");}
  function fmtListTime(ts){
    var d=new Date(ts),n=new Date();
    if(d.toDateString()===n.toDateString())return pad(d.getHours())+":"+pad(d.getMinutes());
    return (d.getMonth()+1)+"/"+d.getDate();
  }
  function fmtMsgTime(ts){var d=new Date(ts);return pad(d.getHours())+":"+pad(d.getMinutes());}
  function fmtDay(ts){
    var d=new Date(ts),n=new Date();
    if(d.toDateString()===n.toDateString())return "今天";
    var y=new Date(n.getTime()-86400000);
    if(d.toDateString()===y.toDateString())return "昨天";
    return (d.getMonth()+1)+"月"+d.getDate()+"日";
  }
  function lastMsg(c){return c.msgs[c.msgs.length-1]||null;}

  var app=document.getElementById("app");
  var chatListEl=document.getElementById("chatList");
  var messagesEl=document.getElementById("messages");
  var emptyEl=document.getElementById("empty");
  var chatHeadEl=document.getElementById("chatHead");
  var composerEl=document.getElementById("composer");
  var inputEl=document.getElementById("input");
  var activeId=null;
  var replyTimers={};

  /* ---------- 聊天列表 ---------- */
  function renderList(filter){
    chatListEl.innerHTML="";
    var q=(filter||"").trim().toLowerCase();
    /* 置顶聊天优先，其余保持原顺序（稳定排序） */
    var list=chats.slice().sort(function(a,b){return (b.pin?1:0)-(a.pin?1:0);});
    list.forEach(function(c){
      if(q && c.name.toLowerCase().indexOf(q)<0) return;
      var lm=lastMsg(c);
      var item=document.createElement("div");
      item.className="chat-item"+(c.id===activeId?" active":"")+(c.pin?" pinned":"")+(c.mute?" muted":"");
      var preview="";
      if(lm){
        var prefix="";
        if(lm.from==="me"&&!c.saved) prefix='<span class="check">\u2713\u2713</span>';
        else if(c.saved) prefix='<span class="check">\uD83D\uDD16</span>';
        var text=lm.text.replace(/\n/g," ");
        if(c.group&&lm.who&&lm.from!=="me") text=lm.who+": "+text;
        preview=prefix+esc(text);
      }
      var badge="";
      if(c.unread>0&&!c.mute) badge=c.id==="saved"?'<div class="badge dot"></div>':'<div class="badge">'+c.unread+'</div>';
      var nameHtml=esc(c.name)+(c.mute?'<span class="mute-ico">\uD83D\uDD07</span>':'');
      var timeHtml=(c.pin?'<span class="ci-pin">\uD83D\uDCCC</span>':'')+(lm?fmtListTime(lm.t||lm.base):"");
      item.innerHTML=
        '<div class="avatar" style="background:'+avatarStyle(c)+'">'+avatarInner(c)+
          (c.online?'<span class="online"></span>':'')+'</div>'+
        '<div class="ci-body"><div class="ci-top"><span class="ci-name">'+nameHtml+
          '</span><span class="ci-time">'+timeHtml+'</span></div>'+
        '<div class="ci-bot"><span class="ci-last">'+preview+'</span>'+(badge||"")+'</div></div>';
      bindChatItem(item,c);
      chatListEl.appendChild(item);
    });
  }

  /* 列表项互动：单击打开 / 长按(右键)弹出操作菜单 */
  function bindChatItem(item,c){
    var fired=false;
    item.onclick=function(){if(fired) return;openChat(c.id);};
    item.oncontextmenu=function(ev){
      if(ev&&ev.preventDefault) ev.preventDefault();
      cancelListPress();
      openChatMenu(c,item);
    };
    function fireMenu(){
      fired=true;
      openChatMenu(c,item);
      setTimeout(function(){fired=false;},700);
    }
    item.onmousedown=function(){cancelListPress();listPressTimer=setTimeout(function(){listPressTimer=null;fireMenu();},520);};
    item.onmouseup=cancelListPress;
    item.onmouseleave=cancelListPress;
    item.ontouchstart=function(){cancelListPress();listPressTimer=setTimeout(function(){listPressTimer=null;fireMenu();},520);};
    item.ontouchend=function(){setTimeout(cancelListPress,0);};
    item.ontouchmove=cancelListPress;
  }

  /* ---------- 打开对话 ---------- */
  function openChat(id){
    closeCtxMenu();
    activeId=id;
    var c=chats.find(function(x){return x.id===id;});
    if(!c) return;
    c.unread=0;
    emptyEl.style.display="none";
    chatHeadEl.style.display="flex";
    composerEl.style.display="flex";
    document.getElementById("chAvatar").outerHTML=
      '<div class="avatar" id="chAvatar" style="background:'+avatarStyle(c)+'">'+avatarInner(c)+
      (c.online?'<span class="online"></span>':'')+'</div>';
    document.getElementById("chName").textContent=c.name;
    document.getElementById("chStatus").textContent=c.status||"";
    renderMessages(c);
    renderList(document.getElementById("search").value);
    app.classList.add("chat-open");
    refreshPill();
    setTimeout(function(){inputEl.focus();},100);
  }

  /* 轻量 Markdown：```代码块``` / `行内代码` / **粗体** */
  function fmtText(s){
    var h=esc(s);
    h=h.replace(/```[a-zA-Z0-9+#-]*\n?([\s\S]*?)```/g,function(_,code){
      return "<pre><code>"+code.replace(/\n$/,"")+"</code></pre>";
    });
    h=h.replace(/`([^`\n]+)`/g,"<code>$1</code>");
    h=h.replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>");
    return h;
  }
  function msgHtml(m,c,stack){
    var cls=(m.from==="me"?"me":"you")+(stack?" stack":"");
    var who=(c.group&&m.who&&m.from!=="me"&&!c.saved)?'<div class="who">'+esc(m.who)+'</div>':"";
    var quote=m.quote?'<div class="quote"><b>'+esc(m.quote.who||"消息")+'</b>'+esc(m.quote.text)+'</div>':"";
    var meta;
    if(c.saved) meta="";
    else if(m.from==="me"){
      var tick=m.read?"\u2713\u2713":"\u2713";
      meta='<span class="meta">'+fmtMsgTime(m.t||m.base)+'<span style="font-size:13px">'+tick+'</span></span>';
    } else {
      meta='<span class="meta">'+fmtMsgTime(m.t||m.base)+'</span>';
    }
    return '<div class="msg '+cls+'">'+who+quote+'<span class="txt">'+fmtText(m.text)+'</span>'+meta+
      (m.react?'<span class="react">'+m.react+'</span>':"")+'</div>';
  }

  function renderMessages(c){
    var atBottom=isAtBottom();
    var prevLen=messagesEl.children.length;
    messagesEl.innerHTML="";
    var lastDay=null,prev=null;
    c.msgs.forEach(function(m){
      if(m.sys){                       /* 系统 / 错误提示行 */
        var note=document.createElement("div");
        note.className="sys-note"+(m.err?" err":"");
        note.textContent=m.text;
        messagesEl.appendChild(note);prev=null;return;
      }
      var t=m.t||m.base;
      var day=fmtDay(t);
      if(day!==lastDay){
        var sep=document.createElement("div");
        sep.className="date-sep";sep.textContent=day;
        messagesEl.appendChild(sep);lastDay=day;prev=null;
      }
      /* 同一发送者、同一时间簇内的连续消息 → 合并气泡圆角 */
      var same=(prev&&prev.from===m.from&&(m.from==="me"||(prev.who||"")===(m.who||"")||c.saved));
      var tmp=document.createElement("div");tmp.innerHTML=msgHtml(m,c,same);
      var node=tmp.firstChild;
      if(node){node.__m=m;messagesEl.appendChild(node);}
      prev=m;
    });
    bindMsgs();
    /* 新消息到达时：若用户已在底部或无历史 → 滚到底；否则计数提示 */
    var grew=(c.msgs.length>prevLen||prevLen===0);
    if(atBottom||grew===false) scrollBottom(true);
    else bumpFab(c.msgs.length-prevLen);
  }

  /* ---------- 滚动状态管理 ---------- */
  var fabEl=document.getElementById("scrollFab"),fabBadge=document.getElementById("fabBadge");
  var fabCount=0;
  function isAtBottom(){
    return messagesEl.scrollHeight-messagesEl.scrollTop-messagesEl.clientHeight<48;
  }
  function scrollBottom(force){
    if(force!==true&&!isAtBottom()) return;
    fabCount=0;fabBadge.style.display="none";
    requestAnimationFrame(function(){
      messagesEl.scrollTo({top:messagesEl.scrollHeight,behavior:"smooth"});
    });
  }
  function bumpFab(n){
    if(n<=0) return;
    fabCount+=n;fabBadge.textContent=fabCount>99?"99+":fabCount;
    fabBadge.style.display="grid";
  }
  messagesEl.addEventListener("scroll",function(){
    if(isAtBottom()){fabEl.classList.remove("show");fabCount=0;fabBadge.style.display="none";}
    else fabEl.classList.add("show");
  },{passive:true});
  fabEl.onclick=function(){
    fabCount=0;fabBadge.style.display="none";
    messagesEl.scrollTo({top:messagesEl.scrollHeight,behavior:"smooth"});
  };

  /* ---------- 发送消息 ---------- */
  function now(){return Date.now();}
  function send(){
    var text=inputEl.value.replace(/\s+$/,"");
    if(!text||!activeId) return;
    var c=chats.find(function(x){return x.id===activeId;});
    c.msgs.push({from:"me",text:text,t:now(),read:false});
    inputEl.value="";inputEl.style.height="auto";
    renderMessages(c);renderList(document.getElementById("search").value);
    scrollBottom();
    setTimeout(function(){
      c.msgs[c.msgs.length-1].read=true;
      if(activeId===c.id) renderMessages(c);
      renderList(document.getElementById("search").value);
    },900);
    scheduleReply(c);   /* 每个聊天都接入 AI（收藏夹＝AI 笔记助手） */
  }

  /* ============================================================
     AI 接入层
       · 配置层：⚙ 面板 + localStorage
       · 调度层：scheduleReply → runAIReply（打字指示 → 流式输出）
       · 传输层：callAI（OpenAI 兼容 /chat/completions，流式/超时/重试）
     ============================================================ */
  var CFG_KEY="tgclone.ai.cfg";
  var DEFAULT_CFG={url:"",key:"",model:"",cors:"direct",stream:true,persona:true,timeout:60000,retry:2};
  var CFG={};
  var CTX_ROUNDS=12;                    /* 送入模型的历史消息上限（条） */

  function loadCfg(){
    var c={},k;
    for(k in DEFAULT_CFG) c[k]=DEFAULT_CFG[k];
    try{
      var raw=localStorage.getItem(CFG_KEY);
      if(raw){
        var s=JSON.parse(raw);
        for(k in s) if(s[k]!==undefined&&s[k]!==null) c[k]=s[k];
      }
    }catch(e){}
    CFG=c;return c;
  }
  function saveCfg(){try{localStorage.setItem(CFG_KEY,JSON.stringify(CFG));}catch(e){}}

  /* 支持 Base URL 或完整 endpoint */
  function endpointOf(){
    var u=(CFG.url||"").trim().replace(/\/+$/,"");
    if(!u) return "";
    if(/\/chat\/completions$/i.test(u)) return u;
    if(/\/v\d+$/i.test(u)) return u+"/chat/completions";
    return u+"/v1/chat/completions";
  }
  function hasAI(){return !!(endpointOf()&&CFG.model);}
  function errMsg(e){return (e&&e.message)?e.message:String(e);}

  function setPill(state,text){
    var p=document.getElementById("aiPill");
    if(!p) return;
    p.className="ai-pill"+(state?" "+state:"");
    p.innerHTML="<i></i>"+esc(text);
  }
  function refreshPill(){
    if(!activeId) return;
    if(!hasAI()) setPill("off","AI未配置");
    else setPill("","AI已接入");
  }

  /* ---------- 人设 ---------- */
  var PERSONAS={

  function systemOf(c){
    var base;
    if(CFG.persona&&PERSONAS[c.id]) base=PERSONAS[c.id];
    else base="你是一个聊天助手，用自然、口语化的中文回复，默认简短（1~3 句），除非对方要求详细内容。";
    if(!CFG.persona) base="你正在扮演聊天对象「"+c.name+"」。"+base;
    if(c._who&&GROUP_SPEAKERS[c.id]) base+="\n你这次的发言人是「"+c._who+"」，直接输出要说的话，不要加名字前缀。";
    base+="\n只输出回复正文本身，不要解释你在扮演角色，不要输出括号动作描写。";
    return base;
  }

  /* ---------- 上下文拼装 ---------- */
  function buildMessages(c){
    var out=[{role:"system",content:systemOf(c)}];
    c.msgs.slice(-CTX_ROUNDS*2).forEach(function(m){
      if(m.sys) return;                        /* 系统提示不送入模型 */
      var body=String(m.text||"");
      if(c.group&&m.from!=="me") body=(m.who||"成员")+"："+body;
      var role=(m.from==="me")?"user":"assistant";
      var last=out[out.length-1];
      if(last&&last.role===role) last.content+="\n"+body;   /* 合并同角色，保证交替 */
      else out.push({role:role,content:body});
    });
    if(out.length<2||out[out.length-1].role!=="user") out.push({role:"user",content:"（继续）"});
    return out;
  }

  /* ---------- 传输层 ---------- */
  async function callAI(c,onDelta){
    var url=endpointOf();
    if(!url||!CFG.model) throw new Error("请先点右上角 ⚙ 配置 AI 接口");
    var ctrl=new AbortController();
    var to=setTimeout(function(){ctrl.abort();},Math.max(5000,CFG.timeout||60000));
    var payload={model:CFG.model,messages:buildMessages(c),temperature:0.8,stream:!!CFG.stream};
    try{
      var res=await fetch(url,{
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+(CFG.key||"")},
        body:JSON.stringify(payload),
        signal:ctrl.signal
      });
      if(!res.ok){
        var t="";
        try{t=await res.text();}catch(e2){}
        throw new Error("HTTP "+res.status+(t?" · "+t.slice(0,140):""));
      }
      /* 非流式 */
      if(!CFG.stream||!res.body){
        var j=await res.json();
        var txt=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
        if(typeof txt!=="string"||!txt.trim()) throw new Error("返回格式异常");
        return txt.trim();
      }
      /* 流式 SSE */
      var reader=res.body.getReader(),dec=new TextDecoder(),buf="",full="";
      while(true){
        var r=await reader.read();
        if(r.done) break;
        buf+=dec.decode(r.value,{stream:true});
        var lines=buf.split("\n");buf=lines.pop();
        for(var i=0;i<lines.length;i++){
          var line=lines[i].trim();
          if(line.indexOf("data:")!==0) continue;
          var d=line.slice(5).trim();
          if(!d||d==="[DONE]") continue;
          try{
            var jj=JSON.parse(d),ch=jj.choices&&jj.choices[0];
            var dd=ch&&((ch.delta&&ch.delta.content)||(ch.message&&ch.message.content));
            if(dd){full+=dd;if(onDelta) onDelta(full);}
          }catch(e3){}
        }
      }
      if(!full.trim()) throw new Error("返回为空（该模型可能不支持流式，可在设置里关闭）");
      return full.trim();
    }catch(err){
      if(err&&err.name==="AbortError") throw new Error("请求超时（"+(CFG.timeout||60000)+"ms），请检查网络或接口地址");
      throw err;
    }finally{
      clearTimeout(to);
    }
  }

  async function callAIWithRetry(c,onDelta){
    var tries=Math.max(0,CFG.retry|0)+1,last=null;
    for(var i=0;i<tries;i++){
      try{return await callAI(c,onDelta);}
      catch(e){
        last=e;
        if(/配置 AI 接口/.test(errMsg(e))) break;          /* 未配置：无需重试 */
        if(i<tries-1) await new Promise(function(r){setTimeout(r,700*(i+1));});
      }
    }
    throw last;
  }

  /* ---------- 调度层 ---------- */
  var replySeq={};
  function scheduleReply(c){
    if(replyTimers[c.id]) return;
    var delay=400+Math.random()*700;
    replyTimers[c.id]=setTimeout(function(){
      delete replyTimers[c.id];
      runAIReply(c);
    },delay);
  }

  function runAIReply(c){
    var token=(replySeq[c.id]=(replySeq[c.id]||0)+1);
    if(!hasAI()){localReply(c);return;}          /* 未配置接口 → 离线演示回复 */

    var sp=GROUP_SPEAKERS[c.id];
    c._who=sp&&sp.length?sp[Math.floor(Math.random()*sp.length)]:null;

    var typing=null,bubble=null,bubbleTxt=null;
    if(activeId===c.id){
      setPill("busy","AI 生成中");
      typing=document.createElement("div");
      typing.className="typing";typing.id="typing";typing.innerHTML="<i></i><i></i><i></i>";
      messagesEl.appendChild(typing);scrollBottom();
    }
    function killTyping(){if(typing&&typing.parentNode)typing.remove();typing=null;}
    function ensureBubble(){
      if(bubble||activeId!==c.id) return;
      killTyping();
      bubble=document.createElement("div");
      bubble.className="msg you stack";
      bubble.innerHTML=(c.group&&c._who?'<div class="who">'+esc(c._who)+'</div>':"")+
                       '<span class="txt streaming"></span>';
      messagesEl.appendChild(bubble);
      bubbleTxt=bubble.querySelector(".txt");
      scrollBottom();
    }

    callAIWithRetry(c,function(full){
      if(token!==replySeq[c.id]||activeId!==c.id) return;   /* 在途请求串台保护 */
      ensureBubble();
      if(bubbleTxt) bubbleTxt.textContent=full;
      if(isAtBottom()) scrollBottom(true);
    }).then(function(text){
      if(token!==replySeq[c.id]) return;
      killTyping();
      if(bubble&&bubble.parentNode) bubble.remove();
      pushReply(c,text,c._who);
      if(activeId===c.id) refreshPill();
    }).catch(function(e){
      if(token!==replySeq[c.id]) return;
      killTyping();
      if(bubble&&bubble.parentNode) bubble.remove();
      pushSys(c,"⚠ AI 请求失败："+errMsg(e),true);
      if(activeId===c.id) setPill("err","AI 出错");
    });
  }

  function fmt2(n){ return (Math.round(n*100)/100).toFixed(2); }

  function stQuoteOf(code){
    for(var i=0;i<STOCK.list.length;i++){ if(STOCK.list[i].code===code) return STOCK.list[i]; }
    return {code:code,name:code,price:100,chg:0};

  function stSeries(code,base){
    var seed=0; for(var i=0;i<code.length;i++) seed=(seed*31+code.charCodeAt(i))%9973;
    var out=[],v=base*0.9;
    for(var k=0;k<40;k++){
      seed=(seed*1103515245+12345)%2147483648;
      var r=(seed/2147483648)-0.5;
      v=v*(1+r*0.03);
      out.push(v);
    }
    out[out.length-1]=base;
    return out;
  }
  function stKlineSVG(series,up){
    var w=300,h=112,min=Math.min.apply(null,series),max=Math.max.apply(null,series);
    var rng=(max-min)||1, step=w/(series.length-1);
    var pts=series.map(function(v,i){ return [i*step, h-((v-min)/rng)*(h-14)-7]; });
    var col=up?"#ffd0d2":"#bff0d2";
    var area=pts.map(function(p,i){return (i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1);}).join(" ");
    area+=" L "+w+" "+h+" L 0 "+h+" Z";
    var line=pts.map(function(p,i){return (i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1);}).join(" ");
    return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+
      '<path d="'+area+'" fill="rgba(255,255,255,.22)"/>'+
      '<path d="'+line+'" fill="none" stroke="'+col+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></svg>';
  }
  /* 迷你折线（自选股行内） */
  function stSparkSVG(series,up){
    var w=62,h=26,min=Math.min.apply(null,series),max=Math.max.apply(null,series),rng=(max-min)||1;
    var step=w/(series.length-1);
    var pts=series.map(function(v,i){ return [i*step, h-((v-min)/rng)*(h-6)-3]; });
    var line=pts.map(function(p,i){return (i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1);}).join(" ");
    var col=up?"#e5484d":"#16a34a";
    return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+
      '<path d="'+line+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
  }
  /* 柱状图（成交量风格） */
  function stBarSVG(series,up){
    var w=300,h=94,min=Math.min.apply(null,series),max=Math.max.apply(null,series),rng=(max-min)||1;
    var n=series.length, gap=2, bw=(w-(n-1)*gap)/n;
    var col=up?"rgba(229,72,77,.82)":"rgba(22,163,74,.82)";
    var bars=series.map(function(v,i){
      var bh=((v-min)/rng)*(h-10)+6, x=i*(bw+gap), y=h-bh;
      return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="1.6" fill="'+col+'"/>';
    }).join("");
    return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+bars+'</svg>';
  }

      STOCK.pos[s.code]=p;

  /* ---------- 汇率换算 ---------- */
  function renderForex(bd){
    bd.innerHTML="";
    var rates={USD:1,CNY:7.18,EUR:0.92,JPY:157.2,HKD:7.82,GBP:0.79};
    var names={USD:"\u7F8E\u5143",CNY:"\u4EBA\u6C11\u5E01",EUR:"\u6B27\u5143",JPY:"\u65E5\u5143",HKD:"\u6E2F\u5E01",GBP:"\u82F1\u9551"};
    var from="USD",to="CNY";
    var hero=mk("div","st-hero");
    hero.appendChild(mkText("div","st-name","换算结果"));
    var out=mkText("div","st-price","0");
    hero.appendChild(out);
    var sub=mkText("div","st-chg","1 "+from+" = "+fmt2(rates[to]/rates[from])+" "+to);
    hero.appendChild(sub);
    bd.appendChild(hero);

    bd.appendChild(mkText("div","mp-sec","金额"));
    var inp=mk("input","mp-input"); inp.type="number"; inp.value="1000";
    bd.appendChild(inp);

    function paint(){
      var amt=parseFloat(inp.value)||0;
      var usd=amt/rates[from];
      out.textContent=(usd*rates[to]).toFixed(2);
      sub.textContent="1 "+from+" = "+fmt2(rates[to]/rates[from])+" "+to;
    }
    function segRow(label,key,setter){
      bd.appendChild(mkText("div","mp-sec",label));
      var seg=mk("div","mp-seg");
      Object.keys(rates).forEach(function(k){
        var b=mkText("button",null,k+" "+names[k]);
        b.onclick=function(){
          setter(k);
          var kids=seg.children;
          for(var i=0;i<kids.length;i++) kids[i].className="";
          b.className="on";
          paint();
        };
        if(k===(key==="from"?from:to)) b.className="on";
        seg.appendChild(b);
      });
      bd.appendChild(seg);
    }
    inp.addEventListener("input",paint);
    segRow("从","from",function(k){ from=k; });
    segRow("到","to",function(k){ to=k; });
    paint();
    bd.appendChild(mkText("div","mp-hint","汇率为本地演示数据，实际以银行牌价为准"));
  }

  var NOTE={items:[]};
  function renderNote(bd){
    bd.innerHTML="";

      var inc=0,exp=0;
      NOTE.items.forEach(function(x){ if(x.v>0) inc+=x.v; else exp+=x.v; });

    var list=mk("div","mp-list");
    function paintList(){
      list.innerHTML="";

    var hmore=$("mpHostMore");
    if(hmore) hmore.onclick=function(){ toast("\u5C0F\u7A0B\u5E8F\u66F4\u591A\u64CD\u4F5C\uFF08\u6F14\u793A\uFF09"); };

    document.addEventListener("keydown",function(e){
      if(e.key==="Escape"){
        var h=$("mpHost");
        if(h&&h.classList.contains("show")){ closeMini(); return; }
        if(MP.open) closeMP();
      }
    });
  }


  /* ---------- 初始化 ---------- */
  loadCfg();
  bindTabs();
  bindMP();
  bindFeedBar();
  /* 点击空白 / 滚动 / 缩放时收起浮层菜单 */
  document.addEventListener("click",function(){
    if(Date.now()<(menuGuardUntil||0)) return;
    closeCtxMenu();closeMenu();
  },false);
  document.addEventListener("scroll",function(){closeCtxMenu();},true);
  window.addEventListener("resize",function(){closeCtxMenu();closeMenu();});
  chats.forEach(function(c){c.msgs.forEach(function(m){m.t=m.base;});});
  renderList("");
  startAutoMsg();

  /* 桌面端默认打开第一个聊天 */
  if(window.innerWidth>768){openChat("anna");}
})();
</script>
</body>
</html>
