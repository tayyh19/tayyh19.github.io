<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GRAVITY LAB X · 重力实验室</title>
<style>
/* ============================================================
   GRAVITY LAB X · 全局样式
   主题通过 CSS 变量切换（JS 写入 :root）
   ============================================================ */
:root{
  --bg:#05070b; --bg2:#0a1220;
  --panel:rgba(14,20,31,.78); --panel2:rgba(18,26,40,.9);
  --line:rgba(120,180,255,.16); --line2:rgba(120,180,255,.30);
  --txt:#dbe7ff; --dim:#7e90b4; --acc:#54e0ff; --acc2:#b06cff;
  --ok:#5ef2a8; --warn:#ffd166; --bad:#ff6b81;
  --shadow:0 0 18px rgba(84,224,255,.22);
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"PingFang SC","Microsoft YaHei",monospace;
  -webkit-user-select:none;user-select:none}
button{font-family:inherit;outline:none}
.hide{display:none !important}

/* ---------- 画布 ---------- */
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:1}

/* ---------- 顶栏 ---------- */
#topbar{position:fixed;left:0;right:0;top:0;z-index:20;pointer-events:none;
  padding:calc(8px + env(safe-area-inset-top)) 10px 0}
#stats{position:absolute;left:10px;top:calc(8px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:12px;
  background:var(--panel);border:1px solid var(--line);font-size:12px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#stats .g{display:flex;align-items:center;gap:7px}
#stats .g+.g{border-left:1px solid var(--line);padding-left:8px}
#stats b{color:var(--acc);font-size:13px;font-weight:700}
#stats span{color:var(--dim);font-size:11px}
#stats i{width:1px;height:11px;background:var(--line)}
#stats .mat{color:var(--warn)}
#ops{position:absolute;right:10px;top:calc(8px + env(safe-area-inset-top));
  display:flex;gap:7px;pointer-events:auto}
#camops{position:absolute;right:10px;top:calc(58px + env(safe-area-inset-top));
  display:flex;flex-direction:column;gap:7px;pointer-events:auto}
.ob{width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);
  color:var(--txt);font-size:15px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ob.sm{width:34px;height:34px;font-size:14px;border-radius:10px}
.ob:active{transform:scale(.93)}
.ob.on{background:rgba(84,224,255,.18);border-color:rgba(84,224,255,.5);color:#c9f3ff;box-shadow:var(--shadow)}

/* ---------- 关卡横幅 ---------- */
#lvlbar{position:fixed;left:10px;right:10px;top:calc(56px + env(safe-area-inset-top));z-index:19;
  display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:12px;
  background:linear-gradient(90deg,rgba(84,224,255,.12),rgba(176,108,255,.12)),var(--panel);
  border:1px solid var(--line2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:12px}
#lvlbar .nm{color:var(--acc);font-weight:700;font-size:12.5px;white-space:nowrap}
#lvlbar .goal{color:var(--txt);opacity:.9;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lvlbar b.pr{color:var(--ok);white-space:nowrap}
#lvlbar .tm{color:var(--warn);white-space:nowrap}
#lvlbar button{padding:5px 10px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.05);
  color:var(--txt);font-size:11.5px;cursor:pointer}
#lvlbar button:active{transform:scale(.95)}

/* ---------- 小地图 ---------- */
#mini{position:fixed;right:10px;bottom:calc(150px + env(safe-area-inset-bottom));z-index:18;
  width:104px;height:72px;border-radius:10px;border:1px solid var(--line2);background:rgba(6,10,18,.72);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

/* ---------- 底部工作台（多标签） ---------- */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:linear-gradient(180deg,rgba(10,15,24,.55),rgba(8,12,20,.96) 26%);
  border-top:1px solid var(--line);border-radius:20px 20px 0 0;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transform:translateY(calc(100% - var(--peek,126px) - env(safe-area-inset-bottom)));
  transition:transform .28s cubic-bezier(.2,.8,.3,1);will-change:transform}
#sheet.open{transform:translateY(0)}
#handle{height:22px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#handle i{width:44px;height:4px;border-radius:2px;background:var(--line2)}
#tabs{display:flex;gap:6px;padding:2px 10px 8px;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:8px 13px;border-radius:11px;background:transparent;border:1px solid transparent;
  color:var(--dim);font-size:12.5px;cursor:pointer}
.tab.on{color:#eaf7ff;background:linear-gradient(135deg,rgba(84,224,255,.2),rgba(176,108,255,.2));
  border-color:var(--line2);box-shadow:var(--shadow)}
#panels{max-height:min(42vh,340px);overflow-y:auto;padding:4px 10px calc(14px + env(safe-area-inset-bottom));
  overscroll-behavior:contain}
.panel{display:none;padding-top:4px}
.panel.on{display:block}
.rows{display:flex;gap:7px;overflow-x:auto;padding:3px 1px;scrollbar-width:none}
.rows::-webkit-scrollbar{display:none}
.rows.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:0 0 auto;padding:9px 13px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);
  color:var(--txt);font-size:12.5px;cursor:pointer;white-space:nowrap;transition:transform .1s}
.chip:active{transform:scale(.95)}
.chip.on{background:linear-gradient(135deg,rgba(84,224,255,.22),rgba(176,108,255,.22));
  border-color:rgba(120,220,255,.6);color:#eaf7ff;box-shadow:var(--shadow)}
.chip .sub{display:block;font-size:10px;color:var(--dim);margin-top:2px}
.chip.on .sub{color:rgba(220,240,255,.75)}
.sechead{font-size:11px;color:var(--dim);letter-spacing:1px;margin:10px 2px 4px}
.sechead:first-child{margin-top:2px}

/* ---------- 卡片（关卡/存档） ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;
  transition:transform .1s}
.card:active{transform:scale(.97)}
.card .t{font-size:12.5px;color:var(--txt);display:flex;align-items:center;gap:6px}
.card .d{font-size:10.5px;color:var(--dim);margin-top:4px;line-height:1.5}
.card .badge{margin-left:auto;font-size:10px;padding:2px 7px;border-radius:8px}
.card.locked{opacity:.45}
.card.done .badge{background:rgba(94,242,168,.18);color:var(--ok)}
.card .badge.play{background:rgba(84,224,255,.16);color:var(--acc)}
.card.locked .badge{background:rgba(255,255,255,.08);color:var(--dim)}

/* ---------- 设置行 ---------- */
.setrow{display:flex;align-items:center;gap:10px;padding:9px 4px;font-size:12px;color:var(--dim);
  border-bottom:1px dashed rgba(120,180,255,.09)}
.setrow:last-child{border-bottom:none}
.setrow .lb{flex:0 0 92px;color:var(--txt)}
.setrow input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:22px;background:transparent}
.setrow input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;
  background:linear-gradient(90deg,var(--acc),var(--acc2))}
.setrow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7px;
  border-radius:50%;background:#eaf7ff;box-shadow:0 0 10px rgba(84,224,255,.8)}
.setrow .vv{flex:0 0 52px;text-align:right;color:var(--acc);font-size:12px}
.tgl{position:relative;width:44px;height:24px;border-radius:12px;background:rgba(255,255,255,.12);
  border:1px solid var(--line);cursor:pointer;transition:background .2s;flex:0 0 auto}
.tgl::after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;
  background:#cfe2ff;transition:left .2s}
.tgl.on{background:rgba(84,224,255,.4)}
.tgl.on::after{left:22px;background:#eaf7ff}

/* ---------- 弹窗 ---------- */
#modalWrap{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  background:rgba(3,5,9,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#modal{width:min(92vw,430px);max-height:76vh;display:flex;flex-direction:column;border-radius:18px;
  background:rgba(12,18,29,.96);border:1px solid var(--line2);box-shadow:0 18px 60px rgba(0,0,0,.6);
  overflow:hidden}
#modal .mhead{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--line);
  font-size:14px;color:var(--acc);font-weight:700;letter-spacing:.5px}
#modal .mhead .x{margin-left:auto;width:30px;height:30px;border-radius:9px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);color:var(--txt);font-size:14px;cursor:pointer}
#modal .mbody{padding:14px 16px;overflow-y:auto;font-size:12.5px;line-height:1.85;color:var(--txt)}
#modal .mbody h4{color:var(--acc);font-size:13px;margin:12px 0 6px;letter-spacing:.5px}
#modal .mbody h4:first-child{margin-top:0}
#modal .mbody p{color:#c8d6ee;margin:4px 0}
#modal .mbody ul{margin:4px 0 4px 18px;color:#c8d6ee}
#modal .mbody li{margin:3px 0}
#modal .mbody .kv{color:var(--warn)}
#modal .mbody .tt{color:var(--acc2)}
#modal .mfoot{display:flex;gap:8px;justify-content:flex-end;padding:11px 16px;border-top:1px solid var(--line)}
#modal .mfoot button{padding:8px 16px;border-radius:10px;border:1px solid var(--line2);
  background:rgba(84,224,255,.14);color:#eaf7ff;font-size:12.5px;cursor:pointer}
#modal .mfoot button.gray{background:rgba(255,255,255,.05);color:var(--txt)}
#modal textarea{width:100%;height:150px;margin-top:8px;border-radius:10px;border:1px solid var(--line);
  background:rgba(5,9,15,.8);color:#cfe2ff;font-family:inherit;font-size:11px;padding:9px;resize:none}
#modal .repbar{display:flex;align-items:center;gap:9px;margin:10px 0}
#modal .repbar input[type=range]{flex:1}

/* ---------- 提示与横幅 ---------- */
#toast{position:fixed;left:50%;bottom:calc(158px + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:40;padding:8px 15px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);
  font-size:12.5px;color:#cfe9ff;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:86vw;
  overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1}
#banner{position:fixed;left:50%;top:26%;transform:translate(-50%,-50%) scale(.8);z-index:55;text-align:center;
  opacity:0;transition:all .35s cubic-bezier(.2,1.4,.4,1);pointer-events:none}
#banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner .t1{font-size:26px;font-weight:800;letter-spacing:3px;color:#fff;
  text-shadow:0 0 24px var(--acc),0 0 60px var(--acc2)}
#banner .t2{font-size:12.5px;color:#cfe9ff;margin-top:8px;letter-spacing:1px}

/* ---------- 引导卡片 ---------- */
#hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:70;width:min(88vw,380px);
  padding:17px 19px;border-radius:18px;background:rgba(10,15,24,.94);border:1px solid var(--line2);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:13px;line-height:1.8;color:var(--txt);
  transition:opacity .35s;box-shadow:0 20px 70px rgba(0,0,0,.55)}
#hint h3{font-size:15px;margin-bottom:9px;color:var(--acc);letter-spacing:1px}
#hint .k{color:var(--warn)}
#hint .kk{color:var(--acc2)}
#hint .foot{display:flex;align-items:center;gap:8px;margin-top:12px}
#hint .dots{display:flex;gap:5px;margin-right:auto}
#hint .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.18)}
#hint .dots i.on{background:var(--acc);box-shadow:0 0 8px var(--acc)}
#hint button{padding:8px 15px;border-radius:10px;border:1px solid var(--line2);
  background:rgba(84,224,255,.16);color:#eaf7ff;font-size:12.5px;cursor:pointer}
#hint button.gray{background:rgba(255,255,255,.05);color:var(--dim);border-color:var(--line)}

/* ---------- 彩带 ---------- */
#confetti{position:fixed;inset:0;z-index:54;pointer-events:none;overflow:hidden}
.cf{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;opacity:.95;
  animation:cfdrop var(--dur) linear forwards}
@keyframes cfdrop{
  0%{transform:translateY(-20px) rotate(0deg)}
  100%{transform:translateY(105vh) rotate(var(--rot))}
}

/* ---------- 小屏适配 ---------- */
@media (max-height:620px){
  #panels{max-height:36vh}
  #mini{display:none}
}
@media (min-width:760px){
  #panels{max-height:min(46vh,420px)}
  #sheet{left:50%;right:auto;width:720px;transform:translate(-50%,calc(100% - var(--peek,126px) - env(safe-area-inset-bottom)))}
  #sheet.open{transform:translate(-50%,0)}
  #stats{left:calc(50% - 350px)}
  #ops{right:calc(50% - 350px)}
  #camops{right:calc(50% - 350px)}
  #lvlbar{left:calc(50% - 350px);right:calc(50% - 350px)}
  #mini{right:calc(50% - 350px)}
}
/* ---------- 窄屏适配：顶栏压缩 + 统计两行，杜绝重叠 ---------- */
@media (max-width:479px){
  #ops{gap:5px}
  .ob{width:36px;height:36px;font-size:14px;border-radius:11px}
  .ob.sm{width:32px;height:32px;font-size:13px;border-radius:9px}
  #stats{flex-direction:column;align-items:flex-start;gap:3px;padding:6px 9px;
    max-width:calc(100vw - 236px);overflow:hidden}
  #stats .g+.g{border-left:none;padding-left:0}
  #stats b{font-size:12px}
  #stats span{font-size:10.5px}
  #lvlbar{top:calc(62px + env(safe-area-inset-top))}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<!-- ============ 顶栏 ============ -->
<div id="topbar">
  <div id="stats">
    <span class="g"><b id="sFps">60</b><span>FPS</span><b id="sCnt">0</b><span>粒</span></span>
    <span class="g"><b id="sLnk">0</b><span>链</span><b id="sMat" class="mat">弹力</b></span>
  </div>
  <div id="ops">
    <button class="ob" id="bPause" type="button">⏸</button>
    <button class="ob" id="bSlow" type="button">慢</button>
    <button class="ob on" id="bTrail" type="button">影</button>
    <button class="ob" id="bMute" type="button">🔊</button>
    <button class="ob" id="bMenu" type="button">☰</button>
  </div>
  <div id="camops">
    <button class="ob sm" id="bZin" type="button">＋</button>
    <button class="ob sm" id="bZout" type="button">－</button>
    <button class="ob sm" id="bZfit" type="button">⤢</button>
  </div>
</div>

<!-- ============ 关卡横幅 ============ -->
<div id="lvlbar" class="hide">
  <span class="nm" id="lvlName">关卡</span>
  <span class="goal" id="lvlGoal">目标</span>
  <b class="pr" id="lvlProg">0/0</b>
  <span class="tm" id="lvlTime">00:00</span>
  <button id="bRestart" type="button">重开</button>
  <button id="bQuitLvl" type="button">退出</button>
</div>

<!-- ============ 小地图 ============ -->
<canvas id="mini" width="208" height="144"></canvas>

<!-- ============ 底部工作台 ============ -->
<div id="sheet">
  <div id="handle"><i></i></div>
  <div id="tabs">
    <button class="tab on" data-tab="pTools" type="button">🛠 工具</button>
    <button class="tab" data-tab="pScenes" type="button">🎬 场景</button>
    <button class="tab" data-tab="pLevels" type="button">🏆 关卡</button>
    <button class="tab" data-tab="pSave" type="button">💾 存档</button>
    <button class="tab" data-tab="pSet" type="button">⚙️ 设置</button>
  </div>
  <div id="panels">
    <!-- 工具页 -->
    <div class="panel on" id="pTools">
      <div class="sechead">工具 · 点选后用触屏操作</div>
      <div class="rows" id="toolRow"></div>
      <div class="sechead">材质 · 影响颜色/重量/弹性</div>
      <div class="rows" id="matRow"></div>
    </div>
    <!-- 场景页 -->
    <div class="panel" id="pScenes">
      <div class="sechead">一键摆好的实验场</div>
      <div class="rows wrap" id="sceneRow"></div>
    </div>
    <!-- 关卡页 -->
    <div class="panel" id="pLevels">
      <div class="sechead">挑战关卡 · 达成目标解锁下一关</div>
      <div class="cards" id="levelRow"></div>
    </div>
    <!-- 存档页 -->
    <div class="panel" id="pSave">
      <div class="sechead">快捷存档位（自动保存到本机）</div>
      <div class="cards" id="slotRow"></div>
      <div class="sechead">数据交换</div>
      <div class="rows">
        <button class="chip" id="bExport" type="button">📤 导出 JSON</button>
        <button class="chip" id="bImport" type="button">📥 导入 JSON</button>
        <button class="chip" id="bReplay" type="button">🎞 回放</button>
        <button class="chip" id="bSnapshot" type="button">📷 存快照</button>
      </div>
    </div>
    <!-- 设置页 -->
    <div class="panel" id="pSet">
      <div class="sechead">物理</div>
      <div id="setPhys"></div>
      <div class="sechead">显示</div>
      <div id="setView"></div>
      <div class="sechead">主题 / 声音</div>
      <div class="rows" id="themeRow"></div>
      <div id="setAudio"></div>
      <div class="sechead">维护</div>
      <div class="rows">
        <button class="chip" id="bResetSet" type="button">♻️ 恢复默认设置</button>
        <button class="chip" id="bResetAll" type="button">🗑 清空全部本地数据</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ 浮层 ============ -->
<div id="toast"></div>
<div id="banner"><div class="t1" id="bnT1">READY</div><div class="t2" id="bnT2"></div></div>
<div id="confetti"></div>
<div id="hint" class="hide"></div>
<div id="modalWrap" class="hide"><div id="modal">
  <div class="mhead"><span id="mTitle">标题</span><button class="x" id="mX" type="button">✕</button></div>
  <div class="mbody" id="mBody"></div>
  <div class="mfoot" id="mFoot"></div>
</div></div>

<script>
(function(){
'use strict';/* ============================================================
   §02 核心：工具函数 / 世界 / 相机 / 主题 / 材质 / 粒子 / 物理
   ============================================================ */

/* ---------- 小工具 ---------- */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function rnd(a,b){ return a+Math.random()*(b-a); }
function rndInt(a,b){ return Math.floor(rnd(a,b+1)); }
function lerp(a,b,t){ return a+(b-a)*t; }
function hypot(a,b){ return Math.sqrt(a*a+b*b); }
function nowMs(){ return (window.performance&&performance.now)?performance.now():Date.now(); }
function fmtTime(ms){
  var s=Math.max(0,Math.floor(ms/1000)), m=Math.floor(s/60); s=s%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function hexRgb(hex){
  hex=String(hex||'#000').replace('#','');
  if(hex.length===3) hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  var n=parseInt(hex,16);
  return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
}
function rgba(hex,a){ var c=hexRgb(hex); return 'rgba('+c.r+','+c.g+','+c.b+','+a+')'; }
function fmtNum(n){ n=Math.round(n); return String(n); }

/* ---------- 画布与小地图 ---------- */
var cv=document.getElementById('cv');
var ctx=cv.getContext('2d');
var miniCv=document.getElementById('mini');
var miniCtx=miniCv?miniCv.getContext('2d'):null;
var W=360,H=640,DPR=1;

/* ---------- 世界与相机 ---------- */
var WORLD={ w:1800, h:1200 };
var cam={ x:WORLD.w/2, y:WORLD.h/2, z:0.5, zMin:0.12, zMax:2.8, fitZ:0.5 };
function computeFitZ(){
  var zx=W/WORLD.w, zy=H/WORLD.h;
  cam.fitZ=Math.max(0.12,Math.min(zx,zy)*0.985);
  cam.zMin=cam.fitZ*0.8; cam.zMax=Math.max(2.2,cam.fitZ*3.4);
}
function camClamp(){
  var hw=W/(2*cam.z), hh=H/(2*cam.z);
  if(hw*2>=WORLD.w) cam.x=WORLD.w/2; else cam.x=clamp(cam.x,hw,WORLD.w-hw);
  if(hh*2>=WORLD.h) cam.y=WORLD.h/2; else cam.y=clamp(cam.y,hh,WORLD.h-hh);
}
function camFit(){ cam.z=cam.fitZ; cam.x=WORLD.w/2; cam.y=WORLD.h/2; camClamp(); }
function zoomAt(sx,sy,f){
  var wp=s2w(sx,sy);
  cam.z=clamp(cam.z*f,cam.zMin,cam.zMax);
  cam.x=wp.x-(sx-W/2)/cam.z;
  cam.y=wp.y-(sy-H/2)/cam.z;
  camClamp();
}
function panBy(dxs,dys){ cam.x-=dxs/cam.z; cam.y-=dys/cam.z; camClamp(); }
function w2s(x,y){ return { x:(x-cam.x)*cam.z+W/2, y:(y-cam.y)*cam.z+H/2 }; }
function s2w(sx,sy){ return { x:(sx-W/2)/cam.z+cam.x, y:(sy-H/2)/cam.z+cam.y }; }
function applyCam(){
  if(ctx&&ctx.setTransform) ctx.setTransform(DPR*cam.z,0,0,DPR*cam.z, DPR*(W/2-cam.x*cam.z), DPR*(H/2-cam.y*cam.z));
}

var P=[];   // 粒子 {x,y,px,py,r,m,im,pin,mat,e,gs,bf,fr,c}
var L=[];   // 连接 {a,b,len,st,type,w} type: rope|spring|stick

/* ---------- 粒子操作 ---------- */
function matOf(id){ return MATS[id]||MATS.rubber; }
function addBall(x,y,r,o){
  if(P.length>=SET.cap) return null;
  o=o||{};
  var mid=o.mat||mcur, mdef=matOf(mid);
  var p={
    x:x, y:y, px:x-(o.vx||0)*FIXED, py:y-(o.vy||0)*FIXED,
    r:r||8, m:(o.m||mdef.m), im:0, pin:!!o.pin,
    mat:mid, e:(o.e!==undefined?o.e:mdef.e), gs:(o.gs!==undefined?o.gs:mdef.gs),
    bf:(o.bf!==undefined?o.bf:mdef.bf), fr:(o.fr!==undefined?o.fr:mdef.fr),
    c:o.c||mdef.c
  };
  p.im=p.pin?0:(1/p.m);
  P.push(p); return p;
}
function addLink(a,b,len,st,type,w){
  if(a==null||b==null) return;
  L.push({ a:a, b:b, len:len, st:(st==null?1:st), type:type||'rope', w:w||0 });
}
function addStick(x1,y1,x2,y2,o){
  o=o||{};
  var p1=addBall(x1,y1,o.r||4.5,{mat:o.mat,pin:o.pin1});
  var p2=addBall(x2,y2,o.r||4.5,{mat:o.mat,pin:o.pin2});
  if(!p1||!p2) return null;
  var a=P.length-2, b=P.length-1;
  addLink(a,b,Math.hypot(p2.x-p1.x,p2.y-p1.y),1,'stick',o.w||8);
  return [a,b];
}
function addSeg(x1,y1,x2,y2,o){
  o=o||{};
  SG.push({ x1:x1,y1:y1,x2:x2,y2:y2, r:o.r||3, e:(o.e!==undefined?o.e:0.32) });
}
function addSegChain(pts,o){
  o=o||{};
  for(var i=0;i<pts.length-1;i++) addSeg(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],o);
}
function addBumper(x,y,r,o){ o=o||{}; SC.push({ x:x,y:y,r:r||26, e:(o.e!==undefined?o.e:0.55) }); }
function addZone(type,x,y,w,h,o){
  o=o||{};
  var dx=o.dirX, dy=o.dirY;
  if(dx===undefined&&dy===undefined){ dx=1; dy=0; }
  ZN.push({ type:type, x:x,y:y,w:w,h:h,
    strength:(o.strength!==undefined?o.strength:(type==='wind'?520:(type==='vortex'?640:0))),
    dirX:dx, dirY:dy });
}
function addMagnet(x,y,r,power){ MG.push({ x:x,y:y,r:r||220,power:(power===undefined?1:power) }); }
function addRotor(x,y,len,om,o){
  o=o||{};
  var rot={ x:x,y:y,len:len,om:om,ang:(o.ang||0),r:(o.r||5),e:(o.e!==undefined?o.e:0.5),
    ex1:0,ey1:0,ex2:0,ey2:0, pex1:0,pey1:0,pex2:0,pey2:0 };
  rotorEnds(rot); rot.pex1=rot.ex1; rot.pey1=rot.ey1; rot.pex2=rot.ex2; rot.pey2=rot.ey2;
  RT.push(rot); return rot;
}
function rotorEnds(r){
  var c=Math.cos(r.ang), s=Math.sin(r.ang), h=r.len/2;
  r.ex1=r.x-c*h; r.ey1=r.y-s*h; r.ex2=r.x+c*h; r.ey2=r.y+s*h;
}
function rotorStep(dt){
  for(var i=0;i<RT.length;i++){
    var r=RT[i];
    r.pex1=r.ex1; r.pey1=r.ey1; r.pex2=r.ex2; r.pey2=r.ey2;
    r.ang+=r.om*dt;
    rotorEnds(r);
  }
}
function nearestIdx(x,y,rad){
  var best=-1,bd=rad*rad;
  for(var i=0;i<P.length;i++){
    var dx=P[i].x-x, dy=P[i].y-y, d2=dx*dx+dy*dy;
    if(d2<bd){ bd=d2; best=i; }
  }
  return best;
}
function removeAt(i){
  if(i<0||i>=P.length) return false;
  P.splice(i,1);
  var keep=[],k;
  for(k=0;k<L.length;k++){
    var c=L[k];
    if(c.a===i||c.b===i) continue;
    if(c.a>i) c.a--;
    if(c.b>i) c.b--;
    keep.push(c);
  }
  L.length=0;
  for(k=0;k<keep.length;k++) L.push(keep[k]);
  return true;
}
function eraseNearest(x,y,rad){
  var i=nearestIdx(x,y,rad||36);
  if(i<0) return false;
  return removeAt(i);
}
function fresh(){
  P.length=0; L.length=0; SG.length=0; RT.length=0; SC.length=0;
  ZN.length=0; MG.length=0; SP.length=0; FX.length=0;
}

/* ============================================================
   物理核心：Verlet + 位置约束（PBD）+ 空间哈希
   ============================================================ */
var FIXED=1/120, REL=0.9, PI2=Math.PI*2, CELL=64;

function integrator(dt){
  var dt2=dt*dt, i,j,p;
  for(i=0;i<P.length;i++){
    p=P[i]; if(p.pin) continue;
    var ax=0, ay=GRAV()*p.gs, inWater=false, inWind=false;
    /* 磁铁 */
    for(j=0;j<MG.length;j++){
      var m=MG[j], dxm=m.x-p.x, dym=m.y-p.y, dm2=dxm*dxm+dym*dym;
      var rr=m.r*m.r;
      if(dm2<1||dm2>rr) continue;
      var dm=Math.sqrt(dm2), ff=m.power*(1-dm/m.r)*760;
      ax+=dxm/dm*ff; ay+=dym/dm*ff;
    }
    /* 区域 */
    for(j=0;j<ZN.length;j++){
      var z=ZN[j];
      if(p.x<z.x||p.x>z.x+z.w||p.y<z.y||p.y>z.y+z.h) continue;
      if(z.type==='water'){ ay-=GRAV()*1.15*p.bf; inWater=true; }
      else if(z.type==='wind'){ ax+=z.dirX*z.strength; ay+=z.dirY*z.strength; }
      else if(z.type==='vortex'){
        var vx2=p.x-(z.x+z.w/2), vy2=p.y-(z.y+z.h/2), vd=hypot(vx2,vy2)||1;
        ax+=(-vy2/vd)*z.strength; ay+=(vx2/vd)*z.strength;
      }
    }
    var dr=inWater?0.94:1;
    var vx=(p.x-p.px)*SET.damp*dr, vy=(p.y-p.py)*SET.damp*dr;
    p.px=p.x; p.py=p.y;
    p.x+=vx+ax*dt2; p.y+=vy+ay*dt2;
  }
}
function GRAV(){ return SET.grav; }

/* ---------- 单侧平面 ---------- */
function plane(p,nx,ny,pen){
  if(pen<=0) return;
  p.x+=nx*pen; p.y+=ny*pen;
  var vx=p.x-p.px, vy=p.y-p.py;
  var vn=vx*nx+vy*ny;
  if(vn<0){
    p.px+=(1+E_WALL())*vn*nx; p.py+=(1+E_WALL())*vn*ny;
    hit(0.5*p.x,0.5*p.y, -vn/FIXED, 'wall');
  }
}
function E_WALL(){ return 0.44*SET.bounce; }

function wallsPass(){
  for(var i=0;i<P.length;i++){
    var p=P[i];
    if(p.pin) continue;
    var pen;
    pen=p.r-p.x; if(pen>0) plane(p,1,0,pen);
    pen=p.x-(WORLD.w-p.r); if(pen>0) plane(p,-1,0,pen);
    pen=p.r-p.y; if(pen>0) plane(p,0,1,pen);
    pen=p.y-(WORLD.h-p.r);
    if(pen>0){ plane(p,0,-1,pen); p.px+=(p.x-p.px)*p.fr; if(p.fr<0.02){ /*冰面几乎无摩擦*/ } }
  }
}

/* ---------- 静态几何 ---------- */
function closestOnSeg(px,py,s){
  var dx=s.x2-s.x1, dy=s.y2-s.y1, L2=dx*dx+dy*dy;
  var t=L2>0?((px-s.x1)*dx+(py-s.y1)*dy)/L2:0;
  t=clamp(t,0,1);
  return { x:s.x1+t*dx, y:s.y1+t*dy, t:t };
}
function staticsPass(){
  var i,j,p,s,c,dx,dy,rs,d2,d;
  /* 线段 */
  for(i=0;i<P.length;i++){
    p=P[i]; if(p.pin) continue;
    for(j=0;j<SG.length;j++){
      s=SG[j];
      c=closestOnSeg(p.x,p.y,s);
      dx=p.x-c.x; dy=p.y-c.y; rs=p.r+s.r; d2=dx*dx+dy*dy;
      if(d2>=rs*rs) continue;
      d=Math.sqrt(d2)||0.001;
      plane(p,dx/d,dy/d,rs-d);
    }
    /* 静态圆 */
    for(j=0;j<SC.length;j++){
      s=SC[j];
      dx=p.x-s.x; dy=p.y-s.y; rs=p.r+s.r; d2=dx*dx+dy*dy;
      if(d2>=rs*rs) continue;
      d=Math.sqrt(d2)||0.001;
      plane(p,dx/d,dy/d,rs-d);
    }
    /* 旋转杆：带表面速度的碰撞 */
    for(j=0;j<RT.length;j++){
      s=RT[j];
      var cur={ x1:s.ex1,y1:s.ey1,x2:s.ex2,y2:s.ey2 };
      c=closestOnSeg(p.x,p.y,cur);
      dx=p.x-c.x; dy=p.y-c.y; rs=p.r+s.r; d2=dx*dx+dy*dy;
      if(d2>=rs*rs) continue;
      d=Math.sqrt(d2)||0.001;
      var nx=dx/d, ny=dy/d, pen=rs-d;
      var pc={ x1:s.pex1,y1:s.pey1,x2:s.pex2,y2:s.pey2 };
      var cp=closestOnSegParam(pc,c.t);
      var svx=(c.x-cp.x)/FIXED, svy=(c.y-cp.y)/FIXED;
      p.x+=nx*pen; p.y+=ny*pen;
      var vx=p.x-p.px, vy=p.y-p.py;
      var rvx=vx-svx, rvy=vy-svy;
      var vn=rvx*nx+rvy*ny;
      if(vn<0){
        var k=(1+s.e*SET.bounce)*vn;
        p.px+=k*nx; p.py+=k*ny;
        hit(c.x,c.y,-vn/FIXED,'rotor');
      }
    }
  }
}
function closestOnSegParam(s,t){
  var dx=s.x2-s.x1, dy=s.y2-s.y1;
  return { x:s.x1+t*dx, y:s.y1+t*dy };
}

/* ---------- 粒子对碰撞 ---------- */
function pairResolve(a,b){
  var dx=b.x-a.x, dy=b.y-a.y, rs=a.r+b.r, d2=dx*dx+dy*dy;
  if(d2>=rs*rs) return;
  var d=Math.sqrt(d2);
  if(d<1e-6){ dx=rnd(-1,1); dy=rnd(-1,1); d=Math.hypot(dx,dy)||1; }
  var nx=dx/d, ny=dy/d, pen=rs-d;
  var wa=a.im, wb=b.im, w=wa+wb;
  if(!w) return;
  if(wa){ a.x-=nx*pen*REL*wa/w; a.y-=ny*pen*REL*wa/w; }
  if(wb){ b.x+=nx*pen*REL*wb/w; b.y+=ny*pen*REL*wb/w; }
  var vax=a.x-a.px, vay=a.y-a.py, vbx=b.x-b.px, vby=b.y-b.py;
  var vn=(vbx-vax)*nx+(vby-vay)*ny;
  if(vn<0){
    var e=((a.e+b.e)/2)*SET.bounce; if(e>0.95) e=0.95;
    var j=-(1+e)*vn/w;
    a.px+=nx*j*wa; a.py+=ny*j*wa;
    b.px-=nx*j*wb; b.py-=ny*j*wb;
    hit((a.x+b.x)/2,(a.y+b.y)/2,-vn/FIXED,'ball');
  }
}
var grid=null;
function buildGrid(){
  grid={};
  for(var i=0;i<P.length;i++){
    var p=P[i];
    var k=((p.x/CELL)|0)+':'+((p.y/CELL)|0);
    var arr=grid[k];
    if(arr) arr.push(i); else grid[k]=[i];
  }
}
function pairPass(){
  for(var i=0;i<P.length;i++){
    var p=P[i];
    var qx=(p.x/CELL)|0, qy=(p.y/CELL)|0;
    for(var ox=-1;ox<=1;ox++){
      for(var oy=-1;oy<=1;oy++){
        var arr=grid[(qx+ox)+':'+(qy+oy)];
        if(!arr) continue;
        for(var k=0;k<arr.length;k++){
          var j=arr[k];
          if(j<=i) continue;
          pairResolve(p,P[j]);
        }
      }
    }
  }
}

/* ---------- 约束求解（绳/弹簧/刚杆） ---------- */
function solveLinks(){
  for(var i=0;i<L.length;i++){
    var c=L[i];
    var a=P[c.a], b=P[c.b];
    if(!a||!b) continue;
    var dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy;
    var d=Math.sqrt(d2);
    if(d<1e-6) continue;
    var wa=a.im, wb=b.im, w=wa+wb;
    if(!w) continue;
    var diff=(d-c.len)/d*(c.st==null?1:c.st);
    var kx=dx*diff, ky=dy*diff;
    if(wa){ a.x+=kx*(wa/w); a.y+=ky*(wa/w); }
    if(wb){ b.x-=kx*(wb/w); b.y-=ky*(wb/w); }
  }
}

/* ---------- 拖拽 ---------- */
function dragPass(dt){
  if(!drag.p) return;
  var p=drag.p;
  p.x+=(drag.tx-p.x)*0.6;
  p.y+=(drag.ty-p.y)*0.6;
  if(!p.pin){
    p.px=p.x-clamp(drag.vx,-5200,5200)*dt;
    p.py=p.y-clamp(drag.vy,-5200,5200)*dt;
  }
}

/* ---------- 子步 ---------- */
function substep(dt){
  rotorStep(dt);
  integrator(dt);
  dragPass(dt);
  buildGrid();
  var iters=Math.max(2,Math.min(8,Math.round(SET.iter)));
  for(var it=0;it<iters;it++){
    solveLinks();
    staticsPass();
    pairPass();
    wallsPass();
  }
}
function sanitize(){
  var n=0;
  for(var i=0;i<P.length;i++){
    var p=P[i];
    if(!isFinite(p.x)||!isFinite(p.y)){
      p.x=rnd(60,WORLD.w-60); p.y=rnd(60,WORLD.h-60);
      p.px=p.x; p.py=p.y; n++;
    }
  }
  return n;
}
function clampAll(){
  for(var i=0;i<P.length;i++){
    var p=P[i];
    p.x=clamp(p.x,-400,WORLD.w+400); p.y=clamp(p.y,-600,WORLD.h+600);
    p.px=clamp(p.px,-400,WORLD.w+400); p.py=clamp(p.py,-600,WORLD.h+600);
  }
}

/* ---------- 冲击工具 ---------- */
function explosion(x,y,power,radius){
  power=power||1; radius=radius||Math.max(WORLD.w,WORLD.h)*0.13;
  var n=0,i,p,dx,dy,d,f,mag,nx,ny;
  for(i=0;i<P.length;i++){
    p=P[i]; if(p.pin) continue;
    dx=p.x-x; dy=p.y-y; d=hypot(dx,dy);
    if(d>radius) continue;
    f=1-d/radius;
    if(d<0.5){ dx=rnd(-1,1); dy=rnd(-1,1); d=hypot(dx,dy)||1; }
    mag=power*f*1700; nx=dx/d; ny=dy/d;
    p.px-=nx*mag*FIXED; p.py-=ny*mag*FIXED;
    n++;
  }
  FX.push({ x:x,y:y,t:0.55,max:0.55,r:radius });
  sfx('boom',1);
  return n;
}
function gust(ux,uy,power){
  power=(power==null)?1:power;
  if(!isFinite(ux)||!isFinite(uy)) return 0;
  var m=hypot(ux,uy)||1; ux/=m; uy/=m;
  var n=0,i,p;
  for(i=0;i<P.length;i++){
    p=P[i]; if(p.pin) continue;
    p.px-=ux*power*980*FIXED;
    p.py-=uy*power*980*FIXED;
    n++;
  }
  FX.push({ x:WORLD.w/2,y:WORLD.h/2,t:0.4,max:0.4,r:Math.min(WORLD.w,WORLD.h)*0.5 });
  sfx('whoosh',1);
  return n;
}

/* ---------- 命中反馈（音效 + 火花 + 震屏） ---------- */
function hit(x,y,spd,kind){
  if(spd<150) return;
  if(SET.sparks) spawnSpark(x,y,spd,kind);
  sfx('hit',clamp(spd/2400,0.05,1),kind);
  if(spd>900) shake(clamp(spd/9000,0.02,0.14));
}
function spawnSpark(x,y,spd,kind){
  if(SP.length>240) return;
  var n=spd>700?3:(spd>320?2:1);
  for(var i=0;i<n;i++){
    var a=rnd(0,PI2), s=rnd(40,60)+spd*0.12;
    SP.push({ x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,t:0,life:rnd(0.25,0.5),
      c:(kind==='wall'?th.floorLine:(th.acc)),s:rnd(1,2.2) });
  }
}

/* ============================================================
   序列化 / 存档 / 快照
   ============================================================ */
function serializeScene(){
  var o={ v:2, world:{w:WORLD.w,h:WORLD.h}, set:{ grav:SET.grav,damp:SET.damp,iter:SET.iter,bounce:SET.bounce,slack:SET.slack } };
  o.p=[]; o.l=[]; o.sg=[]; o.rt=[]; o.sc=[]; o.zn=[]; o.mg=[];
  var i,p;
  for(i=0;i<P.length;i++){
    p=P[i];
    o.p.push([Math.round(p.x*10)/10,Math.round(p.y*10)/10,p.r,p.m,p.mat,p.pin?1:0]);
  }
  for(i=0;i<L.length;i++) o.l.push([L[i].a,L[i].b,Math.round(L[i].len*10)/10,L[i].st,L[i].type,L[i].w]);
  for(i=0;i<SG.length;i++){ var s=SG[i]; o.sg.push([s.x1,s.y1,s.x2,s.y2,s.r,s.e]); }
  for(i=0;i<RT.length;i++){ var r=RT[i]; o.rt.push([r.x,r.y,r.len,r.om,r.ang,r.r,r.e]); }
  for(i=0;i<SC.length;i++){ var c=SC[i]; o.sc.push([c.x,c.y,c.r,c.e]); }
  for(i=0;i<ZN.length;i++){ var z=ZN[i]; o.zn.push([z.type,z.x,z.y,z.w,z.h,z.strength,z.dirX,z.dirY]); }
  for(i=0;i<MG.length;i++){ var m=MG[i]; o.mg.push([m.x,m.y,m.r,m.power]); }
  return o;
}
function deserializeScene(o){
  if(!o||!o.p) return false;
  fresh();
  if(o.set){ if(o.set.grav!==undefined) SET.grav=o.set.grav; if(o.set.damp!==undefined) SET.damp=o.set.damp;
    if(o.set.iter!==undefined) SET.iter=o.set.iter; if(o.set.bounce!==undefined) SET.bounce=o.set.bounce;
    if(o.set.slack!==undefined) SET.slack=o.set.slack; }
  var i;
  for(i=0;i<o.p.length;i++){
    var a=o.p[i];
    var p=addBall(a[0],a[1],a[2],{ m:a[3], mat:a[4], pin:!!a[5] });
    if(p){ p.m=a[3]; p.im=p.pin?0:1/p.m; }
  }
  for(i=0;i<o.l.length;i++){
    var c=o.l[i];
    addLink(c[0],c[1],c[2],c[3],c[4],c[5]);
  }
  for(i=0;i<(o.sg||[]).length;i++){ var s=o.sg[i]; SG.push({ x1:s[0],y1:s[1],x2:s[2],y2:s[3],r:s[4],e:s[5] }); }
  for(i=0;i<(o.rt||[]).length;i++){ var r=o.rt[i]; addRotor(r[0],r[1],r[2],r[3],{ ang:r[4],r:r[5],e:r[6] }); }
  for(i=0;i<(o.sc||[]).length;i++){ var c2=o.sc[i]; SC.push({ x:c2[0],y:c2[1],r:c2[2],e:c2[3] }); }
  for(i=0;i<(o.zn||[]).length;i++){ var z=o.zn[i]; ZN.push({ type:z[0],x:z[1],y:z[2],w:z[3],h:z[4],strength:z[5],dirX:z[6],dirY:z[7] }); }
  for(i=0;i<(o.mg||[]).length;i++){ var m=o.mg[i]; MG.push({ x:m[0],y:m[1],r:m[2],power:m[3] }); }
  return true;
}
function sceneJSON(){ return JSON.stringify(serializeScene()); }
function sceneFromJSON(s){
  try{ var o=JSON.parse(s); return deserializeScene(o); }catch(e){ return false; }
}

}

/* ---------- 回放录制 ---------- */
var REC={ on:false, buf:[], stride:3, tick:0, max:480 };
function recReset(){ REC.buf.length=0; REC.tick=0; }
function recPush(){
  if(!REC.on) return;
  REC.tick++;
  if(REC.tick%REC.stride!==0) return;
  if(REC.buf.length>=REC.max) REC.buf.shift();
  var snap=new Float32Array(P.length*2);
  for(var i=0;i<P.length;i++){ snap[i*2]=P[i].x; snap[i*2+1]=P[i].y; }
  REC.buf.push({ n:P.length, d:snap });
}
function recPct(){ return REC.buf.length?REC.buf.length/REC.max:0; }

   §03 构件库：绳子 / 弹簧 / 布料 / 软体 / 雨 / 摆锤……
   ============================================================ */

/* ---------- 绳子（链式） ---------- */
function addRope(x1,y1,x2,y2,n,o){
  o=o||{}; n=clamp(Math.round(n||12),2,48);
  var sl=(o.slack!==undefined?o.slack:SET.slack), ids=[], prev=null, i;
  for(i=0;i<n;i++){
    var t=i/(n-1), x=lerp(x1,x2,t), y=lerp(y1,y2,t);
    var pin=(i===0&&o.pinA!==false)||(i===n-1&&!!o.pinB);
    var p=addBall(x,y,o.r||5,{ pin:pin, mat:o.mat, kind:'link' });
    if(!p) break;
    var idx=P.length-1;
    ids.push(idx);
    if(prev!=null){
      var a=P[prev];
      addLink(prev,idx,Math.hypot(p.x-a.x,p.y-a.y)*sl,1,'rope',0);
    }
    prev=idx;
  }
  return ids;
}
function ropeChain(x1,y1,x2,y2,n,o){
  /* 两端钉住、中间自由的“软桥”基础构件 */
  o=o||{}; o.pinA=true; o.pinB=true;
  return addRope(x1,y1,x2,y2,n,o);
}

/* ---------- 弹簧（低刚度连接） ---------- */
function addSpring(ia,ib,st){
  var a=P[ia], b=P[ib];
  if(!a||!b) return;
  addLink(ia,ib,hypot(b.x-a.x,b.y-a.y),(st===undefined?0.28:st),'spring',0);
}
function springBetween(x1,y1,x2,y2,o){
  o=o||{};
  var p1=addBall(x1,y1,o.r||4,{ mat:o.mat });
  var p2=addBall(x2,y2,o.r||4,{ mat:o.mat });
  if(!p1||!p2) return null;
  var ia=P.length-2, ib=P.length-1;
  addSpring(ia,ib,o.st);
  return [ia,ib];
}

/* ---------- 布料 ---------- */
function addCloth(x,y,cols,rows,sp,pinTop,o){
  o=o||{}; cols=cols||12; rows=rows||8; sp=sp||16;
  if(P.length+cols*rows>SET.cap) return 0;
  var map=[], i, j;
  for(j=0;j<rows;j++){
    for(i=0;i<cols;i++){
      addBall(x+i*sp,y+j*sp,4,{ pin:(!!pinTop&&j===0), mat:o.mat, kind:'cloth' });
      map.push(P.length-1);
    }
  }
  function id(ci,cj){ return map[cj*cols+ci]; }
  for(j=0;j<rows;j++){
    for(i=0;i<cols;i++){
      if(i<cols-1) addLink(id(i,j),id(i+1,j),sp,0.9,'rope',0);
      if(j<rows-1) addLink(id(i,j),id(i,j+1),sp,0.9,'rope',0);
    }
  }
  return map.length;
}

/* ---------- 软体（环 + 辐条） ---------- */
function addSoft(cx,cy,R,n,o){
  o=o||{}; n=n||16;
  if(P.length+n+1>SET.cap) return 0;
  var ring=[], i;
  for(i=0;i<n;i++){
    var a=i/n*PI2;
    addBall(cx+Math.cos(a)*R,cy+Math.sin(a)*R,5,{ mat:o.mat, kind:'soft' });
    ring.push(P.length-1);
  }
  addBall(cx,cy,4,{ mat:o.mat, kind:'soft' });
  var ci=P.length-1;
  var seg=2*R*Math.sin(Math.PI/n);
  for(i=0;i<n;i++){
    addLink(ring[i],ring[(i+1)%n],seg,0.9,'rope',0);
    addLink(ring[i],ci,R,0.35,'rope',0);
  }
  return n;
}

/* ---------- 摆锤 ---------- */
function addPendulum(x,y,len,ballR,o){
  o=o||{};
  var a=addBall(x,y,4,{ pin:true });
  if(!a) return null;
  var ai=P.length-1;
  var b=addBall(x,y+len,ballR||12,{ mat:o.mat, m:o.m });
  if(!b) return null;
  addLink(ai,P.length-1,len,1,'rope',0);
  return P.length-1;
}

/* ---------- 球塔（可被撞倒的堆叠） ---------- */
function addTower(x,baseY,n,r,o){
  o=o||{}; n=n||4; r=r||13;
  var ids=[], i;
  for(i=0;i<n;i++){
    var p=addBall(x,baseY-r-i*(r*1.85),r,{ mat:o.mat||'wood' });
    if(!p) break;
    ids.push(P.length-1);
  }
  return ids;
}

/* ---------- 滑道（折线地形） ---------- */
function addSlide(pts,o){ addSegChain(pts,o); }

/* ---------- 雨 ---------- */
function spawnRain(n,x0,x1,y0,y1,mat,minR,maxR){
  var added=0;
  for(var i=0;i<n;i++){
    if(addBall(rnd(x0,x1),rnd(y0,y1),rnd(minR||4,maxR||9),{ vx:rnd(-60,60), vy:rnd(30,140), mat:mat })) added++;
  }
  return added;
}

/* ---------- 计数器（供关卡使用） ---------- */
function countInZone(z,filter){
  var n=0, i;
  for(i=0;i<P.length;i++){
    var p=P[i];
    if(filter&&!filter(p)) continue;
    if(p.x>=z.x&&p.x<=z.x+z.w&&p.y>=z.y&&p.y<=z.y+z.h) n++;
  }
  return n;
}
function countTowersFallen(towers){
  var n=0;
  for(var i=0;i<towers.length;i++){
    var t=towers[i];
    /* 塔顶球显著低于初始高度即视为倒塌 */
    if(t&&t.top!==undefined&&t.topYP0!==undefined){
      var p=P[t.top];
      if(!p||(t.topYP0-p.y)>t.drop) n++;
    }
  }
  return n;
}
function stickTilt(link){
  var a=P[link.a], b=P[link.b];
  if(!a||!b) return 0;
  var dx=Math.abs(b.x-a.x), dy=Math.abs(b.y-a.y);
  return Math.atan2(dx,dy)*180/Math.PI; /* 0=竖直 / 90=水平 */
}

function lvTimer(){ return LV.elapsed; }

function startLevel(id){
  var def=null, i;
  for(i=0;i<LEVELS.length;i++){ if(LEVELS[i].id===id) def=LEVELS[i]; }
  if(!def) return false;
  fresh();
  SET.grav=(def.g!==undefined?def.g:1400);

  LV.towers=[];
  LV.zone=null;
  var res=def.setup();
  if(res&&res.towers) LV.towers=res.towers;
  if(res&&res.zone) LV.zone=res.zone;
  if(def.goal&&def.goal.zone) LV.zone=def.goal.zone;
  LV.active=true; LV.def=def; LV.done=false; LV.prog=0; LV.t0=nowMs(); LV.elapsed=0; LV.holdT=0;
  LV.need=(def.goal&&def.goal.need!==undefined)?def.goal.need:0;
  LV.free=!def.goal;

  if(typeof camFit==='function') camFit();
  toast('开始关卡：'+def.name);
  return true;
}
function quitLevel(){
  LV.active=false; LV.def=null; LV.done=false;
  if(typeof hideLvlBar==='function') hideLvlBar();
  toast('已退出关卡');
}
function restartLevel(){ if(LV.def) startLevel(LV.def.id); }

function levelWin(){
  if(LV.done||!LV.def) return;
  LV.done=true;
  var id=LV.def.id;
  if(LVP.cleared.indexOf(id)<0){ LVP.cleared.push(id); lvpSave(); }
  banner('CLEAR!', '「'+LV.def.name+'」完成 · 用时 '+fmtTime(LV.elapsed));
  confettiBurst();
  sfx('win',1);
  if(typeof refreshLevelUI==='function') refreshLevelUI();
}

function tickLevel(dt){
  if(!LV.active||!LV.def||LV.done||LV.free) return;
  LV.elapsed=nowMs()-LV.t0;
  var goal=LV.def.goal;
  var prog=0;
  if(goal.type==='collect'){
    prog=countInZone(LV.zone,function(p){ return !p.pin&&(!goal.mat||p.mat===goal.mat); });
    LV.prog=prog;
    if(prog>=goal.need) levelWin();
  } else if(goal.type==='knock'){
    prog=countTowersFallen(LV.towers);
    LV.prog=prog;
    if(prog>=goal.need) levelWin();
  } else if(goal.type==='hold'){
    var inz=countInZone(LV.zone,null)>0;
    if(inz){ LV.holdT+=dt; } else { LV.holdT=0; }
    LV.prog=Math.min(goal.need,LV.holdT);
    if(LV.holdT>=goal.need) levelWin();
  }
  if(typeof updateLvlBar==='function') updateLvlBar();
}

function toLocal(e){
  try{
    var r=cv.getBoundingClientRect();
    if(r&&r.width>0){
      return { x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height) };
    }
  }catch(err){}
  return { x:e.clientX||0, y:e.clientY||0 };
}
function distToSegPx(px,py,x1,y1,x2,y2){
  var dx=x2-x1, dy=y2-y1, L2=dx*dx+dy*dy;
  var t=L2>0?((px-x1)*dx+(py-y1)*dy)/L2:0;
  t=clamp(t,0,1);
  var cx=x1+t*dx, cy=y1+t*dy;
  return hypot(px-cx,py-cy);
}
function cutAt(x,y,rad){
  rad=rad||16;
  var removed=0;
  for(var i=L.length-1;i>=0;i--){
    var c=L[i], a=P[c.a], b=P[c.b];
    if(!a||!b) continue;
    if(distToSegPx(x,y,a.x,a.y,b.x,b.y)<rad){ L.splice(i,1); removed++; }
  }
  return removed;
}
function addSpringChain(x1,y1,x2,y2,n,o){
  o=o||{}; n=clamp(Math.round(n||7),3,14);
  var ids=[], prev=null, i;
  for(i=0;i<n;i++){
    var t=i/(n-1);
    var pin=(i===0&&o.pinA!==false);
    var p=addBall(lerp(x1,x2,t),lerp(y1,y2,t),o.r||4,{ pin:pin, mat:o.mat });
    if(!p) break;
    var idx=P.length-1;
    ids.push(idx);
    if(prev!=null){
      var a=P[prev];
      addLink(prev,idx,hypot(p.x-a.x,p.y-a.y),o.st||0.32,'spring',0);
    }
    prev=idx;
  }
  return ids.length;
}

function onDown(e){
  initAudio(); hideHint();
  POINTERS[e.pointerId]={ x:toLocal(e).x, y:toLocal(e).y };
  var nPtr=0,k; for(k in POINTERS){ if(POINTERS.hasOwnProperty(k)) nPtr++; }
  if(nPtr>=2){ beginPinch(); abortTool(); return; }
  if(ptr.down) return;
  ptr.down=true; ptr.id=e.pointerId;
  var spt=toLocal(e), pt=s2w(spt.x,spt.y);
  ptr.x=spt.x; ptr.y=spt.y; ptr.vx=0; ptr.vy=0; ptr.t=nowMs();
  touch.startX=pt.x; touch.startY=pt.y; touch.curX=pt.x; touch.curY=pt.y;
  try{ if(cv.setPointerCapture) cv.setPointerCapture(e.pointerId); }catch(err){}
  toolDown(pt,spt);
  if(e.cancelable) e.preventDefault();
  return false;
}
function toolDown(pt,spt){

    toast('爆炸影响 '+n+' 个粒子');
  } else if(tool==='pin'){
    var j=nearestIdx(pt.x,pt.y,44);
    if(j>=0){
      P[j].pin=!P[j].pin;
      P[j].im=P[j].pin?0:1/P[j].m;
      P[j].px=P[j].x; P[j].py=P[j].y;
      toast(P[j].pin?'已钉住':'已松开');
    }
  } else if(tool==='erase'){
    eraseNearest(pt.x,pt.y,48);
  } else if(tool==='cut'){
    cutAt(pt.x,pt.y,18);
  } else if(tool==='magnet'){
    var mi=-1;
    for(var m=0;m<MG.length;m++){ if(hypot(MG[m].x-pt.x,MG[m].y-pt.y)<110){ mi=m; break; } }
    if(mi>=0){ MG.splice(mi,1); toast('磁铁已移除'); }
    else{ addMagnet(pt.x,pt.y,260,1); toast('放置磁铁 · 再点它能移除'); }
  } else if(tool==='terrain'){
    TMP.path=[[pt.x,pt.y]];
  } else if(tool==='water'){
    TMP.water={ x0:pt.x, y0:pt.y, x1:pt.x, y1:pt.y };
  } else if(tool==='rope'||tool==='spring'||tool==='spawn'){
    TMP.rope={ x0:pt.x, y0:pt.y };
  }
}
function onMove(e){
  if(!POINTERS[e.pointerId]) return;
  var spt=toLocal(e);
  POINTERS[e.pointerId].x=spt.x; POINTERS[e.pointerId].y=spt.y;
  if(pinch){ updatePinch(); return; }
  if(!ptr.down||e.pointerId!==ptr.id) return;
  var pt=s2w(spt.x,spt.y);
  var t=nowMs();
  var dtms=Math.max(8,(t-ptr.t));
  var nvx=(spt.x-ptr.x)/dtms*1000, nvy=(spt.y-ptr.y)/dtms*1000;
  ptr.vx=lerp(ptr.vx,nvx,0.6); ptr.vy=lerp(ptr.vy,nvy,0.6);
  ptr.x=spt.x; ptr.y=spt.y; ptr.t=t;
  touch.curX=pt.x; touch.curY=pt.y;
  if(tool==='drag'&&drag.p){
    drag.tx=pt.x; drag.ty=pt.y; drag.vx=ptr.vx; drag.vy=ptr.vy;
  } else if(tool==='erase'){
    eraseNearest(pt.x,pt.y,48);
  } else if(tool==='cut'){
    cutAt(pt.x,pt.y,18);
  } else if(tool==='terrain'&&TMP.path){
    var last=TMP.path[TMP.path.length-1];
    if(hypot(pt.x-last[0],pt.y-last[1])>52){ TMP.path.push([pt.x,pt.y]); if(TMP.path.length>42) TMP.path.shift(); }
    touch.curX=pt.x; touch.curY=pt.y;
  } else if(tool==='water'&&TMP.water){
    TMP.water.x1=pt.x; TMP.water.y1=pt.y;
  }
  if(e.cancelable) e.preventDefault();
  return false;
}
function onUp(e){
  delete POINTERS[e.pointerId];
  if(pinch){ endPinch(); return; }
  if(e.pointerId!==ptr.id) return;
  ptr.down=false;
  var spt=toLocal(e), pt=s2w(spt.x,spt.y);
  toolUp(pt,spt);
  drag.vx=0; drag.vy=0;
  if(e.cancelable) e.preventDefault();
  return false;
}
function toolUp(pt,spt){
  if(tool==='drag'){
    drag.p=null;
  } else if(tool==='rope'){
    if(TMP.rope){
      var d=hypot(pt.x-TMP.rope.x0,pt.y-TMP.rope.y0);
      if(d<24){ toast('拉长一点再松手'); }
      else{
        var n=addRope(TMP.rope.x0,TMP.rope.y0,pt.x,pt.y,clamp(Math.round(d/32),3,40),{pinA:true});
        toast('绳子 ×'+n);
      }
    }
  } else if(tool==='spring'){
    if(TMP.rope){
      var d2=hypot(pt.x-TMP.rope.x0,pt.y-TMP.rope.y0);
      if(d2<24){ toast('拉长一点再松手'); }
      else{
        var n2=addSpringChain(TMP.rope.x0,TMP.rope.y0,pt.x,pt.y,clamp(Math.round(d2/48),3,14),{});
        toast('弹簧 ×'+n2);
      }
    }
  } else if(tool==='spawn'){
    var dx=pt.x-touch.startX, dy=pt.y-touch.startY;
    var r=clamp(hypot(dx,dy)*0.16,8,40);
    var ok=addBall(touch.startX,touch.startY,r,{ vx:ptr.vx*0.8, vy:ptr.vy*0.8 });
    toast(ok?('丢出 '+Math.round(r)+'px 的球'):'已到粒子上限');
  } else if(tool==='gust'){
    var gx=pt.x-touch.startX, gy=pt.y-touch.startY;
    var gd=hypot(gx,gy);
    if(gd>26){
      gust(gx/gd,gy/gd,clamp(gd/320,0.5,2.6));
      toast('呼——');
    }
  } else if(tool==='terrain'){
    if(TMP.path&&TMP.path.length>=2){ addSegChain(TMP.path,{r:4}); toast('地形已放置 ×'+(TMP.path.length-1)); }
    TMP.path=null;
  } else if(tool==='rotor'){
    var ddx=pt.x-touch.startX, ddy=pt.y-touch.startY;
    var len=clamp(hypot(ddx,ddy)*1.2,140,420);
    var om=(ddx<0?-1:1)*2.4;
    addRotor(touch.startX,touch.startY,len,om,{r:6});
    toast('放置风车 '+Math.round(len));
  } else if(tool==='water'){
    if(TMP.water){
      var x0=Math.min(TMP.water.x0,TMP.water.x1), y0=Math.min(TMP.water.y0,TMP.water.y1);
      var w=Math.abs(TMP.water.x1-TMP.water.x0), h=Math.abs(TMP.water.y1-TMP.water.y0);
      if(w*h>6000){ addZone('water',clamp(x0,0,WORLD.w-40),clamp(y0,0,WORLD.h-40),
        Math.min(w,WORLD.w),Math.min(h,WORLD.h),{}); toast('水池已放置'); }
      else toast('再拉大一点');
    }
    TMP.water=null;
  }
  TMP.rope=null;
}

/* ---------- 双指手势（缩放 + 平移） ---------- */
function twoPtrs(){
  var ids=[],k;
  for(k in POINTERS){ if(POINTERS.hasOwnProperty(k)) ids.push(k); }
  return ids;
}
function beginPinch(){
  var ids=twoPtrs();
  if(ids.length<2) return;
  var a=POINTERS[ids[0]], b=POINTERS[ids[1]];
  pinch={ d0:hypot(b.x-a.x,b.y-a.y)||1, z0:cam.z, cx0:(a.x+b.x)/2, cy0:(a.y+b.y)/2, camx0:cam.x, camy0:cam.y };
}
function updatePinch(){
  var ids=twoPtrs();
  if(ids.length<2||!pinch){ return; }
  var a=POINTERS[ids[0]], b=POINTERS[ids[1]];
  var d=hypot(b.x-a.x,b.y-a.y)||1;
  var cx=(a.x+b.x)/2, cy=(a.y+b.y)/2;
  cam.z=clamp(pinch.z0*(d/pinch.d0),cam.zMin,cam.zMax);
  cam.x=pinch.camx0-(cx-pinch.cx0)/cam.z;
  cam.y=pinch.camy0-(cy-pinch.cy0)/cam.z;
  camClamp();
}
function endPinch(){ if(twoPtrs().length<2) pinch=null; }
function abortTool(){
  drag.p=null;
  TMP.rope=null; TMP.path=null; TMP.water=null;
}

/* 键盘 */
document.addEventListener('keydown',function(e){
  var k=e.key;
  if(k===' '){ togglePause(); if(e.cancelable) e.preventDefault(); return; }
  if(k==='r'||k==='R'){ loadDefaultScene(); toast('已重载默认场景'); return; }
  if(k==='t'||k==='T'){ setTrails(!trails); return; }
  if(k==='m'||k==='M'){ setMute(!muted); return; }
  if(k==='z'||k==='Z'){ camFit(); return; }
  if(k==='Escape'){ closeModal(); return; }
  var n=parseInt(k,10);
  if(n>=1&&n<=9){ setTool(TOOLS[n-1].id); return; }
  if(k==='0'){ setTool(TOOLS[9].id); return; }
  if(k==='q'||k==='Q'){ setTool(TOOLS[10].id); return; }
  if(k==='w'||k==='W'){ setTool(TOOLS[11].id); return; }
  if(k==='e'||k==='E'){ setTool(TOOLS[12].id); return; }
},false);

}/* ============================================================

var bgGrad=null;
var shakeAmp=0, shakeX=0, shakeY=0;
var RPL={ on:false, idx:0 };
var miniTick=0;

function shake(v){ shakeAmp=Math.min(0.16,shakeAmp+v); }

function updateFx(dt){
  /* 爆炸/冲击环 */
  for(var i=FX.length-1;i>=0;i--){ FX[i].t-=dt; if(FX[i].t<=0) FX.splice(i,1); }
  /* 火花 */
  for(i=SP.length-1;i>=0;i--){
    var s=SP[i];
    s.t+=dt;
    if(s.t>=s.life){ SP.splice(i,1); continue; }
    s.vy+=520*dt;
    s.x+=s.vx*dt; s.y+=s.vy*dt;
    s.vx*=0.985; s.vy*=0.985;
  }
  /* 震屏衰减 */
  if(shakeAmp>0.0005){
    shakeX=(Math.random()*2-1)*shakeAmp*W;
    shakeY=(Math.random()*2-1)*shakeAmp*H;
    shakeAmp*=Math.pow(0.02,dt);
  } else { shakeX=0; shakeY=0; shakeAmp=0; }
}
function lw(k){ return k/Math.max(0.2,cam.z); }  /* 保持屏幕线宽 */

/* ---------- 背景 ---------- */
function drawBackground(){
  if(trails){
    ctx.fillStyle=rgba(th.bg,0.26);
    ctx.fillRect(-2000,-2000,WORLD.w+4000,WORLD.h+4000);
  } else {
    if(!bgGrad){
      try{
        bgGrad=ctx.createLinearGradient(0,0,0,WORLD.h);
        bgGrad.addColorStop(0,th.bg2);
        bgGrad.addColorStop(1,th.bg);
      }catch(e){ bgGrad=null; }
    }
    ctx.fillStyle=bgGrad||th.bg;
    ctx.fillRect(-2000,-2000,WORLD.w+4000,WORLD.h+4000);
    /* 网格 */
    var step=150, x, y;
    ctx.strokeStyle=th.grid; ctx.lineWidth=lw(1);
    ctx.beginPath();
    for(x=0;x<=WORLD.w;x+=step){ ctx.moveTo(x,0); ctx.lineTo(x,WORLD.h); }
    for(y=0;y<=WORLD.h;y+=step){ ctx.moveTo(0,y); ctx.lineTo(WORLD.w,y); }
    ctx.stroke();
  }
}

/* ---------- 世界边界 ---------- */
function drawBounds(){
  ctx.strokeStyle=th.floorLine; ctx.lineWidth=lw(2.5);
  ctx.strokeRect(0,0,WORLD.w,WORLD.h);
  ctx.beginPath(); ctx.moveTo(0,WORLD.h); ctx.lineTo(WORLD.w,WORLD.h);
  ctx.lineWidth=lw(3.5); ctx.stroke();
}

/* ---------- 区域 ---------- */
function drawZones(){
  var i,z,t;
  for(i=0;i<ZN.length;i++){
    z=ZN[i];
    if(z.type==='water'){
      ctx.fillStyle='rgba(84,150,255,.12)';
      ctx.fillRect(z.x,z.y,z.w,z.h);
      ctx.strokeStyle='rgba(120,190,255,.35)'; ctx.lineWidth=lw(1.6);
      ctx.strokeRect(z.x,z.y,z.w,z.h);
      /* 水面波纹 */
      t=nowMs()/700;
      ctx.beginPath();
      for(var x=z.x;x<=z.x+z.w;x+=36){
        var yy=z.y+Math.sin(x*0.02+t)*5;
        if(x===z.x) ctx.moveTo(x,yy); else ctx.lineTo(x,yy);
      }
      ctx.strokeStyle='rgba(160,215,255,.5)'; ctx.lineWidth=lw(2); ctx.stroke();
    } else if(z.type==='wind'){
      ctx.fillStyle='rgba(150,255,210,.06)';
      ctx.fillRect(z.x,z.y,z.w,z.h);
      ctx.strokeStyle='rgba(150,255,210,.28)'; ctx.lineWidth=lw(1.4);
      ctx.strokeRect(z.x,z.y,z.w,z.h);
      /* 风向条纹 */
      var steps=7, k;
      ctx.strokeStyle='rgba(150,255,210,.35)'; ctx.lineWidth=lw(1.6);
      ctx.beginPath();
      for(k=0;k<steps;k++){
        var yy2=z.y+ (k+0.5)*z.h/steps;
        var off=(nowMs()/22+k*90)%180;
        var xx=z.x+off%Math.max(80,z.w-40);
        ctx.moveTo(xx,yy2);
        ctx.lineTo(xx+44, yy2+z.dirY*44);
      }
      ctx.stroke();
    } else if(z.type==='vortex'){
      ctx.fillStyle='rgba(200,140,255,.07)';
      ctx.fillRect(z.x,z.y,z.w,z.h);
      ctx.strokeStyle='rgba(200,140,255,.3)'; ctx.lineWidth=lw(1.4);
      ctx.strokeRect(z.x,z.y,z.w,z.h);
      var cxx=z.x+z.w/2, cyy=z.y+z.h/2;
      var rr=Math.min(z.w,z.h)*0.42, a0=nowMs()/500, q2;
      ctx.strokeStyle='rgba(210,160,255,.5)'; ctx.lineWidth=lw(2);
      for(q2=0;q2<3;q2++){
        ctx.beginPath();
        for(var aa=0;aa<=6.2;aa+=0.25){
          var rd=rr*(0.3+q2*0.32)+aa*6;
          var px2=cxx+Math.cos(aa+a0)*rd, py2=cyy+Math.sin(aa+a0)*rd;
          if(aa===0) ctx.moveTo(px2,py2); else ctx.lineTo(px2,py2);
        }
        ctx.stroke();
      }
    }
  }
}

/* ---------- 静态几何 ---------- */
function drawStatics(){
  var i;
  /* 线段 */
  ctx.lineCap='round';
  for(i=0;i<SG.length;i++){
    var s=SG[i];
    ctx.strokeStyle='rgba(150,180,220,.9)'; ctx.lineWidth=lw(s.r*2);
    ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=lw(s.r*0.8);
    ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); ctx.stroke();
  }
  /* 静态圆 */
  for(i=0;i<SC.length;i++){
    var c=SC[i];
    ctx.beginPath(); ctx.arc(c.x,c.y,c.r,0,PI2);
    ctx.fillStyle='rgba(36,54,84,.65)'; ctx.fill();
    ctx.strokeStyle='rgba(140,195,255,.65)'; ctx.lineWidth=lw(2); ctx.stroke();
    ctx.beginPath(); ctx.arc(c.x-c.r*0.3,c.y-c.r*0.3,c.r*0.28,0,PI2);
    ctx.fillStyle='rgba(200,230,255,.18)'; ctx.fill();
  }
  /* 旋转杆 */
  for(i=0;i<RT.length;i++){
    var r=RT[i];
    ctx.strokeStyle='rgba(255,190,120,.95)'; ctx.lineWidth=lw(r.r*2);
    ctx.beginPath(); ctx.moveTo(r.ex1,r.ey1); ctx.lineTo(r.ex2,r.ey2); ctx.stroke();
    ctx.beginPath(); ctx.arc(r.x,r.y,lw(9),0,PI2);
    ctx.fillStyle='rgba(255,210,150,.9)'; ctx.fill();
  }
  /* 磁铁 */
  for(i=0;i<MG.length;i++){
    var m=MG[i], pulse=0.5+0.5*Math.sin(nowMs()/300+i);
    ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,PI2);
    ctx.strokeStyle=(m.power>=0?'rgba(120,180,255,':'rgba(255,140,170,')+(0.10+0.10*pulse)+')';
    ctx.lineWidth=lw(2); ctx.stroke();
    ctx.beginPath(); ctx.arc(m.x,m.y,12,0,PI2);
    ctx.fillStyle=(m.power>=0?'#7fb2ff':'#ff8fa8'); ctx.fill();
    ctx.beginPath(); ctx.arc(m.x,m.y,12+4*pulse,0,PI2);
    ctx.strokeStyle=(m.power>=0?'rgba(127,178,255,.5)':'rgba(255,143,168,.5)');
    ctx.lineWidth=lw(2); ctx.stroke();
  }
}

/* ---------- 连接 ---------- */
function drawLinks(){
  var i,c,a,b;
  /* 绳 */
  ctx.strokeStyle=th.link; ctx.lineWidth=lw(1.2);
  ctx.beginPath();
  var hasRope=false;
  for(i=0;i<L.length;i++){
    c=L[i];
    if(c.type!=='rope') continue;
    a=P[c.a]; b=P[c.b];
    if(!a||!b) continue;
    ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
    hasRope=true;
  }
  if(hasRope) ctx.stroke();
  /* 弹簧（锯齿） */
  for(i=0;i<L.length;i++){
    c=L[i];
    if(c.type!=='spring') continue;
    a=P[c.a]; b=P[c.b];
    if(!a||!b) continue;
    var dx=b.x-a.x, dy=b.y-a.y, d=hypot(dx,dy)||1;
    var nx=dx/d, ny=dy/d, px=-ny, py=nx;
    var segs=6, amp=7, k2;
    ctx.strokeStyle='rgba(160,255,200,.75)'; ctx.lineWidth=lw(1.6);
    ctx.beginPath();
    ctx.moveTo(a.x,a.y);
    for(k2=1;k2<segs;k2++){
      var tt=k2/segs, side=(k2%2===0?1:-1)*amp;
      ctx.lineTo(a.x+nx*d*tt+px*side, a.y+ny*d*tt+py*side);
    }
    ctx.lineTo(b.x,b.y);
    ctx.stroke();
  }
  /* 刚杆（粗胶囊） */
  for(i=0;i<L.length;i++){
    c=L[i];
    if(c.type!=='stick') continue;
    a=P[c.a]; b=P[c.b];
    if(!a||!b) continue;
    ctx.strokeStyle='rgba(200,210,230,.92)'; ctx.lineWidth=lw(c.w||8);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
}

/* ---------- 粒子 ---------- */
function particlePos(i){
  if(RPL.on&&REC.buf.length){
    var snap=REC.buf[clamp(RPL.idx,0,REC.buf.length-1)];
    if(snap&&i*2+1<snap.d.length) return { x:snap.d[i*2], y:snap.d[i*2+1] };
  }
  var p=P[i];
  return p?{x:p.x,y:p.y}:{x:0,y:0};
}
function drawParticles(){
  var i,p,x,y;
  for(i=0;i<P.length;i++){
    p=P[i];
    if(RPL.on&&REC.buf.length){
      var q=particlePos(i); x=q.x; y=q.y;
    } else { x=p.x; y=p.y; }
    ctx.beginPath(); ctx.arc(x,y,p.r,0,PI2);
    ctx.fillStyle=p.c; ctx.fill();
    /* 内部高光 */
    ctx.beginPath(); ctx.arc(x-p.r*0.3,y-p.r*0.3,p.r*0.34,0,PI2);
    ctx.fillStyle='rgba(255,255,255,.30)'; ctx.fill();
    if(p.pin){
      ctx.beginPath(); ctx.arc(x,y,p.r+2.5,0,PI2);
      ctx.strokeStyle='rgba(84,224,255,.9)'; ctx.lineWidth=lw(1.5); ctx.stroke();
    }
    if(SET.vec&&!RPL.on){
      var vx2=p.x-p.px, vy2=p.y-p.py, sp2=hypot(vx2,vy2);
      if(sp2>0.6){
        ctx.beginPath(); ctx.moveTo(x,y);
        ctx.lineTo(x+vx2*4,y+vy2*4);
        ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=lw(1); ctx.stroke();
      }
    }
  }
  /* 拖拽高亮 */
  if(drag.p&&!RPL.on){
    ctx.beginPath(); ctx.arc(drag.p.x,drag.p.y,drag.p.r+6,0,PI2);
    ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=lw(1.6); ctx.stroke();
  }
}

/* ---------- 预览 ---------- */
function drawPreviews(){
  if(!ptr.down||pinch) return;
  var i;
  if(tool==='rope'&&TMP.rope){
    ctx.setLineDash&&ctx.setLineDash([lw(8),lw(7)]);
    ctx.beginPath(); ctx.moveTo(TMP.rope.x0,TMP.rope.y0); ctx.lineTo(touch.curX,touch.curY);
    ctx.strokeStyle='rgba(160,220,255,.85)'; ctx.lineWidth=lw(2); ctx.stroke();
    ctx.setLineDash&&ctx.setLineDash([]);
  } else if(tool==='spring'&&TMP.rope){
    var dx=touch.curX-TMP.rope.x0, dy=touch.curY-TMP.rope.y0, d=hypot(dx,dy)||1;
    var nx=dx/d, ny=dy/d, px=-ny, py=nx;
    ctx.strokeStyle='rgba(160,255,200,.85)'; ctx.lineWidth=lw(1.8);
    ctx.beginPath(); ctx.moveTo(TMP.rope.x0,TMP.rope.y0);
    for(i=1;i<8;i++){
      var tt=i/8, side=(i%2===0?1:-1)*9;
      ctx.lineTo(TMP.rope.x0+nx*d*tt+px*side, TMP.rope.y0+ny*d*tt+py*side);
    }
    ctx.lineTo(touch.curX,touch.curY); ctx.stroke();
  } else if(tool==='spawn'){
    var ddx=touch.curX-touch.startX, ddy=touch.curY-touch.startY;
    var r=clamp(hypot(ddx,ddy)*0.16,8,40);
    ctx.beginPath(); ctx.arc(touch.startX,touch.startY,r,0,PI2);
    ctx.strokeStyle='rgba(255,255,255,.75)'; ctx.lineWidth=lw(1.6); ctx.stroke();
  } else if(tool==='gust'){
    var gx=touch.curX-touch.startX, gy=touch.curY-touch.startY;
    if(hypot(gx,gy)>20){
      ctx.strokeStyle='rgba(180,255,220,.85)'; ctx.lineWidth=lw(3);
      ctx.beginPath(); ctx.moveTo(touch.startX,touch.startY); ctx.lineTo(touch.curX,touch.curY); ctx.stroke();
      ctx.beginPath(); ctx.arc(touch.curX,touch.curY,lw(7),0,PI2);
      ctx.fillStyle='rgba(180,255,220,.9)'; ctx.fill();
    }
  } else if(tool==='terrain'&&TMP.path){
    ctx.strokeStyle='rgba(150,180,220,.8)'; ctx.lineWidth=lw(5); ctx.lineCap='round';
    ctx.beginPath();
    for(i=0;i<TMP.path.length;i++){
      var pt=TMP.path[i];
      if(i===0) ctx.moveTo(pt[0],pt[1]); else ctx.lineTo(pt[0],pt[1]);
    }
    ctx.lineTo(touch.curX,touch.curY);
    ctx.stroke();
  } else if(tool==='water'&&TMP.water){
    var x0=Math.min(TMP.water.x0,TMP.water.x1), y0=Math.min(TMP.water.y0,TMP.water.y1);
    var w2=Math.abs(TMP.water.x1-TMP.water.x0), h2=Math.abs(TMP.water.y1-TMP.water.y0);
    ctx.fillStyle='rgba(84,150,255,.15)'; ctx.fillRect(x0,y0,w2,h2);
    ctx.strokeStyle='rgba(140,200,255,.7)'; ctx.lineWidth=lw(1.6); ctx.strokeRect(x0,y0,w2,h2);
  } else if(tool==='rotor'){
    var rd=hypot(touch.curX-touch.startX,touch.curY-touch.startY);
    var rl=clamp(rd*1.2,140,420);
    ctx.strokeStyle='rgba(255,190,120,.8)'; ctx.lineWidth=lw(6);
    ctx.beginPath();
    ctx.moveTo(touch.startX-rl/2,touch.startY); ctx.lineTo(touch.startX+rl/2,touch.startY);
    ctx.stroke();
  }
}

/* ---------- 关卡目标区 ---------- */
function drawLevelZone(){
  if(!LV.active||!LV.zone||RPL.on) return;
  var z=LV.zone, pulse=0.5+0.5*Math.sin(nowMs()/420);
  ctx.setLineDash&&ctx.setLineDash([lw(14),lw(10)]);
  ctx.strokeStyle='rgba(94,242,168,'+(0.45+0.35*pulse)+')';
  ctx.lineWidth=lw(2.5);
  ctx.strokeRect(z.x,z.y,z.w,z.h);
  ctx.setLineDash&&ctx.setLineDash([]);
  ctx.fillStyle='rgba(94,242,168,.06)';
  ctx.fillRect(z.x,z.y,z.w,z.h);
}

/* ---------- 火花 & 冲击环 ---------- */
function drawFx(){
  var i;
  for(i=0;i<SP.length;i++){
    var s=SP[i], k=1-s.t/s.life;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.s*k+0.4,0,PI2);
    ctx.fillStyle=rgba(s.c,k*0.9); ctx.fill();
  }
  for(i=0;i<FX.length;i++){
    var f=FX[i], k2=f.t/f.max;
    ctx.beginPath(); ctx.arc(f.x,f.y,(1-k2)*f.r,0,PI2);
    ctx.strokeStyle='rgba(255,180,90,'+(k2*0.85)+')';
    ctx.lineWidth=lw(2.5*k2+0.6); ctx.stroke();
  }
}

/* ---------- 主渲染 ---------- */
function render(){
  var sx=shakeX*DPR, sy=shakeY*DPR;
  if(ctx&&ctx.setTransform){
    ctx.setTransform(DPR*cam.z,0,0,DPR*cam.z,
      DPR*(W/2-cam.x*cam.z)+sx, DPR*(H/2-cam.y*cam.z)+sy);
  }
  drawBackground();
  drawZones();
  drawBounds();
  drawStatics();
  drawLevelZone();
  drawLinks();
  drawParticles();
  drawPreviews();
  drawFx();
}

/* ---------- 小地图 ---------- */
function drawMini(){
  if(!miniCtx||!SET.mini) return;
  miniTick++;
  if(miniTick%6!==0) return;
  var mw=miniCv.width, mh=miniCv.height;
  var kx=mw/WORLD.w, ky=mh/WORLD.h, k=Math.min(kx,ky);
  var ox=(mw-WORLD.w*k)/2, oy=(mh-WORLD.h*k)/2;
  miniCtx.setTransform(1,0,0,1,0,0);
  miniCtx.clearRect(0,0,mw,mh);
  miniCtx.fillStyle=rgba(th.bg,0.6);
  miniCtx.fillRect(0,0,mw,mh);
  var i;
  /* 区域 */
  for(i=0;i<ZN.length;i++){
    var z=ZN[i];
    miniCtx.fillStyle=(z.type==='water'?'rgba(84,150,255,.35)':(z.type==='wind'?'rgba(150,255,210,.3)':'rgba(200,140,255,.3)'));
    miniCtx.fillRect(ox+z.x*k,oy+z.y*k,z.w*k,z.h*k);
  }
  /* 线段 */
  miniCtx.strokeStyle='rgba(150,180,220,.6)'; miniCtx.lineWidth=1;
  miniCtx.beginPath();
  for(i=0;i<SG.length;i++){
    var s=SG[i];
    miniCtx.moveTo(ox+s.x1*k,oy+s.y1*k);
    miniCtx.lineTo(ox+s.x2*k,oy+s.y2*k);
  }
  miniCtx.stroke();
  /* 粒子 */
  for(i=0;i<P.length;i++){
    var p=P[i];
    miniCtx.fillStyle=p.c;
    miniCtx.fillRect(ox+p.x*k-0.6,oy+p.y*k-0.6,1.6,1.6);
  }
  /* 磁铁 */
  for(i=0;i<MG.length;i++){
    miniCtx.fillStyle='#7fb2ff';
    miniCtx.beginPath(); miniCtx.arc(ox+MG[i].x*k,oy+MG[i].y*k,2.5,0,PI2); miniCtx.fill();
  }
  /* 相机窗口 */
  var hw=W/(2*cam.z)*k, hh=H/(2*cam.z)*k;
  miniCtx.strokeStyle='rgba(255,255,255,.85)'; miniCtx.lineWidth=1.4;
  miniCtx.strokeRect(ox+cam.x*k-hw, oy+cam.y*k-hh, hw*2, hh*2);
}

var hintIdx=0;
var hintDone=false;
function hintById(id){ return document.getElementById(id); }
function renderHint(){
  if(!hintEl) return;
  var s=HINT_STEPS[hintIdx];
  var dots='';
  for(var i=0;i<HINT_STEPS.length;i++) dots+='<i class="'+(i===hintIdx?'on':'')+'"></i>';
  hintEl.innerHTML='<h3>'+s.t+'</h3><p>'+s.h+'</p><div class="foot"><div class="dots">'+dots+'</div>'+
    '<button class="gray" id="hSkip" type="button">跳过</button>'+
    (hintIdx>0?'<button class="gray" id="hPrev" type="button">上一步</button>':'')+
    '<button id="hNext" type="button">'+(hintIdx===HINT_STEPS.length-1?'开始玩':'下一步')+'</button></div>';
  hintEl.classList.remove('hide');
  var bS=hintById('hSkip'), bP=hintById('hPrev'), bN=hintById('hNext');
  if(bS) bS.addEventListener('click',hideHint,false);
  if(bP) bP.addEventListener('click',function(){ hintIdx--; renderHint(); },false);
  if(bN) bN.addEventListener('click',function(){
    if(hintIdx>=HINT_STEPS.length-1) hideHint();
    else{ hintIdx++; renderHint(); }
  },false);
}
function showHint(){
  try{ if(localStorage.getItem('gravx_hint')==='1') return; }catch(e){}
  renderHint();
}
function hideHint(){
  hintDone=true;
  if(hintEl) hintEl.classList.add('hide');
  try{ localStorage.setItem('gravx_hint','1'); }catch(e){}
}

var _achWrap=(function(){
  function wrap(fn,after){
    var orig=fn;
    return function(){ var r=orig.apply(null,arguments); try{ after(r,arguments); }catch(e){} return r; };
  }
  try{
    explosion=wrap(explosion,function(n){ ACH_ST.explodes++; if(n>=30) ACH_ST.bigBang=1; });
    gust=wrap(gust,function(){ ACH_ST.gusts++; });
    if(typeof cutAt==='function') cutAt=wrap(cutAt,function(n){ ACH_ST.cuts+=(typeof n==='number'?n:1); });
    addRope=wrap(addRope,function(){ ACH_ST.ropes++; });
    addCloth=wrap(addCloth,function(){ ACH_ST.clothes++; });
    addSoft=wrap(addSoft,function(){ ACH_ST.softs++; });
    addTower=wrap(addTower,function(){ ACH_ST.towers++; });
    addSpring=wrap(addSpring,function(){ ACH_ST.springs++; });
    addRotor=wrap(addRotor,function(){ ACH_ST.rotors++; });
    addMagnet=wrap(addMagnet,function(){ ACH_ST.magnets++; });
    setTool=wrap(setTool,function(r,a){ if(r!==false) ACH_ST.tools[a[0]]=1; });
    setMat=wrap(setMat,function(r,a){ if(MATS[a[0]]) ACH_ST.mats[a[0]]=1; });
    if(typeof applyTheme==='function') applyTheme=wrap(applyTheme,function(r,a){ ACH_ST.themes[a[0]]=1; });
    loadScene=wrap(loadScene,function(r,a){ if(r!==false) ACH_ST.scenes[a[0]]=1; });
    togglePause=wrap(togglePause,function(){ ACH_ST.pauses++; });

var SHOW={ timers:[], playing:false, cur:null };
function showStop(){
  for(var i=0;i<SHOW.timers.length;i++) clearTimeout(SHOW.timers[i]);
  SHOW.timers.length=0; SHOW.playing=false; SHOW.cur=null;
}
function showById(id){ for(var i=0;i<SHOWS.length;i++){ if(SHOWS[i].id===id) return SHOWS[i]; } return null; }
function showPlay(id){
  var s=showById(id);
  if(!s) return false;
  showStop();
  if(LV.active&&typeof quitLevel==='function') quitLevel();
  try{ fresh(); }catch(e){}
  SHOW.playing=true; SHOW.cur=id;
  var acc=0;
  for(var i=0;i<s.steps.length;i++){
    (function(st){ SHOW.timers.push(setTimeout(function(){ if(!SHOW.playing) return; try{ st(); }catch(e){} }, acc)); })(s.steps[i].fn);
    acc+=s.steps[i].d;
  }
  SHOW.timers.push(setTimeout(function(){
    SHOW.playing=false; SHOW.cur=null;
    try{ if(typeof toast==='function') toast('剧目结束：'+s.n); }catch(e){}
  }, acc+400));
  return true;
}

var SHOW_PANEL=null;

  if(!SHOW_PANEL) return;
  var s='<div class="sechead">点一下开始播映 · '+(SHOW.playing?'正在上演，可随时停止':'全部剧目免费')+'</div>';
  if(SHOW.playing){
    s+='<div class="rows" style="margin-bottom:6px"><button class="chip" id="showStopBtn" type="button">⏹ 停止播放</button></div>';
  }
  for(var i=0;i<SHOWS.length;i++){
    var j=SHOWS[i];
    s+='<div class="card'+(SHOW.cur===j.id?' done':'')+'" data-show="'+j.id+'" style="margin:5px 0"><div class="t">'+(SHOW.cur===j.id?'▶️ ':'🎬 ')+j.n+'</div><div class="d">'+j.d+'</div></div>';
  }
  SHOW_PANEL.innerHTML=s;
  var sb=document.getElementById('showStopBtn');
  if(sb) sb.addEventListener('click',function(){ showStop(); showRender(); },false);
  var cards=SHOW_PANEL.querySelectorAll('[data-show]');
  for(var k=0;k<cards.length;k++){
    cards[k].addEventListener('click',function(){
      var id=this.getAttribute('data-show');
      showPlay(id);
      showRender();
    },false);
  }
}

var CHG_KEY='gravx_chg_v1';
var CHG={ active:false, mode:null, t0:0, dur:0, score:0, holdSec:0, base:null, timer:null, best:{} };
try{ var _chr=localStorage.getItem(CHG_KEY); if(_chr) CHG.best=JSON.parse(_chr)||{}; }catch(e){}
function chgSave(){ try{ localStorage.setItem(CHG_KEY, JSON.stringify(CHG.best)); }catch(e){} }
var CHG_MODES={
  boom:  { id:'boom',  n:'💥 爆破狂潮', d:'60 秒内引爆尽可能多的爆炸',  dur:60 },
  build: { id:'build', n:'🏗 建筑大赛', d:'60 秒内生成粒子/塔/绳子',     dur:60 },
  cut:   { id:'cut',   n:'✂️ 快刀手',   d:'60 秒内剪断尽可能多连接',     dur:60 },
  storm: { id:'storm', n:'🎈 满员风暴', d:'90 秒内让 150 颗粒子同时在场', dur:90 }
};
function chgStart(mode){
  if(CHG.active) return false;
  var def=CHG_MODES[mode];
  if(!def) return false;
  CHG.active=true; CHG.mode=mode; CHG.dur=def.dur; CHG.t0=nowMs(); CHG.score=0; CHG.holdSec=0;
  CHG.base={ explodes:(ACH_ST.explodes||0), balls:(ACH_ST.balls||0), towers:(ACH_ST.towers||0), ropes:(ACH_ST.ropes||0), cuts:(ACH_ST.cuts||0) };
  if(CHG.timer) clearInterval(CHG.timer);
  CHG.timer=setInterval(chgTick,250);
  try{ toast('挑战开始：'+def.n); }catch(e){}
  chgRender();
  return true;
}
function chgEnd(){
  if(!CHG.active) return;
  CHG.active=false;
  if(CHG.timer){ clearInterval(CHG.timer); CHG.timer=null; }
  var key=CHG.mode, best=CHG.best[key]||0, nb=CHG.score>best;
  if(nb){ CHG.best[key]=CHG.score; chgSave(); }
  try{ banner('挑战结束','得分 '+CHG.score+(nb?' · 新纪录！':' · 最高 '+best)); }catch(e){}
  try{ confettiBurst(); sfx('win',0.9); }catch(e){}
  chgRender();
}
function chgTick(){
  if(!CHG.active) return;
  var el=(nowMs()-CHG.t0)/1000;
  if(CHG.mode==='boom') CHG.score=Math.max(0,(ACH_ST.explodes-CHG.base.explodes))*10;
  else if(CHG.mode==='build') CHG.score=Math.max(0,(ACH_ST.balls-CHG.base.balls))+Math.max(0,(ACH_ST.towers-CHG.base.towers))*15+Math.max(0,(ACH_ST.ropes-CHG.base.ropes))*12;
  else if(CHG.mode==='cut') CHG.score=Math.max(0,(ACH_ST.cuts-CHG.base.cuts))*5;
  else if(CHG.mode==='storm'){ if(P.length>=150) CHG.holdSec+=0.25; CHG.score=Math.round(CHG.holdSec*8); }
  if(el>=CHG.dur){ chgEnd(); return; }
  chgRender();
}
function chgRemain(){ return CHG.active?Math.max(0,CHG.dur-(nowMs()-CHG.t0)/1000):0; }
var CHG_PANEL=null;
function chgRender(){
  if(!CHG_PANEL) return;
  var s='<div class="sechead">限时挑战 · 结束后自动结算 · 纪录保存在本机</div>';
  if(CHG.active){
    var def=CHG_MODES[CHG.mode];
    s+='<div class="card done"><div class="t">⏱ '+def.n+' 进行中</div>'+
       '<div class="d">剩余 <b>'+Math.ceil(chgRemain())+'</b> 秒 · 当前得分 <b>'+CHG.score+'</b></div>'+
       '<div style="height:7px;border-radius:4px;background:rgba(255,255,255,.08);margin-top:6px">'+
       '<div style="height:100%;width:'+Math.round((1-chgRemain()/CHG.dur)*100)+'%;border-radius:4px;background:linear-gradient(90deg,var(--acc),var(--acc2))"></div></div>'+
       '<div class="rows" style="margin-top:8px"><button class="chip" id="chgStop" type="button">⏹ 放弃</button></div></div>';
  }
  for(var k in CHG_MODES){
    var m=CHG_MODES[k];
    s+='<div class="card" style="margin:5px 0"><div class="t">'+m.n+'</div><div class="d">'+m.d+'</div>'+
       '<div class="d" style="margin-top:4px">时长 '+m.dur+'s · 最高分 <b>'+(CHG.best[m.id]||0)+'</b></div>'+
       (!CHG.active?'<div class="rows" style="margin-top:8px"><button class="chip" data-chg="'+m.id+'" type="button">▶ 开始挑战</button></div>':'')+
       '</div>';
  }
  CHG_PANEL.innerHTML=s;
  var st=document.getElementById('chgStop');
  if(st) st.addEventListener('click',function(){ chgEnd(); },false);
  var btns=CHG_PANEL.querySelectorAll('[data-chg]');
  for(var i=0;i<btns.length;i++){
    btns[i].addEventListener('click',function(){ chgStart(this.getAttribute('data-chg')); },false);
  }
}
(function chgBuildUI(){
  var tabs=document.getElementById('tabs'), panels=document.getElementById('panels');
  if(!tabs||!panels) return;
  var t=document.createElement('button');
  t.type='button'; t.className='tab'; t.setAttribute('data-tab','pChg');
  t.innerHTML='⏱挑战';
  tabs.appendChild(t);
  var p=document.createElement('div');
  p.className='panel'; p.id='pChg';
  panels.appendChild(p);
  CHG_PANEL=p;
  chgRender();
})();

var QUIZ_PANEL=null;
function quizStart(){ QUIZ.idx=0; QUIZ.score=0; QUIZ.active=true; QUIZ.done=false; QUIZ.chosen=-1; quizRender(); }
function quizPick(i){
  if(!QUIZ.active||QUIZ.chosen>=0) return;
  QUIZ.chosen=i;
  if(i===QUIZ_QS[QUIZ.idx].a){ QUIZ.score++; try{ sfx('hit',0.5); }catch(e){} }
  else { try{ sfx('boom',0.3); }catch(e){} }
  quizRender();
}
function quizNext(){
  if(QUIZ.chosen<0) return;
  QUIZ.chosen=-1;
  QUIZ.idx++;
  if(QUIZ.idx>=QUIZ_QS.length){
    QUIZ.active=false; QUIZ.done=true; QUIZ.plays++;
    if(QUIZ.score>QUIZ.best) QUIZ.best=QUIZ.score;
    quizSave();
    try{ if(QUIZ.score>=10) confettiBurst(); sfx('win',0.8); }catch(e){}
  }
  quizRender();
}
function quizRender(){
  if(!QUIZ_PANEL) return;
  var s='<div class="sechead">12 道物理小测验 · 最佳成绩 '+QUIZ.best+'/'+QUIZ_QS.length+' · 挑战次数 '+QUIZ.plays+'</div>';
  if(!QUIZ.active&&!QUIZ.done){
    s+='<div class="card"><div class="t">🧠 准备开始</div><div class="d">答对越多越懂这台物理沙盘。单选，每题即时判分。</div>'+
       '<div class="rows" style="margin-top:8px"><button class="chip" id="quizGo" type="button">▶ 开始测试</button></div></div>';
  } else if(QUIZ.active){
    var q=QUIZ_QS[QUIZ.idx];
    s+='<div class="card"><div class="t">第 '+(QUIZ.idx+1)+'/'+QUIZ_QS.length+' 题 · 当前得分 '+QUIZ.score+'</div>'+
       '<div class="d" style="margin:6px 0 8px">'+q.q+'</div>';
    for(var i=0;i<q.opts.length;i++){
      var st='';
      if(QUIZ.chosen>=0){
        if(i===q.a) st=' done';
        else if(i===QUIZ.chosen) st='';
      }
      s+='<div class="rows" style="margin:4px 0"><button class="chip'+st+'" data-qp="'+i+'" type="button">'+q.opts[i]+'</button></div>';
    }
    if(QUIZ.chosen>=0){
      var ok=QUIZ.chosen===q.a;
      s+='<div class="d" style="margin-top:8px">'+(ok?'✅ 答对了！':'❌ 正确答案：'+q.opts[q.a])+'<br>💡 '+q.tip+'</div>'+
         '<div class="rows" style="margin-top:8px"><button class="chip" id="quizNextBtn" type="button">'+(QUIZ.idx+1>=QUIZ_QS.length?'查看成绩':'下一题 ▶')+'</button></div>';
    }
    s+='</div>';
  } else if(QUIZ.done){
    var pct=Math.round(QUIZ.score/QUIZ_QS.length*100);
    s+='<div class="card done"><div class="t">🎓 测试完成</div>'+
       '<div class="d">得分 <b>'+QUIZ.score+'/'+QUIZ_QS.length+'</b>（'+pct+'%）'+(QUIZ.score===QUIZ_QS.length?' · 满分学霸！':'')+'</div>'+
       '<div class="rows" style="margin-top:8px"><button class="chip" id="quizAgain" type="button">🔁 再来一次</button></div></div>';
  }
  QUIZ_PANEL.innerHTML=s;
  var go=document.getElementById('quizGo'); if(go) go.addEventListener('click',quizStart,false);
  var nx=document.getElementById('quizNextBtn'); if(nx) nx.addEventListener('click',quizNext,false);
  var ag=document.getElementById('quizAgain'); if(ag) ag.addEventListener('click',quizStart,false);
  var opts=QUIZ_PANEL.querySelectorAll('[data-qp]');
  for(var k=0;k<opts.length;k++){
    opts[k].addEventListener('click',function(){ quizPick(parseInt(this.getAttribute('data-qp'),10)); },false);
  }
}

  play: { n:'🎮 游玩', ids:['pTools','pScenes','pLevels'] },
  make: { n:'🎨 创意', ids:['pShow','pBlue','pAcademy'] },

  sys:  { n:'💾 系统', ids:['pSave','pSet'] }

var LAYOUT={ cat:'all', bar:null };
function layoutApply(cat){
  var tabs=document.getElementById('tabs');
  if(!tabs) return false;
  if(cat!=='all'&&!LAYOUT_CATS[cat]) return false;
  LAYOUT.cat=cat;
  var ch=tabs.children, i, first=null;
  for(i=0;i<ch.length;i++){
    var b=ch[i];
    var id=b.getAttribute&&b.getAttribute('data-tab');
    if(!id) continue;
    var show=(cat==='all')||(LAYOUT_CATS[cat].ids.indexOf(id)>=0);
    b.style.display=show?'':'none';
    if(show&&!first) first=b;
  }
  var curOn=null;
  for(i=0;i<ch.length;i++){ if(ch[i].classList&&ch[i].classList.contains('on')) curOn=ch[i]; }
  if(curOn&&curOn.style.display==='none'&&first&&first.click) first.click();
  layoutMark();
  return true;
}
function layoutMark(){
  if(!LAYOUT.bar) return;
  var btns=LAYOUT.bar.querySelectorAll('[data-cat]');
  for(var i=0;i<btns.length;i++){
    var on=btns[i].getAttribute('data-cat')===LAYOUT.cat;
    btns[i].classList.toggle('on',on);
    btns[i].style.opacity=on?'1':'0.55';
    btns[i].style.fontWeight=on?'700':'400';
  }
}
(function layoutBuild(){
  var tabs=document.getElementById('tabs');
  if(!tabs||!tabs.parentNode) return;
  var bar=document.createElement('div');
  bar.id='catBar';
  bar.style.cssText='display:flex;gap:6px;padding:6px 8px 2px;overflow-x:auto;-webkit-overflow-scrolling:touch';
  var make=function(cat,label){
    var b=document.createElement('button');
    b.type='button'; b.className='chip'; b.setAttribute('data-cat',cat);
    b.textContent=label;
    b.addEventListener('click',function(){ layoutApply(cat); var sh=document.getElementById('sheet'); if(sh) sh.classList.add('open'); },false);
    bar.appendChild(b);
    return b;
  };
  make('all','🗂 全部');
  for(var k in LAYOUT_CATS) make(k,LAYOUT_CATS[k].n);
  tabs.parentNode.insertBefore(bar,tabs);
  LAYOUT.bar=bar;
  layoutMark();
})();

function layoutPeek(){
  var sheet=document.getElementById('sheet');
  if(!sheet) return;
  var hEl=document.getElementById('handle'), tEl=document.getElementById('tabs');
  var h=(hEl&&hEl.offsetHeight)||22;
  var c=(LAYOUT.bar&&LAYOUT.bar.offsetHeight)||43;
  var t=(tEl&&tEl.offsetHeight)||43;
  sheet.style.setProperty('--peek',Math.round(h+c+t+18)+'px');
}

/* ---------- 合成音效（WebAudio 合成，环境不支持时静默） ---------- */
var AC=null;
function audioCtx(){
  if(AC) return AC;
  try{
    var C=window.AudioContext||window.webkitAudioContext;
    if(!C) return null;
    AC=new C();
  }catch(e){ AC=null; }
  return AC;
}
function noiseSrc(ac,dur){
  var len=Math.max(1,Math.floor(ac.sampleRate*dur));
  var buf=ac.createBuffer(1,len,ac.sampleRate);
  var d=buf.getChannelData(0);
  for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
  var src=ac.createBufferSource(); src.buffer=buf;
  return src;
}
function noiseBurst(ac,v,dur,freq){
  try{
    var src=noiseSrc(ac,dur);
    var f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq||800;
    var g=ac.createGain();
    var t=ac.currentTime;
    g.gain.setValueAtTime(v,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    src.connect(f); f.connect(g); g.connect(ac.destination);
    src.start(t); src.stop(t+dur+0.05);
  }catch(e){}
}
function sfx(name,vol,kind){
  try{
    if(muted) return;
    var ac=audioCtx(); if(!ac) return;
    if(ac.state==='suspended'&&ac.resume){ try{ ac.resume(); }catch(e){} }
    var v=((vol==null)?1:vol)*((SET.volume==null)?0.8:SET.volume);
    if(!(v>0.001)) return;
    var t=ac.currentTime;
    if(name==='boom'){
      var o=ac.createOscillator(), g=ac.createGain();
      o.type='sine';
      o.frequency.setValueAtTime(150,t);
      o.frequency.exponentialRampToValueAtTime(34,t+0.42);
      g.gain.setValueAtTime(v,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.46);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+0.5);
      noiseBurst(ac,v*0.5,0.26,900);
    } else if(name==='whoosh'){
      var src=noiseSrc(ac,0.5);
      var bq=ac.createBiquadFilter();
      bq.type='bandpass'; bq.Q.value=1.1;
      bq.frequency.setValueAtTime(520,t);
      bq.frequency.exponentialRampToValueAtTime(2100,t+0.34);
      var g2=ac.createGain();
      g2.gain.setValueAtTime(0.0001,t);
      g2.gain.exponentialRampToValueAtTime(v*0.9,t+0.06);
      g2.gain.exponentialRampToValueAtTime(0.001,t+0.44);

      src.start(t); src.stop(t+0.5);

      var base=(kind==='wall')?180:((kind==='rotor')?120:((kind==='ball')?230:200));
      var o2=ac.createOscillator(), g3=ac.createGain();
      o2.type='triangle';
      o2.frequency.setValueAtTime(base*3.2,t);
      o2.frequency.exponentialRampToValueAtTime(base,t+0.07);
      g3.gain.setValueAtTime(v*0.6,t);
      g3.gain.exponentialRampToValueAtTime(0.001,t+0.09);
      o2.connect(g3); g3.connect(ac.destination); o2.start(t); o2.stop(t+0.1);
    } else if(name==='win'){
      var seq=[523,659,784,1047];
      for(var i=0;i<seq.length;i++){
        var oo=ac.createOscillator(), gg=ac.createGain();
        oo.type='sine'; oo.frequency.value=seq[i];

        gg.gain.setValueAtTime(0.0001,ts);
        gg.gain.exponentialRampToValueAtTime(v*0.5,ts+0.02);
        gg.gain.exponentialRampToValueAtTime(0.001,ts+0.28);
